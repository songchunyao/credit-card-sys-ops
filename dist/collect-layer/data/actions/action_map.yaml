  check_dorado_write_quota: a_check_dorado_ctrl
  check_dorado_alarm: a_check_dorado_alarm
  check_dorado_ctrl_log: a_check_dorado_alarm
  check_dorado_ctrl_fault_led: a_check_dorado_hw
  check_dorado_ctrl_power: a_check_dorado_hw
  check_dorado_vol_mapping: a_check_lun_mapping
