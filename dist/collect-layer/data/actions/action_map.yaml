  collect_failed_link_detail: a_verify_ultrapath_path
  rebalance_nvme_path: a_ultrapath_rescan
  check_ultrapath_registration: a_check_kernel_module
  rebuild_initramfs: a_rebuild_initramfs
  upgrade_ultrapath: a_upgrade_driver
  check_compat_matrix: a_check_compat_matrix

  # ── NVMe / 内核模块 ──
  collect_nvme_ctrl_detail: a_check_nvme_subsys
  check_ctrl_conn: a_check_nvme_subsys
  verify_nvme_namespace: a_check_nvme_subsys
  load_kernel_module: a_reload_kernel_module
  check_module_dependency: a_check_kernel_module
  upgrade_kernel_module: a_upgrade_driver

  # ── RoCE / 网络 ──
  check_roce_link: a_check_roce_port
  check_roce_network: a_check_roce_port
  check_roce_connectivity: a_check_roce_port
  check_roce_path: a_check_roce_port
  check_nic_health: a_check_roce_port
