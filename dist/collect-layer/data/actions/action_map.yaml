# GaussDB 运维 Agent · 动作语义映射表
# =============================================================================
# 背景（2026-09-11 实测）：
#   规则 YAML 的 `then.next_actions` 与 runbook 的 `recommended_actions[].action_id`
#   共 **101 个动作引用全部悬空** —— 因为两套命名从未对齐：
#     · 规则侧：snake_case 语义标签（check_roce_link / collect_plan / extend_lv）
#     · 注册表：`a_*` 可执行动作（service/main.py::_ACTION_DEFS）
#   后果：propose_actions 只能产出数据库域建议；存储类规则命中后无任何可执行动作，
#        Agent 只能自由发挥 ⇒ L1/L2/L3 分级失真。
#
# 本表建立三方契约（rules.next_actions ↔ 本表 ↔ _ACTION_DEFS）：
#   kind: action  —— 可执行动作，action_id 必须存在于 _ACTION_DEFS
#   kind: collect —— **补充采集指令**（不是动作）：应转成 gather 调用，不产生变更
#
# 由 tests/test_contracts.py 的 C11 断言锁定：
#   ① 所有 next_actions / runbook.action_id 都必须在本表登记
#   ② 所有 kind=action 的 action_id 必须存在于 _ACTION_DEFS
#   ③ 本表不得存在未被引用的僵尸条目（防止表本身腐烂）
# =============================================================================

# ── 补充采集类（转 gather，零变更；risk 恒 L1）──
collects:
  a_collect_detail: "补充采集明细（会话/锁/事务/计划等，走 gather）"

# ── 动作映射：语义标签 → 可执行动作 id ──
map:
  # ── 数据库域 ──
  collect_slow_sql_topn: a_query_slow_sql
  collect_plan: a_query_slow_sql
  collect_plan_detail: a_collect_detail
  collect_plan_compare: a_collect_detail
  collect_index_info: a_collect_detail
  collect_table_scan: a_collect_detail
  collect_disk_health: a_check_disk_io
  collect_top_cpu_sql: a_collect_detail
  collect_blocking_chain: a_collect_detail
  collect_long_transaction: a_collect_detail
  collect_transaction_detail: a_collect_detail
  collect_session_distribution: a_collect_detail
  collect_session_wait: a_collect_detail
  collect_replication_detail: a_collect_detail
  collect_change_detail: a_collect_detail
  analyze_cache_hotness: a_collect_detail
  analyze_distribution: a_collect_detail
  analyze_dead_tup: a_analyze
  run_vacuum: a_vacuum
  kill_deadlock_sessions: a_kill_session
  sql_rewrite: a_sql_rewrite
  cast_fix: a_sql_rewrite
  optimize_sort: a_sql_rewrite
  rebuild_index: a_reindex
  drop_unused_index: a_drop_index
  rebalance_data: a_sql_rewrite
  increase_work_mem: a_param_change
  increase_shared_buffers: a_param_change
  adjust_wlm_queue: a_param_change
  throttle_low_priority: a_sql_throttle

  # ── 多路径 / UltraPath ──
