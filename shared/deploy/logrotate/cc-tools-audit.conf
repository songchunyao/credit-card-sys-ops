##############################################################################
# cc-tools-audit —— 信用卡系统跨层运维智能体 · 审计链 JSONL 轮转配置
#
# 依据裁决 R-29（权威文本：tmp/_m3_worklist.md 的 §L）：
#   ① 服务侧**只追加**，永不自行截断/轮转/删除审计文件（本文件是唯一的轮转执行者）；
#   ② 轮转与保留交给外部 logrotate，必须用 rename + create，**禁**用就地截断类做法；
#      服务对轮转无感知（每次调用才 open(path, "a")，不得长期持有 fd）；
#      策略基线 = 单文件 64 MiB 轮转 / 保留 >= 90 天；
#   ③ 每个评测代（generation）必须有声明式来源起点；操作步骤与起点标记格式
#      见同目录 README.md §4（时间 + PID + 首个 requestId + 起始行数 0 + 文件 sha256）；
#   ④ 已混装的历史文件按 requestId/时点切分登记，**不物理删除**；
#   ⑤ M5 评测开跑前必须新开一代审计文件并记录起点标记。
#
# 安装路径（**本文件当前只存在于仓库内，尚未安装到任何主机**）：
#     仓库内            : shared/deploy/logrotate/cc-tools-audit.conf
#     生产机安装目标    : /etc/logrotate.d/cc-tools-audit
#     安装命令（示例）  : sudo install -m 0644 -o root -g root \
#                             shared/deploy/logrotate/cc-tools-audit.conf \
#                             /etc/logrotate.d/cc-tools-audit
#
# ★ 安装属于变更操作：**必须经用户（人类）确认后由人工在生产机执行**。
#   本文件不得由任何自动化流程直接投放，也不得在未确认时被 cron/systemd 引用。
#   安装前先做 dry-run 复核（不加 -f 不会真的轮转）：
#       sudo logrotate -d /etc/logrotate.d/cc-tools-audit
#   注意 logrotate 要求 /etc/logrotate.d 下的配置文件不得 group/world 可写，
#   因此安装模式固定 0644（或 0600），不要放宽。
#
# 被覆盖的三个审计文件（R-27 落地后三个服务 CC_AUDIT_LOG 的实际路径）：
#     服务             监听    审计文件路径
#     KG-Q             :8301   /opt/cc-tools-kg/cc_tools_audit.jsonl
#     ONTO-Q           :8302   /opt/cc-tools-onto/cc_tools_onto_audit.jsonl
#     KG-T             :8303   /opt/cc-tools-kg/kgt/cc_tools_kgt_audit.jsonl
#
# 为什么写成三个独立 block：三条路径分属两个目录（其中一条嵌套两层），
# 生产机上可能由不同运行用户持有；每个 block 自带**完整**策略，不依赖任何
# 顶层全局指令，避免「全局指令被改动 / 本文件被单独传给 logrotate 而不是经
# /etc/logrotate.conf include」时策略被静默放宽。
#
# 关于 create 的属主/属组：这里**有意只写模式 0640**并省略 owner/group。
#   logrotate(8) 原文：「Any of the log file attributes may be omitted, in which
#   case those attributes for the new file will use the same values as the original
#   log file for the omitted attributes.」
#   ⇒ 轮转后新建的文件沿用被轮转文件的属主/属组，因此本仓库**不需要**、也
#     不得臆造生产机的用户名。若生产机要求显式指定（例如目录属主与运行用户
#     不同，或需要与文件本身不同的属主），按**实测值**改成：
#         create 0640 <运行用户> <运行组>
#     两个值必须取自生产机实测，不得猜测：
#         ls -l /opt/cc-tools-kg/cc_tools_audit.jsonl
#         ps -o user=,group= -p "$(cat /opt/cc-tools-kg/cc_tools.pid)"
#
# 关于 su（可选，需实测值）：logrotate(8) 建议「logrotate 以 root 运行时，
#   对由非特权用户直接或间接控制的目录使用 su」。若生产机上 /opt/cc-tools-*
#   的属主不是 root，请在本文件对应 block 内**显式**增加一行：
#         su <运行用户> <运行组>
#   su 的用户必须有能力按 create 指定的 ownership 建文件，否则 logrotate 报错
#   并拒绝轮转；同样不得凭猜测填写。
#
# 关于轮转命名：本文件**不使用** dateext。同日可能因 maxsize 触发多次轮转，
#   而 dateext 的默认 %Y%m%d 后缀在同日第二次轮转时会命名冲突；数字后缀
#   （.1 … .90）在一天多次轮转下仍能正确保留 rotate 指定的世代数。
#
# 关于运行频率（重要）：maxsize 只在 logrotate **进程运行时**才被检查。
#   logrotate(8)：「It will not modify a log more than once in one day unless the
#   criterion for that log is based on the log's size and logrotate is being run
#   more than once each day」。
#   ⇒ 若 logrotate 每天只跑一次，64 MiB 的硬上限在两次运行之间**不生效**，
#     高流量日可能写出远超 64 MiB 的单文件。生产机应把运行频率提高到每小时
#     （systemd 的 logrotate.timer，或 cron 的 hourly 调度）；此时 daily 保证
#     「每天至多一次按时间轮转」，maxsize 额外保证「超过 64 MiB 就轮转」。
#
# 本文件**未在任何主机上安装、未做过真机轮转验证**——见 README.md §5 诚实边界。
##############################################################################


# ---------------------------------------------------------------------------
# KG-Q 主臂（:8301）—— /opt/cc-tools-kg/cc_tools_audit.jsonl
# ---------------------------------------------------------------------------
/opt/cc-tools-kg/cc_tools_audit.jsonl {
    daily
    rotate 90
    maxsize 64M
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}


# ---------------------------------------------------------------------------
# ONTO-Q 主臂（:8302）—— /opt/cc-tools-onto/cc_tools_onto_audit.jsonl
# ---------------------------------------------------------------------------
/opt/cc-tools-onto/cc_tools_onto_audit.jsonl {
    daily
    rotate 90
    maxsize 64M
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}


# ---------------------------------------------------------------------------
# KG-T 第二套门面（:8303）—— /opt/cc-tools-kg/kgt/cc_tools_kgt_audit.jsonl
# 注意：该文件是 R-29 第 ④ 条的适用对象（R-27 之前混入过探针手工产生的行）。
# 混入行只做**登记切分**，不物理删除；轮转保留策略与其他两个文件一致。
# ---------------------------------------------------------------------------
/opt/cc-tools-kg/kgt/cc_tools_kgt_audit.jsonl {
    daily
    rotate 90
    maxsize 64M
    compress
    delaycompress
    missingok
    notifempty
    create 0640
}
