version: 0.1.1
type: plugin
author: cc-ops
name: neo4j_cypher_query
label:
  en_US: Neo4j Cypher Query (cc-ops fork)
  ja_JP: Neo4j Cypher クエリ（cc-ops fork）
  zh_Hans: Neo4j Cypher 查询（cc-ops fork）
  pt_BR: Consulta Cypher Neo4j (cc-ops fork)
description:
  en_US: Read-only Neo4j knowledge-graph query tool for Dify Agents (cc-ops local fork of nikola_milosevic/neo4j_query 0.2.0). Cypher query and optional parameters are exposed to the LLM so an Agent can run graph queries on its own; max_records and allow_write_queries stay workflow-controlled and the upstream EXPLAIN write guard is unchanged.
  ja_JP: Dify Agent が自律的に使う読み取り専用の Neo4j 照会ツール（cc-ops ローカル fork）。
  zh_Hans: 供 Dify Agent 自主使用的只读 Neo4j 知识图谱查询工具（cc-ops 对 nikola_milosevic/neo4j_query 0.2.0 的本地 fork）。Cypher query 与可选 parameters 交给模型填写，使 Agent 能自主发起图查询；max_records 与 allow_write_queries 仍由工作流控制，上游的 EXPLAIN 写保护原样保留。
  pt_BR: Ferramenta de consulta somente leitura do grafo Neo4j para Agentes Dify (fork local cc-ops).
icon: icon.svg
resource:
  memory: 268435456
  permission:
    tool:
      enabled: true
    node:
      enabled: false
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 1048576
plugins:
  tools:
    - provider/neo4j_query.yaml
meta:
  version: 0.1.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: null
created_at: 2026-09-29T14:08:34+08:00
privacy: PRIVACY.md
verified: false
