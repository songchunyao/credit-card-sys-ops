  - {path: service/probes/app_probe.py,       kind: patched, batch: M2.10, note: "同窗口基线；两次采样受 APP_DELTA_SAMPLE 控制（默认关）"}
  - {path: service/probes/container_probe.py, kind: rewritten, batch: "2026-10-12", note: "★ 通道整体换掉：k8s Prometheus → Docker Engine API（身份/状态/限额/Env）+ 宿主 cgroup v2（cpu.stat.nr_throttled / memory.events.oom_kill）+ 宿主 /proc（兜底定位 cgroup 路径）。窗口基线改为**采集侧状态文件**（cgroup 文件无历史，Prometheus 才有的 increase() 不可用）"}
  - {path: service/probes/container_probe.py, kind: patched, batch: "2026-10-12 P0.6", note: "★ 新增**应用节点本机 OS 指标**（_local_host_os_facts）：读 /host/proc/{stat,meminfo,loadavg,diskstats} ⇒ host.cpu_usage / os.mem.free_kb+total_kb / os.load.avg1+avg5 / host.disk_util / node.disk_io_wait。根因：os 探针是 SSH 式的、目标只来自 GAUSSDB_NODES（3 个 DB 节点），**从不含应用节点**（build-host=192.0.2.11，与 DB 的 192.0.2.x 不同网段）⇒ Host 对象建得出来但 host.* 指标零条。采集容器已挂 /host/proc ⇒ 本地直读即可，**无需 SSH/凭据，且这些 path 早已有到 host.* 的映射（零契约改动）**"}
  - {path: service/probes/app_probe.py,       kind: rewritten, batch: "2026-10-12", note: "★ 通道整体换掉：HTTP GET /health（应用不监听任何端口）→ Docker API 读 Config.Env + 宿主 /proc/<宿主pid>/{status,stat,cmdline}（app.thread_count / app.uptime_s）+ GaussDB pg_stat_activity 按 application_name 归因（app.datasource.{active,idle}_connections）。JVM 内部量与 HikariCP 池内计数器**如实登记为无通道**，不伪造 0"}
  - {path: service/probes/app_probe.py,       kind: patched,   batch: "2026-10-12 P0-B", note: "★ 新增应用实时遥测日志通道（read_telemetry）：解析 `/out/logs/ccsim-<hostname>-*.log` 的 `[run] phase=… tps=… p50/p95/p99` 与 `连接池获取偏慢 … 耗时=Xms`、池建/关计数 ⇒ app.endpoint.{qps,p99_ms,error_rate} 与 app.datasource.acquire_wait_ms。带**时效保护**：超过 CC_APP_TELEMETRY_MAX_AGE_S 报 notCollected(telemetry_stale)，不把陈旧读数当现值"}
  - {path: service/probes/gaussdb_probe.py,   kind: patched,   batch: "2026-10-12 P0.5", note: "★ 新增窗口基线（delta）：累计计数器/量规经**采集侧状态文件**做差，让 predicate:increased/decreased 可机判。单调计数器（deadlocks/xact_rollback/slow_sql_count/temp_files_count/seq_scan/idx_scan）差值为负视为重置⇒不产出、不取绝对值；量规（n_dead_tup/会话类）允许负增量。键=path|obj_id（Table 级逐表做差）；deltaWindowS=实际间隔；基线过期⇒不产出"}
  - {path: service/probes/gaussdb_probe.py,   kind: patched,   batch: "2026-10-13 M1/M2/M3", note: "★ 修三处「判据恒不成立」的采集缺陷（由 fi-e2e 端到端故障注入测试发现，免部署重放验证 PASS）：① session_detail 新增 xact_age_ms —— 原实现把 xact_start 渲染成无时区字符串（DB 会话时区 Etc/GMT-8）再与探针宿主机 datetime.now()（UTC）相减 ⇒ transaction.duration_ms 恒为 -8h（实测 -28797184），改用 SQL 内 now()-xact_start；② sessions.lock_wait 原用 count(CASE WHEN enqueue IS NOT NULL) ⇒ GaussDB 不填 enqueue，恒 0，改用 (SELECT count(*) FROM pg_locks WHERE NOT granted)（实测注入 biz_hot_row 时 0 vs 6，7 个 waiting 会话）；③ session_detail 新增 lock_wait_type（pg_locks NOT granted 按 pid 关联的 locktype，实测 tuple/transactionid，均在契约 enum 内），替代原 sd.get(chr(39)enqueue(chr(39)) or chr(39)lock_wait(chr(39)) 的恒字面量兜底。影响：FM-DB-LOCK-WAIT 由不可判变可判，覆盖 db_lock/sql_long_tx/biz_hot_row/biz_lock_range/sql_lock_chain 5 类注入。"}
  - {path: service/collect_api.py,            kind: modified, batch: "(上游工作区既有改动)", note: "上游 HEAD 之后被改；与探针补丁同批带走的既成事实"}
  - {path: service/probes/gaussdb_probe.py,   kind: modified, batch: "(上游工作区既有改动)", note: "同上"}

