# =============================================================================
# shared/deploy/port/collect-layer.manifest.yaml
#   采集层（:8187 数据面）**打包 / 移植**的单一事实源。
#
#   采集层源码**随本仓一起发布**（`dist/collect-layer/`，本项目自研）。本清单把
#   「打包时必须带走什么、每个文件的指纹是什么」变成一个**可机器校验**的声明：
#   `pack_collect_layer.py --source dist/collect-layer --verify` 逐文件对账
#   （bytes + sha256），不一致即 FAIL；树不在时报 BLOCKED，**不冒充 PASS**。
#
#   ★★ 权威来源 = `Dockerfile.collect` 的 COPY 清单，**不是** import 闭包。
#      实测证明 import 闭包**不可**作为打包依据（三个反例见 `why_not_closure`）。
#
#   ★ 术语：下文「上游 / 上游基线」= 该树**迁入本仓之前**的开发仓库（同一作者）；
#     它只用于记录指纹来源与改动历史。该树现已并入本仓，与全仓同为 Apache-2.0。
# =============================================================================

meta:
  contract: collect-layer-port
  version: "1.0.0"
  date: "2026-10-07"
  source_repo: "credit-card-sys-ops（本仓；该树迁入前在作者的另一仓库中开发）"
  source_git_head: "8dcdefdfc11184cee6e385a1581985c2094e84cf"   # 2026-09-28，迁入基线
  source_git_head_short: "8dcdefd"
  authoritative_source: "Dockerfile.collect 的 COPY 清单（L76-L82）"
  service_port: 8187
  python: "3.12（python:3.12-slim；生产 venv 实测 3.12.3）"
  launch: >-
    tini -- sh -c "exec python -m uvicorn service.app_collect:app
    --host 0.0.0.0 --port ${SVC_PORT} --workers 1"
  required_env:
    SVC_PORT: "8187（8181 为 v3 栈；单实例只监听一个）"
    PYTHONPATH: "/app（或移植后 = bundle 根）"
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  env_file: ".env（键名权威 = .env.example；**镜像内不含任何密钥**，全部运行时注入）"

# -----------------------------------------------------------------------------
# 为什么不拿 import 闭包当打包依据（三条实测反例，都会导致漏文件）
# -----------------------------------------------------------------------------
why_not_closure:
  - id: W1-soft-dep
    what: "service/collect_sim.py —— ★ 本条已被实测**证伪**，它**不是**软依赖（2026-10-12）"
    detail: >-
      原文（2026-10-07）声称：collect_api.py:43-49 有三重 try/except 守卫
      ⇒ 缺它合法降级为 `_sim = None`，且「上游 Dockerfile.collect 刻意不 COPY 它」。
      同时 `optional_soft_deps` 把它登记为「打包时**不带**」，打包器还会**断言它不在包里**。
      ★ 实测证伪（在 部署宿主 的容器化部署上，缺它时的真实后果）：
        gaussdb_probe.py:630-636 在**正常 live 路径**上就调用
            conn = await _sim.connect_async((async_gaussdb.connect if _has_driver else None), self._conn_kwargs)
        它注释里写的语义是「live 模式下这三个调用**零介入**（直通真实实现）」——
        即 `collect_sim` 是**必经的 tap 层**，live 模式不是"绕过它"而是"经它直通"。
        缺它 ⇒ `_sim = None` ⇒ 每次采集第一句即
            AttributeError: 'NoneType' object has no attribute 'connect_async'
        ⇒ **gaussdb 层全部探针段产出为 0**，只剩 `_real_topology()` 那条独立路径给的
          8 条拓扑身份事实。而 `/health` 的 `gaussdb.ok` **仍然是 true**（它走的是
          另一条查询路径）⇒ 表面上"数据库连得上"，实际**采集面整体失效**，极易误判。
        实测读数（同一套环境，只差这一个文件）：
            缺：total_facts=8    layer_errors={'gaussdb': "'NoneType' object has no attribute 'connect_async'"}
            有：total_facts=505  layer_errors=None   layer_details.gaussdb.fact_count=497
      ⇒ 结论：**它是必需文件**。已移入 `required_files`；本清单不再允许把它排除。
      ⇒ 教训（通用）：`try/except ImportError → None` 只证明"**导入**可以失败"，
        不证明"**功能**可以降级"。判断一个依赖是否必需，必须看**调用点**，不看导入点的守卫。
  - id: W2-lazy-path
    what: "storages/dorado_collector.py 是**惰性 import + 运行时 sys.path 插入**"
    detail: >-
      storage_probe.py:185 / :413 在函数体内 `from dorado_collector import ...`；
      :80-83 先用「本文件上溯 3 级 + /storages」算出目录并 sys.path.insert。
      ⇒ 动态 import 闭包**看不到它**（只在真正采存储层时才加载）。
      漏掉它 ⇒ 存储层探针在移植后运行期才失败。
  - id: W3-data-files
    what: "data/ 是**数据文件**，任何 import 闭包都看不到"
    detail: >-
      Dockerfile.collect L82 `COPY data/ /app/data/`；消费者实测 = storage_probe.py:421
      引用 `data/rules/{default,advanced}.yaml` 的存储层规则。共 4 个文件。

# -----------------------------------------------------------------------------
# 布局硬约束（移植时**不得**拍平目录）
# -----------------------------------------------------------------------------
layout_constraint:
  rule: "`service/` 与 `storages/` 必须是**同级目录**，且 `data/` 与其同级"
  why: >-
    storage_probe.py:80-83 用 `dirname(dirname(dirname(abspath(__file__)))) + /storages`
    定位 dorado 采集器 ⇒ 目录层级是**运行期契约**，拍平会让存储层探针找不到模块。
  check: "pack 时断言 <bundle>/service/probes/storage_probe.py 与 <bundle>/storages/ 同级存在"

