  icon: {background: "#3B82F6", content: "🔧"}
  # ★ info.title / info.description 必须是**与 provider 名无关的常量**：
  #   cc-kg-tools 与 cc-onto-tools 的 schema 要求「除 servers[0].url 外逐字相同」，
  #   若 title 里内插 provider 名，两侧字节就不相等了（R-31 方案 A′）。
  info_title: "M4 运维工具体系"
  info_description: "M4 工具体系 · 只读运维工具集（声明面 shared/deploy/dify/binding.yaml）"
  http_method: post
  responses_200: {description: ok, content: {application/json: {schema: {type: object}}}}
  # Dify 的 OpenAPI→Dify 参数类型归一化（**只作用于模型面投影 leg B**）：
  #   schema 写 integer ⇒ live parameters[].type 读回 number；
  #   schema 写 object   ⇒ live parameters[].type 读回 string；
  #   string/array/boolean/number 原样。
  # 真机证据（2026-09-29，provider 写后回读）：
  #   - integer：cc-kgt-tools/get_fault_topology.max_hops、cc-kg-tools/cc_trace.maxHops
  #   - object ：cc-kgt-tools/get_facts.timeWindow —— live parameters[].type="string"，
  #              但 Dify **原样存回的 schema** 里仍是 {"type":"object"}
  #              （tmp/m4_w1_evidence/probe_kgt_timewindow.txt）
  # ⇒ 这条别名有损：leg B 的 type 列无法区分声明的 object 与 string。
  #   补偿措施：leg A（Dify 原样存回的 schema 逐字比对）**不做任何映射**，
  #   因此 yaml 里 object↔string 的任何真实改动仍会在 leg A 被抓住
  #   （自检 N16 专门证明这一点）。判据本身未放宽。
  type_alias: {integer: number, object: string}
  # ★ FIX-1（2026-10-07）：此处原有 `empty_params_placeholder`（name=_unused / type=string /
  #   description=本工具无需参数，请传空字符串），由注册器注入给零参工具。已整块删除。
  #   旧注『Dify 硬约束：properties 不能为空』**已被证伪**：现网已有 6 个真零参工具
  #   （upstream-ops-onto-consistency/onto_consistency、…/onto_symptoms、…/onto_cqs 及三个
  #   -sim 变体，parameters == []）⇒ 真零参合法。
  #   该占位符是**本项目自造**、并非 Dify 注入：模型会按声明传 _unused，而两载体 body 模型
  #   extra=forbid ⇒ 必然 HTTP 400（实测：8301/8302 的 /guide、/schema 带 {"_unused":""} = 400，
  #   空 body {} = 200）。故 FIX-1 删除本机制，零参工具的注册面为 properties={} / required=[]。

# 凡不在白名单的 provider / 工具名，注册器一律拒绝（fail-closed）
whitelist:
  provider_names: [cc-kg-tools, cc-onto-tools, cc-kgt-tools, cc-kgt-dyn-tools, cc-live-facts-tools, cc-base-tools]   # ★ S2c：+live-facts（:8304）；★ R-55：+cc-base-tools（BASE 的数据面）
  allowed_ports: [8301, 8302, 8303, 8304, 8305]   # ★ S2c：+8304（S3a 必须同步 check_fairness.py:112 PORT_BY_CARRIER 并重冻 purity-contract P6）
  allowed_hosts: ["192.0.2.10"]   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
  # ★ denied_* 只作用于 denied_scope 列出的 provider。这 9 个名字是 :8303 门面
  #   显式拒绝的路由名；其中 cc_guide/cc_schema/cc_query/cc_trace/cc_cause/
  #   cc_propose 恰恰是 :8301/:8302 的**合法**工具 —— 绝不能全局禁用。
  #   依据：cc_tools_kgt.py:148-157 的 FORBIDDEN_PATHS 只在 KG-T 门面生效。
  denied_scope: [cc-kgt-tools]
  denied_tool_names:
    - cc_query
    - run_rules
    - validate
    - cc_guide
    - cc_schema
    - cc_trace
    - cc_cause
    - cc_propose
    - collect_now
  denied_tool_names_source: "scheme1-kg/service/cc_tools_kgt.py:147-156 FORBIDDEN_PATHS(8) + :730 denied_paths['/collect']"
  denied_operation_ids:
    - denied_cc_query
    - denied_run_rules
    - denied_validate
    - denied_cc_guide
    - denied_cc_schema
    - denied_cc_trace
    - denied_cc_cause
    - denied_cc_propose
    - denied_collect_now
  denied_operation_ids_source: "scheme1-kg/service/cc_tools_kgt.py:736 endpoint.__name__ = 'denied_%s' % tool_name"
  # 严禁注入注册面的文档性字段（R-34）
  strip_fields:
    - carrier_specific_value_semantics
    - carrier_specific
    - description_basis
    - params_basis
    - description_authored
    - guards
    - returns
    - error_codes
    - provenance
    - bounds
    - dify_placeholder

