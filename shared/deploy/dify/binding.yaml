      cc-onto-tools: "http://192.0.2.10:8302"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
