dify:
  version: "1.17.0"
  base_url_from_env: DIFY_BASE_URL
  api_prefix: console/api
  routes:
    login: /console/api/login
    tool_provider_list: /console/api/workspaces/current/tool-providers?type=api
    tool_provider_get: /console/api/workspaces/current/tool-provider/api/get?provider={provider}
    tool_provider_add: /console/api/workspaces/current/tool-provider/api/add
    tool_provider_update: /console/api/workspaces/current/tool-provider/api/update
  max_provider_name_len: 40

workspace:
  mode: single
  id: 6dbcf416-0713-48d6-b4f7-a4583bff18de
  name: "ROY SONG's Workspace"
  note: "R-31：Console API 无「新建 workspace」路由，方案 C 已否决；本批次不新建 workspace。"

tool_sources:
  setb:
    path: shared/model/tools-setb.yaml
    container: mapping            # tools 为按名索引的 mapping
    description_field: description
    param_description_field: description
  kgt:
    path: shared/model/kgt-tools.yaml
    container: list               # tools 为列表
    description_field: summary    # ★ 模型面描述取 summary，不是 description
    param_description_field: description   # properties.<name>.description
  # ★ S2c 新增（D47）：read_facts 的定义唯一源（形状权威）。注册面只暴露别名 read_live_facts。
  livefacts:
    path: shared/model/live-facts-tools.yaml
    container: mapping            # 顶层键即工具名（read_facts / read_live_facts 别名同源）
    description_field: description
    param_description_field: description
    names_key: names              # ★ 单一真源：names.primary / names.free_alias
    alias_key: aliases            # ★ 单一真源：aliases.<alias>.of 指向主名
    shape_authority: true         # ★ 本文件是 params/returns 正文的唯一权威

carriers:
  kg:
    arms: [KG-Q, KG-R]
    service_base: "http://192.0.2.10:8301"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
    provider: cc-kg-tools
    app: cc-kg-agent
    health_expect:
      status: ok
      carrier: kg
      arm: KG-Q
  onto:
    arms: [ONTO-Q, ONTO-R]
    service_base: "http://192.0.2.10:8302"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
    provider: cc-onto-tools
    app: cc-onto-agent
    health_expect:
      status: ok
      carrier: onto
      arm: ONTO-Q
  kgt:
    arms: [KG-T]
    service_base: "http://192.0.2.10:8303"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
    provider: cc-kgt-tools
    app: cc-kgt-agent
    health_expect:
      status: ok
      carrier: kg
      arm: KG-T
  # ★ U-N 裁定 = A（独立端口，用户 2026-10-08）：KG-T-dyn 的**载体边车**。
  #   为什么必须独立 carrier：`check_fairness._check_carrier_mapping` ② 断言
  #   「provider 声明端口 == PORT_BY_CARRIER[carrier]」⇒ 复用 `kgt`（不变量 8303）会失败；
  #   ③ 只禁止「**同一 base** 被不同 carrier 共用」⇒ 这里 base 是 :8305，与 :8303 不同，③ 不冲突。
  kgt-dyn:
    arms: [KG-T-dyn]
    service_base: "http://192.0.2.10:8305"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
    provider: cc-kgt-dyn-tools
    app: cc-kgt-dyn-agent
    health_expect:
      status: ok
      carrier: kg
      arm: KG-T-dyn

  # ★ R-55（2026-10-08）：**中性取数服务**的载体边车声明。
  #   为什么必须有：`m5_run.declared_groups` 对 **kind=api** 的组要求其 carrier 在 `carriers`
  #   里声明，否则「载体面不可判 ⇒ fail-closed」抛 M5Blocked。BASE 是 api 组、carrier=live-facts，
  #   而本段此前没有该键 ⇒ CI 的 `offline:selftests`（m5_run --selftest）实测直接 FAIL。
  #   ★ 与知识载体（kg/onto/kgt）的**形态差异**（如实登记，不照抄）：`:8304/health` 的顶层键是
  #     `service / faces / host / port / tool / tool_path / input_facts / limits / modes /
  #      uptime_s / started_at`，**没有** `status` / `carrier` / `arm`。
  #   ★ 该服务**不写审计链**（只有请求日志 `cc_live_facts.log`）⇒ BASE 的**平面 2 不适用**，
  #     见 `e2e_smoke.py` 的 `APPS["cc-base-agent"]` 注释与 `tmp/_r55_report.md` §6。
  live-facts:
    arms: [BASE]
    service_base: "http://192.0.2.10:8304"   # ★ R-58：主机 = 现网部署主机（真机注册态实测值）；.84 是 R-56 事故的旧主机，已彻底移除。可用 env CC_DIFY_PUBLIC_HOST 覆盖。
    provider: cc-base-tools
    app: cc-base-agent
    health_expect:
      service: shared-collect-read-facts
      port: 8304

