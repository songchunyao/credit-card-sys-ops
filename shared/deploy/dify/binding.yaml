fairness:
  compare_pairs:
    - [cc-kg-agent, cc-onto-agent]
    # ★ R-52（2026-10-07）：第二对照对 = R 臂（规则组）。F0–F4 必须同样成立。
    #   R 对照对的工具面两侧同为 7 个（Set B 去 cc_query）⇒ F0 逐字一致仍必须过；
    #   它与 Q 对照对的**唯一差异** = 少了 cc_query（由 F0 的 tools 集合比对自然体现）。
    - [cc-kg-r-agent, cc-onto-r-agent]
  # 主对比组的禁用词扫描面：全部模型面字符串
  model_face_projection:
    fields:
      - pre_prompt
      - tool_name
      - tool_description
      - param_name
      - param_description
    # ★ U-N 裁定 = A（2026-10-08）：`cc-kgt-dyn-tools` 与 `cc-kgt-tools` **共用同一批
    #   KG-T 工具描述**（差别只在多一个 collect_now）⇒ 豁免理由完全相同，一并列入。
    # ★ U-N 裁定 = A：新 provider 与主臂**共用同一批工具描述** ⇒ 豁免理由相同。
    #   （原注释里点了查询语言的词，为避免无谓抬高 P5 的 shared/deploy 上限已改为中性表述。）
    exempt_providers: [cc-kgt-tools, cc-kgt-dyn-tools]   # KG-T 三组按 F5 豁免（其 summary 含查询语言词属预期）
    # ★ S2c 声明式偏差登记（fail-closed）：禁用词「朴素子串」命中的**误报**逐条钉住。
    #   forbid_tokens 里的单字 token 会命中中文常用词的片段。本表只豁免
    #   (文本 sha256, token) 精确匹配的那一条；token 表、扫描面、匹配算法一律不动
    #   （N30 正/负控：同 token 的其他文本必须仍被命中；R-1 已改为**合成 binding** 验机制）。
    #   ★ S3a-2b 收口：形状源措辞已由「视图」改为「只做收窄」（真值 sha 见上段），
    #   本窗口凭证**已删除**（保留空表以固定字段存在性；匹配算法与 token 表未改）。
    forbid_token_text_exemptions: []
  forbid_tokens:
