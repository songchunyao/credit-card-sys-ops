    ccf: "https://credit-card-ops.ai/onto/fault#"
    ccc: "https://credit-card-ops.ai/onto/causal#"
    cca: "https://credit-card-ops.ai/onto/action#"
    ccp: "https://credit-card-ops.ai/onto/prov#"
