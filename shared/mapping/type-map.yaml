# ============================================================================
# type-map.yaml · 中性名 → KG 名 / ONTO 名的**显式映射表**（是数据不是代码）
# ----------------------------------------------------------------------------
# 权威出处：docs/01-场景建模与范围定义.md §1.1「强制」、docs/00 §6.3、裁决 13
# 输入契约：shared/model/topology.yaml + metrics.yaml + ccf.schema.json
# 消费者：  投影器 P1（Neo4j）/ P2（GraphDB）——**只读本表，不得硬编码载体名**
# ----------------------------------------------------------------------------
# ★ 裁决 13：Neo4j 侧标签与关系类型统一加命名空间前缀 `CC_`。
#   原因：目标实例 `neo4j-gaussdb`（community 单库）已有 v2 本体图 423 节点，
#   其中 `Host`(4) / `Table`(2) / `Session`(2) 标签与 `ACCESSES` / `DEPLOYED_ON`
#   关系类型与本项目撞名；ONTO 侧可新建专属仓库 `cc-ops`，故必须让 KG 侧也隔离。
# ============================================================================

meta:
  version: "1.2.0"
  date: "2026-10-05"
  revision: "1.2.0 = 新增派生证据型 Evidence + 关系 HAS_EVIDENCE（M1.5c：每条 CCF 观测一个证据节点，两侧对称投影）；observation_projection 增 evidence 块，派生规则（记录 id / 指标码 / 状态 / 原始值 / 原始单位 / reason / probe / 采集时刻）全部以数据形式写在表里"
  contract_of: "01-场景建模与范围定义.md §1.1"
  generated_from:
    - shared/model/topology.yaml
    - shared/model/metrics.yaml
    - shared/model/ccf.schema.json
  counts:
    types: 14
    concrete_types: 13
    annotation_types: 1
    ccf_object_types: 12
    metrics: 91
  rules:
    - "中性名出现在 shared/ 与评测台；KG 名只出现在 scheme1-kg/；ONTO 名只出现在 scheme2-onto/"
    - "映射表是唯一允许出现三套名字并置的地方"
    - "投影器遇到映射表里没有的中性名必须 fail-closed（禁止猜测或兜底改名）"
    - "属性名两侧同形（小驼峰），差别只在命名空间：KG 靠标签隔离，ONTO 靠 IRI 前缀隔离"
    - "Cypher 与 SPARQL 里出现的目标标签/关系类型/IRI 必须逐字来自本表"

