  kg:
    instance_id: "ccfId"
    snapshot: "ccfSnapshotId"
    layer: "ccfLayer"
    neutral_type: "ccfType"
    relation_id: "ccfRelId"
  onto:
    instance_id: "cc:ccfId"
    snapshot: "cc:ccfSnapshotId"
    layer: "cc:ccfLayer"
    neutral_type: "cc:ccfType"

# 观测（CCF observation）如何落成载体原生属性（`01-` §3.3）
observation_projection:
  policy: "value 只在 status=collected 时落成属性；status != collected 的条目落进两个多值属性"
  kg:
    value: "<metric.kg_property>"
    not_collected: "ccfNotCollected"
    collected_empty: "ccfCollectedEmpty"
  onto:
    value: "<metric.onto_property>"
    not_collected: "ccm:notCollected"
    collected_empty: "ccm:collectedEmpty"
  rationale:
    - "三态语义不同（collected / notCollected / collectedEmpty），只有 notCollected 能否定事实"
    - "Neo4j 无法存 null 属性，故否定性证据必须落成显式清单，否则 C4 否定性证据族失去依据"
    - "单条观测的 recordId 溯源由 M1.5c 的 Evidence 节点承担，不在本表"

# ★ M1.5c：observations[] → 派生证据节点（每条观测一个节点 + 一条 对象→证据 边）
#   `attrs` 的值是**观测里的字段路径**（不是载体属性名）：
#     · `a|b` = 取第一个存在的字段（collected 时 value / valueText 二选一）
#     · 字段不存在 ⇒ **不写该属性**（两侧一致：ONTO 侧不写空三元组，
#       Neo4j 侧不写 null —— Neo4j 存不了 null，写空串会污染 C4 判定）
#   投影器必须据此建属性；**不得**在代码里写 field 名。
  evidence:
    from: "observations"
    type: Evidence
    relation: HAS_EVIDENCE
    id_field: "id"
    object_field: "objectId"
    attrs:
      recordId: "id"
      metricCode: "metricCode"
      status: "status"
      rawValue: "value|valueText"
      rawUnit: "unit"
      reason: "reason"
      probe: "provenance.probe"
      capturedAt: "observedAt"
      # ── ★★ 2026-10-12 路线B/P0.5 打通：窗口基线三件套 ★★ ──
      #   在此之前 `cc:delta` / `cc:deltaWindowS` / `cc:counterReset` **已在
      #   cc-topology.ttl 声明**（domain cc:Evidence），投影器也**是数据驱动**的
      #   （`maps.attrs(ev_type)` + `ev_attrs.get(k)`），但**本规格没列这三项**
      #   ⇒ delta 在 CCF 里有、投影时被**静默丢弃** ⇒ 载体内 `cc:delta` 恒不存在
      #   ⇒ 一切 `predicate: increased/decreased` 的规则**只能走「不可判」分支**，
      #      永远产不出 Finding。这就是「delta 机制已就位但判据仍不可机判」的真正断点。
      #   ★ 加这三项后：CCF 有 delta ⇒ 投影器写 cc:delta ⇒ r03/r04/r06/r07 与
      #       F2 规则（r02 的 4 个新模式）的基线路径**才可能命中**。
      #   ★ 语义不变：字段缺失 ⇒ **不写该属性**（与其余 attrs 同一条纪律）。
      delta: "delta"
      deltaWindowS: "deltaWindowS"
      counterReset: "counterReset"
    note: "粒度 = 每条 CCF 观测一个证据节点（用户裁定 U-Q = A）；两侧对称投影。★ 2026-10-12：attrs 由 8 项扩到 11 项（+delta/deltaWindowS/counterReset，打通 increased/decreased 判据）"

