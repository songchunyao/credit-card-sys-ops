# ---------------------------------------------------------------------------
# ★ 阈值原则（继承 onto-ops-agent D3，本项目强制）
#   阈值零硬编码：一律绑定到「实体自带配置」或「阈值个体」，
#   绝不把数字写进规则。
#   教训来源：absorb-wt/阈值审核清单.md 实测 92 条阈值中 83 条硬编码，
#   大量与生产实测相差 70×–700×，判据永不可能命中。
# ---------------------------------------------------------------------------
threshold_policy:
  hardcode_forbidden: true
  binding_modes:
    - entity_property   # 绑到实体自带配置，如 JdbcDataSource.maxPoolSize
    - threshold_node    # 绑到阈值个体（ONTO: obs:Threshold；KG: :Threshold 节点）
    - derived           # 由其它指标按 expression 计算
  required_fields: [warning, critical, rationale]   # 每条阈值必须带判据来源说明
  rationale_required: true
