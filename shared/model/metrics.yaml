# ============================================================================
# shared/model/metrics.yaml  ·  场景契约 · 指标目录（中性名）
# ----------------------------------------------------------------------------
# 指标码是「规则」与「投影器」之间的唯一契约：规则只引指标码，
# 投影器负责把它落成载体原生属性。新增故障链只改规则 + 本目录，不改投影器代码。
#
# source 字段：探针来源预判（探针清单以 docs/02 的实测定稿为准）
#   gaussdb  → 复用 upstream-ops-agent 的 gaussdb 探针  ✅
#   os       → 复用 os 探针                                   ✅
#   app      → 需新建（JVM/Micrometer/JMX）                    ❌ 增量
#   container→ 需新建（K8s API / cAdvisor / docker stats）      ❌ 增量
#   derived  → 由其它指标计算得出，不直接采集                    —
# ============================================================================

meta:
  version: "1.0.0"
  contract_of: "01-场景建模与范围定义.md §2 §4"

