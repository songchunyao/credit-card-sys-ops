      note: "KG 侧判据是**边**（(fm)-[j:CC_JUDGED_BY]->(m)），ONTO 侧判据是**个体**（ccf:Judgment，由 ccf:judgedBy 指向）。ONTO 有对象属性 ccf:jMetric（判据→ccm:Metric 个体），与 KG 的 `->(m:CC_Metric)` 同义，故 metricCode 取 `?m ccm:metricCode`（不是字面量 ccf:jMetricCode）—— 取证：jMetric→Metric 个体 23 条、KG 判定边 26 条（均 b4 档）。ccf:Judgment 已登记进 neutral_extension.onto_class ⇒ 不再需要 var_type_overrides 宽化。"
      kg: |
        MATCH (fm:CC_FaultMode)-[j:CC_JUDGED_BY]->(m:CC_Metric)
        RETURN fm.fmCode AS fmCode, fm.fmLayer AS fmLayer, fm.fmComponentType AS fmComponentType,
               fm.fmSeverity AS fmSeverity, fm.fmDetectionMode AS fmDetectionMode,
               m.metricCode AS metricCode, j.role AS jRole, j.op AS jOp, j.operandKind AS jOperandKind
      onto: |
        SELECT ?fmCode ?fmLayer ?fmComponentType ?fmSeverity ?fmDetectionMode ?metricCode ?jRole ?jOp ?jOperandKind
        WHERE {
          GRAPH <{{TBOX}}> {
            ?fm a ccf:FaultMode ; ccf:faultModeCode ?fmCode ; ccf:faultLayer ?fmLayer ;
                ccf:fmComponentType ?fmComponentType ; ccf:severity ?fmSeverity ;
                ccf:fmDetectionMode ?fmDetectionMode ; ccf:judgedBy ?j .
            ?j a ccf:Judgment ; ccf:jMetric ?m .
            ?m a ccm:Metric ; ccm:metricCode ?metricCode .
            OPTIONAL { ?j ccf:jRole ?jRole }
            OPTIONAL { ?j ccf:jOp ?jOp }
            OPTIONAL { ?j ccf:jOperandKind ?jOperandKind }
          }
        }
      declared_surface:
        columns:
          - canonical: FaultMode.component_type
            kg: FaultMode.component_type
            onto: FaultMode.component_type
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.detection_mode
            kg: FaultMode.detection_mode
            onto: FaultMode.detection_mode
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.layer
            kg: FaultMode.layer
            onto: FaultMode.layer
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.severity
            kg: FaultMode.severity
            onto: FaultMode.severity
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_op
            kg: JUDGED_BY.j_op
            onto: JUDGED_BY.j_op
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_operand_kind
            kg: JUDGED_BY.j_operand_kind
            onto: JUDGED_BY.j_operand_kind
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.role
            kg: JUDGED_BY.role
            onto: JUDGED_BY.role
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Metric.metricCode
            kg: Metric.metricCode
            onto: Metric.metricCode
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
