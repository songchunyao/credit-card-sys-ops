# -----------------------------------------------------------------------------
# 唯一数据源（映射是数据不是代码；门禁只读这三张表）
# -----------------------------------------------------------------------------
sources:
  type_map: shared/mapping/type-map.yaml
  rel_map: shared/mapping/rel-map.yaml
  targets: shared/deploy/targets.yaml

# -----------------------------------------------------------------------------
# 命名图（快照图模板取自 sources.targets；tbox 图 targets.yaml 未登记，故在此声明）
# -----------------------------------------------------------------------------
graphs:
  snapshot_template_from: shared/deploy/targets.yaml
  tbox: "https://credit-card-ops.ai/onto/graph/tbox"
  tbox_note: "targets.yaml 只登记 named_graph_template（快照图）；故障/因果/指标/阈值层是 TBox 个体，落在独立命名图 <…/graph/tbox>，故在此显式声明。取证一律带 ?infer=false。"

# -----------------------------------------------------------------------------
# 形状描述符：逐字定义（「至少包含」三字段；后两字段是本契约的加固，不是放松）
# -----------------------------------------------------------------------------
descriptor:
  compared_fields:
    - "grain_scope"
    - "columns"
    - "bound_columns"
    - "realized_scope"
    - "rows_class"
  fields:
    grain_scope: "行作用域内出现的中性类型名集合（排序去重）。来源 = 查询文本里的载体标签/类，经两张映射表归一。**静态**（由查询文本决定，与数据无关）。"
    columns: "该查询返回的**中性列名**集合（排序去重）。中性列名 = `<中性类型>.<中性属性名>`（节点/个体属性）或 `<中性关系码>.<中性属性名>`（关系属性）。**静态**（由查询文本决定，与数据无关）。"
    bound_columns: "columns 的子集：在**至少一行**结果里取到非空值的那些中性列。**动态**（数据相关）——它就是用来抓「KG 侧全 null 的列 vs ONTO 侧根本没有该绑定」这类形态差异（诚实边界 B4）。"
    realized_scope: "grain_scope 的子集：其**所有**列在**所有**行上都为空的中性类型，从 grain_scope 中剔除后的结果。**动态**（数据相关）。"
    rows_class: "行数量级档：zero（rows==0）/ one（rows==1）/ many（rows>=2）。**动态**（数据相关）。"
    rows: "原始行数。**只进报告，不参与比对**（精确计数归 G14 shared/verify/parity.py 的 byType/byRelation；本门禁只比分档）。"
    rows_band: "更细的行数分档（0 / 1 / 2-4 / 5-16 / 17-64 / 65+）。**只进报告，不参与比对**；两侧不同档时发 WARN。"
  rows_class_rules:
    zero: "rows == 0"
    one: "rows == 1"
    many: "rows >= 2"
  rows_band_rules:
    b0: "rows == 0"
    b1: "rows == 1"
    b2: "2 <= rows <= 4"
    b3: "5 <= rows <= 16"
    b4: "17 <= rows <= 64"
    b5: "rows >= 65"
  excluded_from_comparison:
    - "任何**值**（标识值、指标值、阈值、文本、时间戳）——那是内容；值等由 G22 shared/verify/abox_identity_gate.py 负责。"
    - "关系端点的身份键元组值——值等归 G22（G22-07 / G22-08 已实现关系维度身份集比对）；G23 只比形状（列集合 / 行数量级 / 作用域）。"
    - "行的顺序。"
    - "精确行数（只比分档；count 只进报告）。"

# -----------------------------------------------------------------------------
# 归一化规则（逐字）：载体专有名 → 中性名，全部查两张表，代码不写死任何列名
# -----------------------------------------------------------------------------
normalization:
  type_name:
    kg: "sources.type_map#types 的每个键 K：kg_label → K（例如 kg_label CC_Table → Table）"
    onto: "sources.type_map#types 的每个键 K：onto_class → K（CURIE 用 sources.type_map#prefixes + namespaces.onto.base 展开为 IRI；例如 cc:Table → Table）"
  attr_name:
    kg: "sources.type_map#types[*].attrs 的每个键 A：attrs[A].kg_property → A；另 sources.type_map#metrics 的每个键 M：metrics[M].kg_property → M"
    onto: "sources.type_map#types[*].attrs 的每个键 A：attrs[A].onto_property → A；另 sources.type_map#metrics 的每个键 M：metrics[M].onto_property → M"
  common_attr_name:
    kg: "sources.type_map#common_properties.kg 的每个键 C：该键的值 → C（例如 ccfId → instance_id、ccfLayer → layer、ccfType → neutral_type、ccfSnapshotId → snapshot、ccfRelId → relation_id）"
    onto: "sources.type_map#common_properties.onto 的每个键 C：该键的值 → C"
  relation_name:
    kg: "sources.rel_map#relations 的每个键 R：kg_reltype → R；另 rel_map#inverse_relations 同法"
    onto: "sources.rel_map#relations 的每个键 R：onto_property → R；另 rel_map#inverse_relations 同法"
  relation_attr_name:
    kg: "关系属性的中性名必须由本契约 neutral_extension 显式给出（rel-map 只登记关系端点类型与载体名，不登记关系属性）"
    onto: "同上"
  neutral_column_token: "<中性类型名>.<中性属性名>（节点/个体属性）或 <中性关系码>.<中性属性名>（关系属性）"
  static_vs_dynamic: "columns / grain_scope 由**查询文本**归约（静态，空结果时仍良定义）；bound_columns / realized_scope / rows_class / rows / rows_band 由**结果集**归约（动态）。"
  fail_closed:
    - "任一台词在两张表里查不到 ⇒ ERROR（G23-06 unmappable_*），**不得**把原始载体名当中性名透传，**不得**静默丢弃该列，**不得**用空集代替。"
    - "查询文本里出现的行作用域变量若无载体标签/类（多态变量），除本契约 cases[*].var_type_overrides 显式声明外 ⇒ ERROR（G23-06 untyped_row_var）。"
    - "查询文本里凡不是 `<var>.<prop>`（Cypher）或 `?var <curie:prop> ?alias`（SPARQL）形态的返回表达式 ⇒ ERROR（G23-06 unnormalizable_return_expr）。"
    - "只接受只读查询：出现 CREATE / MERGE / SET / DELETE / REMOVE / DROP / INSERT / LOAD / CLEAR 等写子句 ⇒ ERROR 并拒绝执行（G23-05）。"

# -----------------------------------------------------------------------------
# ★ 显式扩展：故障/因果/指标/阈值层
#
#   为什么需要它（必须让队长看到，不得含糊）：
#     type-map.yaml 只覆盖 CCF 拓扑层 14 个类型 + 70 个指标；rel-map.yaml 只覆盖
#     15 条拓扑关系（14 asserted + 1 derived）。而 docs/03 §8 的 Q02–Q07 落在
#     **故障模式 / 判据 / 因果 / 阈值** 层，其载体专有列名**不在**这两张表内。
#   本节的处置：
#     为避免「在 Python 代码里写死列名」（那是「映射是数据不是代码」明令禁止的），
#     这些列的归一化规则**同样以数据**形式写在本契约里。它是 G23 的补判据，
#     在报告里逐条登记，供队长裁定是否应上游落进 type-map / rel-map。
#   ★ 本节**不**把两侧的形态差异抹平，但也不再让**原生**形状硬碰：KG 的 CC_AFFECTS 是
#     **实例级**（42 条，指向 CC_Session / CC_Host 等实例），而 ONTO 的 ccf:affects 是
#     **类级**（14 条，指向 cc:JdbcDataSource / cc:Query 等类）——两者中性列集合必然不同。
#     M2.26 的处置：③ 先把两侧**投影到契约声明的信息面**（cases[*].declared_surface，
#     同一信息粒度与列集合），再用**同一个** compare_descriptors 比对；未被声明面覆盖的原生
#     token 原样参与比对 ⇒ 如实判 DIFF，**绝不静默丢弃**；原生形状另存 native_shape_kg /
#     native_shape_onto 并逐例打印。两个原生差异（「类」的代表形式、边属性的承载位置）
#     同时登记为风险 R-19、写进诚实边界 B5，**不**在门禁里抹平。
# -----------------------------------------------------------------------------
neutral_extension:
  note: "G23 补判据：故障/因果/指标/阈值层的中性名。数据来源 = docs/03 §8、scheme1-kg/queries/*.cypher、scheme2-onto/tests/cq_probes.py 的实测口径；不来自 type-map/rel-map。"
  note_precedence: "★ 解析优先级：type-map 的 types[*].attrs / metrics / common_properties **先于**本节的 kg_property / onto_property（门禁 class Mapping :234-253 用 setdefault 建表、:271-274 才叠 ext），故本节只能补**两边都查不到**的中性名。推论：KG 侧 `j.role`（type-map 里 Host.role / GaussDBInstance.role 已登记为 role）与 `m.metricCode`（Evidence.attrs.metricCode 已登记为 metricCode）的中性名由 type-map 钉死，本节必须把 ONTO 侧同一概念的属性也登记成**同一个**中性名（ccf:jRole→role、ccm:metricCode→metricCode），否则同一概念两侧得到两个中性名、形状比对恒 DIFF（首版即如此：role/j_role、metricCode/metric_code）。中性名仅是标识符：token 带作用域前缀（如 JUDGED_BY.role 与 Host.role 不混同），值一律不参与比对。"
