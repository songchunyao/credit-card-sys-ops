    - id: Q07
      title: 因果边属性批量取（契约内属性；概率/权重不在契约内）
      source: scheme1-kg/queries/q07-edge-props.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: tbox
      grep_scope: "FaultMode"
      var_type_overrides:
        kg:
          r: CausalLink
        onto:
          l: CausalLink
      note: "docs/03 §8 表格写「概率/权重/delay」，但唯一权威 shared/model/causal-edges.yaml 每条边只有 id/from/relation/to/chain/evidence/provenance（E6/E7/E9/E12 另有 condition）⇒ 本契约不返回 probability/weight/delaySec/learnCount/chainPosition。文档表格与契约自相矛盾，已登记在报告。属性对应（值级取证）：KG r.contractId ↔ ONTO cco:neutralCode（同为 E##）、KG r.chain ↔ ccc:chainCode（同为 F#）、KG r.description ↔ ccc:evidenceText（同文）、KG r.provenance ↔ ccc:provenance（字面量 vs IRI，形同值不同，值不参与比对）。本契约首版用的 ccc:provenanceEdgeId / ccc:description **不存在**、ccc:linkKind 语义是 causes/relates_to（≠ chain），均已改正。"
      kg: |
        MATCH (a:CC_FaultMode)-[r:CC_CAUSES|CC_RELATES_TO]->(b:CC_FaultMode)
        RETURN a.fmCode AS fromFmCode, b.fmCode AS toFmCode, r.contractId AS edgeId,
               r.chain AS chain, r.description AS description, r.provenance AS provenance
      onto: |
        SELECT ?fromFmCode ?toFmCode ?edgeId ?chain ?description ?provenance
        WHERE {
          GRAPH <{{TBOX}}> {
            ?l a ccc:CausalLink ; ccc:cause ?a ; ccc:effect ?b .
            ?a a ccf:FaultMode ; ccf:faultModeCode ?fromFmCode .
            ?b a ccf:FaultMode ; ccf:faultModeCode ?toFmCode .
            OPTIONAL { ?l cco:neutralCode ?edgeId }
            OPTIONAL { ?l ccc:chainCode ?chain }
            OPTIONAL { ?l ccc:evidenceText ?description }
            OPTIONAL { ?l ccc:provenance ?provenance }
          }
        }
      declared_surface:
        columns:
          - canonical: CausalLink.chain
            kg: CausalLink.chain
            onto: CausalLink.chain
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: CausalLink.description
            kg: CausalLink.description
            onto: CausalLink.description
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: CausalLink.edge_contract_id
            kg: CausalLink.edge_contract_id
            onto: CausalLink.edge_contract_id
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: CausalLink.provenance
            kg: CausalLink.provenance
            onto: CausalLink.provenance
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
        carrier_specific_columns: []
    - id: Q08
      title: 事实溯源（结论 → Evidence → 事实 id）
      source: scheme1-kg/queries/q08-provenance.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: snapshot
      grep_scope: "AnyObject | Evidence"
      var_type_overrides:
        kg:
          fact: AnyObject
        onto:
          fact: AnyObject
      note: "source 的头注释称「本体侧不写实例」，但真机实测 ONTO 快照图有 191 个 cc:Evidence 个体（与 KG 的 191 个 CC_Evidence 一致）⇒ 该注释已过时，如实登记。"
      kg: |
        MATCH (fact)-[h:CC_HAS_EVIDENCE]->(ev:CC_Evidence)
        RETURN fact.ccfId AS factId, fact.ccfLayer AS factLayer, h.ccfRelId AS evidenceRelId,
               ev.recordId AS recordId, ev.metricCode AS metricCode, ev.rawValue AS rawValue,
               ev.rawUnit AS rawUnit, ev.status AS status, ev.probe AS probe, ev.capturedAt AS capturedAt
      onto: |
        SELECT ?factId ?factLayer ?recordId ?metricCode ?rawValue ?rawUnit ?status ?probe ?capturedAt
        WHERE {
          GRAPH <{{GRAPH}}> {
            ?fact cc:hasEvidence ?ev .
            ?ev a cc:Evidence ; cc:recordId ?recordId ; cc:metricCode ?metricCode ;
                cc:status ?status ; cc:probe ?probe ; cc:capturedAt ?capturedAt .
            OPTIONAL { ?fact cc:ccfId ?factId }
            OPTIONAL { ?fact cc:ccfLayer ?factLayer }
            OPTIONAL { ?ev cc:rawValue ?rawValue }
            OPTIONAL { ?ev cc:rawUnit ?rawUnit }
          }
        }

      declared_surface:
        columns:
          - canonical: AnyObject.instance_id
            kg: AnyObject.instance_id
            onto: AnyObject.instance_id
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: AnyObject.layer
            kg: AnyObject.layer
            onto: AnyObject.layer
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.capturedAt
            kg: Evidence.capturedAt
            onto: Evidence.capturedAt
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.metricCode
            kg: Evidence.metricCode
            onto: Evidence.metricCode
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.probe
            kg: Evidence.probe
            onto: Evidence.probe
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.rawUnit
            kg: Evidence.rawUnit
            onto: Evidence.rawUnit
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.rawValue
            kg: Evidence.rawValue
            onto: Evidence.rawValue
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.recordId
            kg: Evidence.recordId
            onto: Evidence.recordId
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: Evidence.status
            kg: Evidence.status
            onto: Evidence.status
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
        carrier_specific_columns:
          - token: HAS_EVIDENCE.relation_id
            side: kg
            reason: "关系身份键 ccfRelId 是 LPG 边属性的直接产物（type-map#common_properties：kg 有 relation_id、onto 没有）⇒ KG 侧多一列；ONTO 侧该信息由**节点级** cc:Evidence.recordId 承担 ⇒ 本列声明为 KG 侧 carrier_specific，不计入声明面比对，但两侧行数仍须一致。"
            source: "shared/mapping/type-map.yaml #common_properties（kg 有 relation_id、onto 无）；docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）；docs/04-方案2设计（本体+LLM）.md §2（cc:Evidence.recordId = CCF 记录 id）"
            carrier_position: CP-HAS-EVIDENCE
# -----------------------------------------------------------------------------
# 关系粒度层（G23-02）：不在此枚举，由 sources.rel_map#relations 的 asserted: true 驱动
# -----------------------------------------------------------------------------
relation_layer:
  driven_by: shared/mapping/rel-map.yaml
  filter: "relations[*].asserted == true"
  expected_count: 14
  boundary: "值等 → G22（shared/verify/abox_identity_gate.py 的 G22-07 / G22-08 已按 key_attrs 比对边身份集）；形等 → G23（本节）。G23 **不**比对端点身份键的取值。"
  kg_query_template: "MATCH (a:<kg_from_label>)-[:<kg_reltype>]->(b:<kg_to_label>) RETURN a.<kg_instance_id> AS fromId, a.<kg_layer> AS fromLayer, b.<kg_instance_id> AS toId, b.<kg_layer> AS toLayer"
  onto_query_template: "SELECT ?fromId ?fromLayer ?toId ?toLayer WHERE { GRAPH <{{GRAPH}}> { ?a <onto_property> ?b . OPTIONAL { ?a <onto_id> ?fromId } OPTIONAL { ?a <onto_layer> ?fromLayer } OPTIONAL { ?b <onto_id> ?toId } OPTIONAL { ?b <onto_layer> ?toLayer } } }"
  star_type_note: "from == \"*\" 的关系型（rel-map 里 HAS_EVIDENCE 派生、asserted: false）不参与 G23-02。"

