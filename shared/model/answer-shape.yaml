    - id: Q03
      title: 故障模式 → 下游传播（限深 4）
      source: scheme1-kg/queries/q03-downstream.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: tbox
      grep_scope: "FaultMode"
      note: "口径对齐（逐条可复核）：① 关系型对齐 —— KG 用 reltype 区分 CC_CAUSES(16) / CC_RELATES_TO(2)，ONTO 用字面量 ccc:linkKind 区分 causes(12) / conditional_causes(4) / relates_to(2)；按边身份（cco:neutralCode ↔ r.contractId）逐条比对，16 条 CC_CAUSES 与 {causes+conditional_causes} 一一对应、2 条 CC_RELATES_TO 与 relates_to 一一对应 ⇒ 为对齐 KG 的 `:CC_CAUSES`，ONTO 侧排除 linkKind=\"relates_to\"。这是**关系型集合**的对齐（结构），不是取值过滤（内容）。② 计数语义对齐 —— Neo4j 单条变长模式内**关系不得重复**（关系同构），SPARQL 无此约束 ⇒ ONTO 侧加两两 `FILTER(?li != ?lj)`。对齐后两侧均为 59 行 / 43 个端点对（逐深度 16/17/15/11）；未加该 FILTER 时 ONTO 为 67 行（差 8 条为链接复用）。证据见 tmp/_g23_shape_probe.py 的 E/F/G/H/P/Q 段。"
      kg: |
        MATCH (start:CC_FaultMode)-[:CC_CAUSES*1..4]->(down:CC_FaultMode)
        RETURN start.fmCode AS startFmCode, down.fmCode AS downFmCode,
               down.fmLayer AS downFmLayer, down.fmSeverity AS downFmSeverity
      onto: |
        SELECT ?startFmCode ?downFmCode ?downFmLayer ?downFmSeverity
        WHERE {
          GRAPH <{{TBOX}}> {
            { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
              ?l1 ccc:cause ?start ; ccc:effect ?down }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?start ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?down .
                    FILTER(?l1 != ?l2) }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?start ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?m2 .
                    ?l3 ccc:linkKind ?k3 . FILTER(?k3 != "relates_to") .
                    ?l3 ccc:cause ?m2 ; ccc:effect ?down .
                    FILTER(?l1 != ?l2) FILTER(?l1 != ?l3) FILTER(?l2 != ?l3) }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?start ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?m2 .
                    ?l3 ccc:linkKind ?k3 . FILTER(?k3 != "relates_to") .
                    ?l3 ccc:cause ?m2 ; ccc:effect ?m3 .
                    ?l4 ccc:linkKind ?k4 . FILTER(?k4 != "relates_to") .
                    ?l4 ccc:cause ?m3 ; ccc:effect ?down .
                    FILTER(?l1 != ?l2) FILTER(?l1 != ?l3) FILTER(?l1 != ?l4)
                    FILTER(?l2 != ?l3) FILTER(?l2 != ?l4) FILTER(?l3 != ?l4) }
            ?start a ccf:FaultMode ; ccf:faultModeCode ?startFmCode .
            ?down a ccf:FaultMode ; ccf:faultModeCode ?downFmCode ;
                  ccf:faultLayer ?downFmLayer ; ccf:severity ?downFmSeverity .
          }
        }
      declared_surface:
        columns:
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.layer
            kg: FaultMode.layer
            onto: FaultMode.layer
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.severity
            kg: FaultMode.severity
            onto: FaultMode.severity
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
        carrier_specific_columns: []
    - id: Q04
      title: 故障模式 → 上游溯因（限深 4，含否定性证据）
      source: scheme1-kg/queries/q04-upstream.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: tbox
      grep_scope: "FaultMode"
      note: "方向与 Q03 相反（溯因）：KG `<-[:CC_CAUSES*1..4]-`；ONTO 侧 `?l ccc:cause ?up ; ccc:effect ?start`（因在前、果在后）。口径对齐同 Q03（linkKind != relates_to + 链接两两互异）⇒ 两侧均 59 行 / 43 个端点对。"
      kg: |
        MATCH (start:CC_FaultMode)<-[:CC_CAUSES*1..4]-(up:CC_FaultMode)
        RETURN start.fmCode AS startFmCode, up.fmCode AS upFmCode,
               up.fmLayer AS upFmLayer, up.fmSeverity AS upFmSeverity
      onto: |
        SELECT ?startFmCode ?upFmCode ?upFmLayer ?upFmSeverity
        WHERE {
          GRAPH <{{TBOX}}> {
            { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
              ?l1 ccc:cause ?up ; ccc:effect ?start }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?up ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?start .
                    FILTER(?l1 != ?l2) }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?up ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?m2 .
                    ?l3 ccc:linkKind ?k3 . FILTER(?k3 != "relates_to") .
                    ?l3 ccc:cause ?m2 ; ccc:effect ?start .
                    FILTER(?l1 != ?l2) FILTER(?l1 != ?l3) FILTER(?l2 != ?l3) }
            UNION { ?l1 ccc:linkKind ?k1 . FILTER(?k1 != "relates_to") .
                    ?l1 ccc:cause ?up ; ccc:effect ?m1 .
                    ?l2 ccc:linkKind ?k2 . FILTER(?k2 != "relates_to") .
                    ?l2 ccc:cause ?m1 ; ccc:effect ?m2 .
                    ?l3 ccc:linkKind ?k3 . FILTER(?k3 != "relates_to") .
                    ?l3 ccc:cause ?m2 ; ccc:effect ?m3 .
                    ?l4 ccc:linkKind ?k4 . FILTER(?k4 != "relates_to") .
                    ?l4 ccc:cause ?m3 ; ccc:effect ?start .
                    FILTER(?l1 != ?l2) FILTER(?l1 != ?l3) FILTER(?l1 != ?l4)
                    FILTER(?l2 != ?l3) FILTER(?l2 != ?l4) FILTER(?l3 != ?l4) }
            ?start a ccf:FaultMode ; ccf:faultModeCode ?startFmCode .
            ?up a ccf:FaultMode ; ccf:faultModeCode ?upFmCode ;
                ccf:faultLayer ?upFmLayer ; ccf:severity ?upFmSeverity .
          }
        }
      declared_surface:
        columns:
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.layer
            kg: FaultMode.layer
            onto: FaultMode.layer
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.severity
            kg: FaultMode.severity
            onto: FaultMode.severity
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
        carrier_specific_columns: []
    - id: Q05
      title: 故障模式 → 受影响对象
      source: scheme1-kg/queries/q05-affected.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: tbox
      grep_scope: "FaultMode | AnyObject"
      var_type_overrides:
        kg:
          obj: AnyObject
      kg: |
        MATCH (fm:CC_FaultMode)-[a:CC_AFFECTS]->(obj)
        RETURN DISTINCT fm.fmCode AS fmCode, fm.fmSeverity AS fmSeverity,
               obj.ccfType AS affectsComponentType, a.severity AS affectsSeverity
      onto: |
        SELECT ?fmCode ?fmSeverity ?affectsComponentType ?affectsSeverity
        WHERE {
          GRAPH <{{TBOX}}> {
            ?fm a ccf:FaultMode ; ccf:faultModeCode ?fmCode ; ccf:severity ?fmSeverity ;
                ccf:affectsSeverity ?affectsSeverity ; ccf:fmComponentType ?affectsComponentType ;
                ccf:affects ?obj .
          }
        }
      declared_surface:
        columns:
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: FaultMode.severity
            kg: FaultMode.severity
            onto: FaultMode.severity
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: AFFECTS.component_type
            kg: AnyObject.neutral_type
            onto: FaultMode.component_type
            source: "docs/03-方案1设计（知识图谱+LLM）.md §4.3（AFFECTS 边；门禁断言 T3：目标类型 = 其 fmComponentType）；docs/00-总体设计与裁决记录.md §6.3"
            reason: "「受影响的组件类型」两侧都答得出来，但**载体位置**不同：KG 只能从被影响**实例**的 ccfType 读（LPG 的类只是标签、不是节点），ONTO 只能从**故障模式**个体的 ccf:fmComponentType 读（宾语是类）。真机取证：每个故障模式被影响实例的中性类型集合唯一且等于其 fmComponentType ⇒ KG 侧按类型码 RETURN DISTINCT 归一到 14 行，与 ONTO 的 14 个类同粒度。"
            carrier_position: CP-AFFECTS
          - canonical: AFFECTS.affects_severity
            kg: AFFECTS.affects_severity
            onto: FaultMode.affects_severity
            source: "docs/03-方案1设计（知识图谱+LLM）.md §4.3（AFFECTS 边；门禁断言 T3：目标类型 = 其 fmComponentType）；docs/00-总体设计与裁决记录.md §6.3"
            reason: "严重度是**边属性**：LPG 的边可直接带属性，RDF 三元组不可 ⇒ ONTO 侧物化成故障模式个体属性 ccf:affectsSeverity（同一取值、两种载体位置）。"
            carrier_position: CP-AFFECTS-SEVERITY
        carrier_specific_columns: []
    - id: Q06
      title: 故障模式 → 判据指标与阈值
      source: scheme1-kg/queries/q06-criteria.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: tbox
      grep_scope: "FaultMode | Metric | Threshold"
      note: "ONTO 侧阈值面用对象属性 ccf:jThreshold（判据→档位个体 ccm:WarningThreshold/CriticalThreshold，7+3=10）经 ccm:warningTier/ccm:criticalTier 连到 ccm:Threshold，并用 ccm:thresholdMetric ?m **钉到同一度量**（否则档位个体会跨度量匹配、行数爆炸：未钉时 ONTO 177 行 vs 钉后 23 行，KG 26 行 —— 证据 tmp/_g23_shape_probe.py 的 E11/E12/E13）；**不能**用字面量 ccf:jThresholdReference 去连 ccm:Threshold（它是字符串，恒 0 行 —— 这是本契约首版的真实缺陷，已改正）。度量面用 ccf:jMetric→ccm:Metric。两侧行数 26(KG) / 23(ONTO) 同 b4 档；阈值面绑定 10(KG) / 10(ONTO，E12)。ccf:jOperandRef / ccf:jOperandEntityProperty 经普查**不存在**，已从 neutral_extension 删除（ONTO 的对应物是 ccf:jThresholdReference，中性名同为 j_operand_ref）。"
      kg: |
        MATCH (fm:CC_FaultMode)-[j:CC_JUDGED_BY]->(m:CC_Metric)
        OPTIONAL MATCH (th:CC_Threshold)
        WHERE j.operandKind = 'threshold'
          AND th.thrCode = replace(split(j.operandRef, '#')[0], 'threshold:', '')
        RETURN fm.fmCode AS fmCode, m.metricCode AS metricCode, m.metricObject AS metricObject,
               m.metricLayer AS metricLayer, m.metricUnit AS metricUnit, j.role AS jRole, j.op AS jOp,
               j.operandKind AS jOperandKind, j.operandValue AS jOperandValue, j.operandRef AS jOperandRef,
               th.thrCode AS thrCode, th.thrWarning AS thrWarning, th.thrCritical AS thrCritical
      onto: |
        SELECT ?fmCode ?metricCode ?metricObject ?metricLayer ?metricUnit ?jRole ?jOp
               ?jOperandKind ?jOperandValue ?jOperandRef ?thrCode ?thrWarning ?thrCritical
        WHERE {
          GRAPH <{{TBOX}}> {
            ?fm a ccf:FaultMode ; ccf:faultModeCode ?fmCode ; ccf:judgedBy ?j .
            ?j a ccf:Judgment ; ccf:jRole ?jRole ; ccf:jMetric ?m .
            ?m a ccm:Metric ; ccm:metricCode ?metricCode .
            OPTIONAL { ?j ccf:jOp ?jOp }
            OPTIONAL { ?j ccf:jOperandKind ?jOperandKind }
            OPTIONAL { ?j ccf:jOperandValue ?jOperandValue }
            OPTIONAL { ?j ccf:jThresholdReference ?jOperandRef }
            OPTIONAL { ?m ccm:metricObjectType ?metricObject }
            OPTIONAL { ?m ccm:metricLayer ?metricLayer }
            OPTIONAL { ?m ccm:metricUnit ?metricUnit }
            OPTIONAL { ?j ccf:jThreshold ?tier .
                       ?th a ccm:Threshold ; ccm:thresholdName ?thrCode ; ccm:thresholdMetric ?m .
                       OPTIONAL { ?th ccm:warningTier ?thrWarning }
                       OPTIONAL { ?th ccm:criticalTier ?thrCritical }
                       { ?th ccm:warningTier ?tier } UNION { ?th ccm:criticalTier ?tier } }
          }
        }
      declared_surface:
        columns:
          - canonical: FaultMode.fault_mode_code
            kg: FaultMode.fault_mode_code
            onto: FaultMode.fault_mode_code
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_op
            kg: JUDGED_BY.j_op
            onto: JUDGED_BY.j_op
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_operand_kind
            kg: JUDGED_BY.j_operand_kind
            onto: JUDGED_BY.j_operand_kind
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_operand_ref
            kg: JUDGED_BY.j_operand_ref
            onto: JUDGED_BY.j_operand_ref
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
          - canonical: JUDGED_BY.j_operand_value
            kg: JUDGED_BY.j_operand_value
            onto: JUDGED_BY.j_operand_value
            source: "docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）"
