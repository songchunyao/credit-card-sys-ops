# -*- coding: utf-8 -*-
# =============================================================================
# G23 · answer_shape 形状契约（§6.3 ③ 的执行口径）
#
# 契约原文（逐字）：docs/00-总体设计与裁决记录.md §6.3（第 326-341 行）
#     for each 用例 q in 用例集:
#         assert answer_shape_kg(q) == answer_shape_onto(q)   # 形状，非内容
#   「不自检通过，评测结果不得采信。这是防『分母不同』的硬门禁。」
# 分工补充（逐字）：docs/00-总体设计与裁决记录.md §6.3（第 343 行）
#   「①②③ 管实例与回答的一致性（ABox 已被强制统一、不计入成本）」
#   ⇒ ③ 的期望是**相等**（不适用 ④ 的排除清单）。
#
# 本文件是**数据**：门禁 shared/verify/answer_shape_gate.py 只读它 + 两张映射表，
# 不在代码里写死任何载体专有列名（纪律同 type-map.yaml / rel-map.yaml 的
# 「映射是数据不是代码」）。
#
# -----------------------------------------------------------------------------
# 诚实边界（必须与门禁 --help / 文件头注释逐字一致）
# -----------------------------------------------------------------------------
#   B1. PASS 的含义**只是**「两款载体的回答结构一致」，**不是**「回答内容正确」。
#   B2. ③ 属 ABox 一致性（docs/00-总体设计与裁决记录.md §6.3（第 343 行）），**不计入成本**，
#       且 **PASS 不能补偿 T10 的失败**。
#   B3. 今天**没有** 50 条正式评测用例集（那是 M5，且受 docs/06 §9 的 U-D 用例规模
#       裁决阻塞）⇒ 本契约只**预留**扩展位 `extensions.fifty_case_slot`（键名与字段
#       见该节），G23 **不自己发明**那 50 条。
#   B4. 两侧载体型号不同（Neo4j 5.26.30 Community / GraphDB 10.8.0）：空结果 vs
#       无绑定、Neo4j 多重边 vs RDF 三元组集合语义、TBox 个体（故障/因果层）与
#       ABox 实例（拓扑层）分居不同命名图 —— 这些形态差异**必须逐条如实记录，
#       不得在归一化里「抹平」**。
# =============================================================================

