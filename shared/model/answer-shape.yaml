  # ---------------------------------------------------------------------------
  # ★ 跨载体对照表（M2.26）：③ 的「声明面」靠它把两侧对齐到**同一信息粒度**
  #   同一条信息在两侧的**载体位置**本来不同 ⇒ 必须显式登记，不能靠列名巧合：
  #     · LPG：类只能是**标签**（不是节点），边是**一等资源**、可直接带属性；
  #     · RDF：类是**资源**，三元组**不可**带属性（关系属性须具体化或改挂个体）。
  #   cases[*].declared_surface 里两侧 token 不同的条目必须引用本表的 id，
  #   门禁逐字核对（G23-10）；删掉本表条目 ⇒ 该例悬空引用即 ERROR。
  # ---------------------------------------------------------------------------
  carrier_position:
    note: "跨载体对照表（数据形式，G23 补判据）：逐条登记同一信息在两款载体上的**原生名**（kg_native / onto_native）、中立化后在形状描述符里的**列 token**（kg / onto；null = 该侧不是一列）、以及**载体位置**（carrier_position.kg / .onto）。cases[*].declared_surface.columns 里 kg ≠ onto 的条目必须用 carrier_position 引用本表 id，门禁逐字核对（G23-10）；每条必须有 reason + source（文档路径 + §号）。删掉本表条目 ⇒ 该用例变成**悬空引用 ERROR**；删掉用例侧的对应声明 ⇒ 该例如实判 **DIFF**（对照是承重的，不是装饰）。"
    entries:
      - id: CP-AFFECTS
        neutral: AFFECTS.component_type
        kg: AnyObject.neutral_type
        onto: FaultMode.component_type
        kg_native: ["CC_AFFECTS", "obj.ccfType（被影响实例的中性类型码；P1 写在每个节点上）"]
        onto_native: ["ccf:affects", "ccf:fmComponentType"]
        carrier_position:
          kg: "关系边 CC_AFFECTS（LPG 边是一等资源、可直接带属性），宾语是**实例**（真机 42 条 = 14 个故障模式按 fmComponentType 批量挂到该类型的全部现存实例：19/4/3/3/2/2/2/1/1/1/1/1/1/1）"
          onto: "对象属性 ccf:affects（RDF 三元组不可带属性），宾语是**类**（14 条，owl:Class）"
        reason: "「受影响的组件类型」这条信息两侧都答得出来，但**载体位置**不同：KG 只能从被影响**实例**的 ccfType 读（LPG 的类不是节点，没有类型节点可指向），ONTO 只能从**故障模式**个体的 ccf:fmComponentType 读（宾语是类，类上没有实例属性）。真机取证：每个故障模式被影响实例的中性类型集合**唯一**且逐条等于其 fmComponentType ⇒ KG 侧按类型码 DISTINCT 归一到 14 行，才与 ONTO 的 14 个类同粒度。这是方案 2 的一处真实建模成本（类级宾语/关系属性需改造），不是投影缺陷。"
        source: "docs/03-方案1设计（知识图谱+LLM）.md §4.3（含门禁断言 T3：每个 FaultMode 至少有 1 条 AFFECTS 出边、目标类型 = 其 fmComponentType）；docs/04-方案2设计（本体+LLM）.md §2；docs/00-总体设计与裁决记录.md §6.3"
      - id: CP-AFFECTS-SEVERITY
        neutral: affects_severity
        kg: AFFECTS.affects_severity
        onto: FaultMode.affects_severity
        kg_native: ["CC_AFFECTS.severity（边属性）"]
        onto_native: ["ccf:affectsSeverity（故障模式个体属性）"]
        carrier_position:
          kg: "关系边属性 a.severity（LPG 边可直接带属性）"
          onto: "故障模式个体属性 ccf:affectsSeverity（RDF 三元组不可带属性 ⇒ 只能改挂到个体）"
        reason: "严重度是**边属性**：LPG 的边可直接带属性，RDF 三元组不可 ⇒ ONTO 侧物化成故障模式个体属性 ccf:affectsSeverity（scheme2-onto/ontology/cc-fault.ttl 的 ccf:affects 注释自述此口径）。同一取值、两种载体位置 ⇒ 必须显式声明，不能靠列名巧合。"
        source: "docs/03-方案1设计（知识图谱+LLM）.md §4.3；scheme2-onto/ontology/cc-fault.ttl（ccf:affects 注释：副作用属性 severity 物化为 ccf:affectsSeverity）；docs/00-总体设计与裁决记录.md §6.3"
      - id: CP-HAS-EVIDENCE
        neutral: HAS_EVIDENCE.relation_id
        kg: HAS_EVIDENCE.relation_id
        onto: null
        kg_native: ["CC_HAS_EVIDENCE", "CC_HAS_EVIDENCE.ccfRelId（P1 在每条边上写的投影关系身份键）"]
        onto_native: ["cc:hasEvidence"]
        carrier_position:
          kg: "关系边属性 h.ccfRelId（关系型本身是边；边属性 ⇒ KG 独有列）"
          onto: "**不存在**：ONTO 有关系型 cc:hasEvidence，但没有「关系身份键」这种列（type-map#common_properties.onto 无 relation_id）；「这条证据属于谁」由**节点级** cc:Evidence.recordId 承担（C5 溯源）"
        reason: "关系身份键 ccfRelId 是 LPG 边属性的直接产物（type-map#common_properties：kg 有 relation_id、onto 没有）⇒ KG 侧多一列。ONTO 侧该信息的承担者是**节点级** cc:Evidence.recordId（真机逐条可回指 CCF 记录 id），故本列按 KG 侧 carrier_specific 声明、不计入声明面比对；两侧行数仍须一致（真机 191/191）。"
        source: "shared/mapping/type-map.yaml #common_properties（kg 有 relation_id、onto 无）；docs/03-方案1设计（知识图谱+LLM）.md §8（查询模式集）；docs/04-方案2设计（本体+LLM）.md §2（cc:Evidence.recordId = CCF 记录 id、逐条可溯源）；docs/00-总体设计与裁决记录.md §6.3"

# -----------------------------------------------------------------------------
# 判据清单（逐条编号；报告里逐条打印）
# -----------------------------------------------------------------------------
criteria:
  G23-00: "可达性/前置条件：任一载体不可达、契约文件缺失/空/不可解析、映射表缺失、CC_NEO4J_PASSWORD 缺失、ONTO 侧不存在 snapshotId 对应的命名图 ⇒ RESULT: BLOCKED 且 exit 2（措辞与退出码照抄 shared/verify/parity.py 的 M2.18 先例）。绝不打印 PASS。"
  G23-01: "用例层：逐条执行本契约 cases[*] 的两侧查询，各自归约成形状描述符后逐字段比对。"
  G23-02: "关系粒度层：对 sources.rel_map#relations 中每一条 asserted: true 的关系型，两侧各跑一次「端点身份键」形状查询，只比列集合/行数量级/作用域，**不比身份值**（值等归 G22 shared/verify/abox_identity_gate.py 的 G22-07 / G22-08）。契约口径：**值等 → G22；形等 → G23**。"
  G23-03: "反恒真下限：--min-cases（默认 8）非法 ⇒ PARAM_ERROR exit 2；实际用例数 < --min-cases ⇒ ERROR。另要求至少 3 个用例的 rows_class != zero（至少一侧成立），否则报「空集相等」恒真风险 ⇒ 真机默认 WARN、--strict 升 ERROR。"
  G23-04: "分侧计数与明细：逐用例给出 shape_kg / shape_onto / SAME|DIFF|unresolved，并汇总 cases_total / same / diff / unresolved；有任何 DIFF ⇒ FAIL exit 1；有 unresolved 且无 DIFF ⇒ 视 --strict（默认 WARN + exit 0，--strict ⇒ exit 1）。"
  G23-05: "幂等/只读：只发 SELECT/MATCH；不得写入任何库；重复运行结果一致。"
  G23-06: "归一化 fail-closed：不可归一化的类型/属性/关系型、无标签的行作用域变量、非 <var>.<prop> 形态的返回表达式 ⇒ ERROR。"
  G23-07: "禁止短路：任一侧查询报错/超时/HTTP 非 200 ⇒ 该用例记 unresolved（--strict 升 ERROR），**绝不用空描述符代替**。（合法空结果 rows_class=zero 是**真实描述符**，不属 unresolved。）"
  G23-09: "声明面非空且逐列有据：`declared_surface.columns` 必须 ≥1 条，且每条必须有非空 `canonical` / `kg` / `onto` / `source`（source = 文档路径 + §号，不写行号）⇒ 否则 ERROR（该例记 unresolved）。空声明面会让比对退化成恒真，故 fail-closed。"
  G23-10: "跨载体对照与排除项逐条有据：① `declared_surface.columns` 里 `kg != onto` 的条目必须给出非空 `reason`，且 `carrier_position` 必须指向 `neutral_extension.carrier_position.entries` 里**存在**的条目 id，该条目登记的 `kg`/`onto` 列 token 必须与用例条目逐字一致 ⇒ 悬空引用/不一致/缺 reason 一律 ERROR；② `carrier_specific_columns` 每条必须有非空 `reason` + `source`，若带 `carrier_position` 则该条目在本侧的列 token 必须与登记一致、且另一侧登记必须为空（载体专有性）⇒ 否则 ERROR；③ 表级：`carrier_position.entries` 每条必须有 `id` / `neutral` / 「两侧载体位置」`carrier_position.kg` + `.onto`（写「不存在」也算有）/ `reason` / `source`，且有列 token 的一侧必须登记该侧原生名（`kg_native` / `onto_native`）⇒ 缺表或缺项 ERROR。"
  G23-11: "反恒真闸门（声明列必须真实存在）：声明条目的 `kg` / `onto` 原生 token 必须分别出现在该侧**原生**描述符的 `columns` 里；`carrier_specific_columns` 的 token 必须出现在其声明的一侧、且在另一侧**不存在** ⇒ 否则 ERROR（该例记 unresolved）。声明面只在**内部**把两侧对齐到同一粒度：**未被声明覆盖的原生 token 不静默丢弃，仍照原样参与比对 ⇒ 如实判 DIFF**。"

# -----------------------------------------------------------------------------
# 用例集：Q01–Q08（docs/03 §8 基线查询的中性形状条目）
# -----------------------------------------------------------------------------
case_set:
  id_prefix: Q
  min_cases_default: 8
  note: "以下 8 条即今天的用例层全部内容；每例的中性形状 = grain_scope + columns + rows_class（见 descriptor），并由本契约 cases[*].declared_surface 声明 ③ 的比对面（逐列 canonical / kg / onto / source；跨载体列另加 reason + carrier_position）。"
  deviations_from_source:
    - "契约查询**不写 ORDER BY**：行序不属形状（属内容），且排序会引入载体差异噪声。"
    - "契约查询**不施加业务参数过滤**（如 q01 的 $appCode、q02 的 $metricCodes）：参数值是内容不是形状，且施加后若某侧缺该值会让整例塌成 zero，反而**掩盖**形状差异。队长若要恢复参数化，改本契约 cases[*].params 即可（数据驱动）。"
    - "Q02 源查询用 collect(...) 把判据聚合成一列：聚合是**内容折叠**，折叠后形状不可比。契约改为**逐判据一行**（行粒度化），形状才可比。"
    - "Q05 的 KG 侧 CC_AFFECTS 指向多态实例（9 种标签），无单一载体标签 ⇒ 契约在 var_type_overrides 显式声明中性类型 AnyObject，并如实登记这是**声明的宽化**而非从映射表推出。M2.26 进一步把两侧对齐到**同一信息粒度**：KG 查询改用 `obj.ccfType`（中性类型码）并 `RETURN DISTINCT`，把 42 条实例行归一到 14 个类型码；ONTO 查询并列 `ccf:fmComponentType`。两侧都是「故障模式 → 受影响组件**类型**」的 14 行 4 列；跨载体列（受影响组件类型、严重度）由 declared_surface + carrier_position 显式声明来源（见 R-19）。"
    - "③ 的比对面 = 契约**声明面**（M2.26）：`cases[*].declared_surface.columns` 逐列声明 canonical（契约面 token）与两侧原生 token；**未被声明覆盖的原生 token 原样参与比对 ⇒ 如实判 DIFF**（绝不静默丢弃，也绝不用声明面把差异删掉当解法）；两侧 token 不同的条目必须给 reason + 指向 `neutral_extension.carrier_position.entries` 的 id。比对仍复用**同一个** compare_descriptors；原生形状另存 native_shape_kg / native_shape_onto 并逐例打印。"
    - "声明面**不是**按侧白名单：它只做**跨载体**列对应（另一侧没有的列必须显式登记为 carrier_specific 并给 reason + source），且 G23-11 反查每条声明列必须真实存在于该侧**原生**列 ⇒ 不一致即 ERROR；**不**把 DIFF 降级成 WARN，**不**改任何阈值/下限/判据。"
    - "Q08 的 HAS_EVIDENCE.relation_id（KG 边属性 h.ccfRelId）声明为 **KG 侧 carrier_specific**：ONTO 没有「关系身份键」列（common_properties.onto 无 relation_id），该信息由**节点级** cc:Evidence.recordId 承担 ⇒ 该列不计入声明面比对（仍逐例打印并进 --json），两侧行数照旧必须一致（真机 191/191）。"
    - "Q02/Q06 的 ONTO 判据通路改用**对象属性** ccf:jMetric（判据→ccm:Metric 个体）与 ccf:jThreshold（判据→档位个体，7+3=10），与 KG 的 `->(m:CC_Metric)` 和阈值面同义；不再用字面量 ccf:jMetricCode / ccf:jThresholdReference 去连个体（后者是字符串，连 ccm:Threshold 恒 0 行 —— 首版真实缺陷）。"
    - "Q03/Q04 关系型对齐：KG 的 `:CC_CAUSES`（16 条）与 ONTO 的 ccc:linkKind ∈ {causes(12), conditional_causes(4)} 逐条一一对应，2 条 `:CC_RELATES_TO` ↔ linkKind=relates_to（按 cco:neutralCode ↔ r.contractId 逐边核对，证据 tmp/_g23_shape_probe.py 的 F2/F3）⇒ ONTO 侧加 `FILTER(?linkKind != \"relates_to\")`。这对齐的是**关系型集合**（结构），不是取值（内容）；四种关系取值一律不参与描述符比对。"
    - "Q03/Q04 计数语义对齐：Neo4j 单条变长模式内**关系不得重复**（关系同构），而 SPARQL 的 `?l1…?l4` 允许绑定同一个体 ⇒ ONTO 侧加两两 `FILTER(?li != ?lj)`。对齐后两侧 59 行 / 43 个端点对（逐深度 16/17/15/11）完全一致；未加时 ONTO 为 67 行（多出的 8 条是链接复用）。证据：E3（KG 59/43）、H1–H4（KG 显式 4 段合计 59）、Q4（ONTO 59/43）。"
    - "Q06 阈值面的连接语义对齐：ONTO 侧在阈值 OPTIONAL 内加 `ccm:thresholdMetric ?m` 把档位个体钉到判据自身指向的度量（KG 侧 `th.thrCode = replace(split(j.operandRef,'#')[0],'threshold:','')` 本身就是逐判据的字符串钉法）。这不改变任何取值，只消除 ONTO 侧档位个体跨度量匹配造成的行数爆炸（177 → 23；KG 26）。证据：E11（ccm:thresholdMetric 覆盖 12 个阈值个体）、E12（钉后档位连接仍 10 条，与未钉时 D3=10 相同 ⇒ 阈值面未被削弱）、E13（整例 23 行）。"
    - "中性名对齐（不是判据放宽）：KG 侧 `j.role` / `m.metricCode` 的中性名由 type-map 既有条目钉死（role / metricCode），故 neutral_extension 把 ONTO 侧同一概念的属性登记为**同一**中性名（ccf:jRole→role、ccm:metricCode / cco:metricCode→metricCode）。原写法 j_role / metric_code 会让同一概念在两侧得到两个中性名 ⇒ 形状比对恒 DIFF（首版实测 Q02/Q06 各 1~2 个字段 DIFF 全由此来）。token 带作用域前缀，故 JUDGED_BY.role 与 Host.role 不会混同；值不参与比对。"
  cases:
    - id: Q01
      title: 全栈拓扑（业务 → 承载 → 数据）
      source: scheme1-kg/queries/q01-topology.cypher
      doc: docs/03-方案1设计（知识图谱+LLM）.md
      graph: snapshot
      grep_scope: "CreditCardApp | AppInstance | Container | Host | JdbcDataSource | GaussDBCluster | GaussDBInstance | DatabaseSessionPool | Session | Query | Table"
      kg: |
        MATCH (app:CC_CreditCardApp)
        OPTIONAL MATCH (app)-[:CC_HAS_APP_INSTANCE]->(inst:CC_AppInstance)
        OPTIONAL MATCH (inst)-[:CC_RUNS_IN]->(ctr:CC_Container)
        OPTIONAL MATCH (ctr)-[:CC_DEPLOYED_ON]->(host:CC_Host)
        OPTIONAL MATCH (inst)-[:CC_USES_DATASOURCE]->(ds:CC_JdbcDataSource)
        OPTIONAL MATCH (ds)-[:CC_CONNECTS_TO]->(cl:CC_GaussDBCluster)
        OPTIONAL MATCH (cl)-[:CC_HAS_DB_INSTANCE]->(dbi:CC_GaussDBInstance)
        OPTIONAL MATCH (dbi)-[:CC_HAS_SESSION_POOL]->(pool:CC_DatabaseSessionPool)
        OPTIONAL MATCH (pool)-[:CC_HAS_SESSION]->(sess:CC_Session)
        OPTIONAL MATCH (sess)-[:CC_RUNS_QUERY]->(qry:CC_Query)
        OPTIONAL MATCH (qry)-[:CC_ACCESSES]->(tbl:CC_Table)
        RETURN app.ccfId AS appId, app.ccfLayer AS appLayer,
               inst.ccfId AS instanceId, inst.ccfLayer AS instanceLayer,
               ctr.ccfId AS containerId, ctr.ccfLayer AS containerLayer,
               host.ccfId AS hostId, ds.ccfId AS datasourceId,
               cl.ccfId AS clusterId, dbi.ccfId AS dbInstanceId,
               pool.ccfId AS poolId, sess.ccfId AS sessionId,
               qry.ccfId AS queryId, tbl.ccfId AS tableId, tbl.ccfLayer AS tableLayer
      onto: |
        SELECT ?appId ?appLayer ?instanceId ?instanceLayer ?containerId ?containerLayer
               ?hostId ?datasourceId ?clusterId ?dbInstanceId ?poolId ?sessionId
               ?queryId ?tableId ?tableLayer
        WHERE {
          GRAPH <{{GRAPH}}> {
            ?app a cc:CreditCardApp ; cc:ccfId ?appId .
            OPTIONAL { ?app cc:ccfLayer ?appLayer }
            OPTIONAL { ?app cc:hasAppInstance ?inst . ?inst a cc:AppInstance ; cc:ccfId ?instanceId . OPTIONAL { ?inst cc:ccfLayer ?instanceLayer } }
            OPTIONAL { ?inst cc:runsIn ?ctr . ?ctr a cc:Container ; cc:ccfId ?containerId . OPTIONAL { ?ctr cc:ccfLayer ?containerLayer } }
            OPTIONAL { ?ctr cc:deployedOn ?host . ?host a cc:Host ; cc:ccfId ?hostId }
            OPTIONAL { ?inst cc:usesDataSource ?ds . ?ds a cc:JdbcDataSource ; cc:ccfId ?datasourceId }
            OPTIONAL { ?ds cc:connectsTo ?cl . ?cl a cc:GaussDBCluster ; cc:ccfId ?clusterId }
            OPTIONAL { ?cl cc:hasDbInstance ?dbi . ?dbi a cc:GaussDBInstance ; cc:ccfId ?dbInstanceId }
            OPTIONAL { ?dbi cc:hasSessionPool ?pool . ?pool a cc:DatabaseSessionPool ; cc:ccfId ?poolId }
            OPTIONAL { ?pool cc:hasSession ?sess . ?sess a cc:Session ; cc:ccfId ?sessionId }
            OPTIONAL { ?sess cc:runsQuery ?qry . ?qry a cc:Query ; cc:ccfId ?queryId }
            OPTIONAL { ?qry cc:accesses ?tbl . ?tbl a cc:Table ; cc:ccfId ?tableId . OPTIONAL { ?tbl cc:ccfLayer ?tableLayer } }
          }
        }
      declared_surface:
        columns:
