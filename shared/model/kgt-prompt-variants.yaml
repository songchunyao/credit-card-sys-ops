# ============================================================================
# kgt-prompt-variants.yaml · v1.3
# 方案3（KG-T 家族）提示词变体冻结表 —— R-38「提示词单一事实源」
#
# 单一事实源关系（唯一权威链，顺序即引用方向）：
#   基准全文        shared/deploy/prompts/agent_system.md          ← 主对比组唯一正文
#   KG-T 全文       shared/deploy/prompts/kgt_agent_system.md      = 基准 + 恰 4 条冻结差异
#   KG-T-free 全文  shared/deploy/prompts/kgt_free_agent_system.md = 基准 + 恰 7 条冻结差异（D-5…D-9 + D-11 + D-12；与 meta.frozen_diff_count_kgt_free = 7 一致）
#   本表            只登记「文件引用 + 字节级指纹 + 机械差异清单」，不再内嵌任何提示词正文
#   门禁            shared/verify/f5_kgt_gate.py 从文件复算行级差异，断言差异集合 == 本表清单
#
# 行级差异约定（与门禁实现一致；一个连续 hunk == 一条冻结差异）：
#   kind=add     baseline_line = 插入点之前的基准行数（1-based，即新行插入在某行「之后」的行号；
#                               0 表示插在文件头），variant_line = [新行 1-based 行号, 同行号]
#   kind=replace baseline_line = [起始行, 结束行]（1-based，含两端）
#                variant_line  = [起始行, 结束行]（1-based，含两端）
#   ※ 多一行 / 少一行 / 改一字 / 换行号 ⇒ 门禁失败（差异集合必须逐条相等）。
#   ※ 新增行均为「插在某个段落标题行之后」的单行，故每条 add 恰为 1 行 1 个 hunk。
#
# v1.2 相对 v1.1 的变化（R-38 六条裁定）：
#   (1) baseline 由内嵌 lines 改为文件引用（path + bytes + lf_count + sha256）；
#   (2) variants.<arm> 由内嵌 lines 改为 prompt_file 引用 + expected_tool_count/expected_tools
#       + frozen_diff 清单（id/kind/baseline_line/variant_line/variant_text/why）；
#   (3) 删除 identical_parts 散文（改由门禁的机械行级差异承担，散文无法被机器校验）；
#   (4) KG-T-dyn 本轮不落文件（worklist §E.2 队长终裁），改以 derived_from + 恰 1 条派生差异
#       机械定义，v1 对该组的全部断言改在「派生文本」上执行，断言条数不减；
#   (5) 全角引号规范为 ASCII 引号，与 docs/05 §5.1 与 docs/03 §7.5 的原文一致（v1.1 属既有漂移）；
#   (6) gate 段保留并同步新断言；KG-T-free 的 banned_words_policy: exempt 保留，并新增
#       「豁免组命中集合必须恰等于声明集合」的更强断言（v1 只做跳过）。
#
# v1.4 相对 v1.3 的变化（R-55：BASE 臂落地）：
#   (1) 新增 variants.BASE（dify_app=cc-base-agent）：基线组/无知识库提示词的落盘引用 + 指纹
#       + 恰 3 条冻结差异（D-B1…D-B3）；meta.frozen_diff_count_base = 3；
#   (2) `variant_text` 允许为**行列表**（表达多行替换）；方案3 家族的既有单行字符串约定不变；
#   (3) BASE 不是方案3 家族成员，但其 prompt 必须与「项目级单一事实源」同处一表 —— 本表的
#       baseline 本就是主对比组的正文，故 BASE 登记在此不改变该表的性质。
#
# v1.3 相对 v1.2 的变化（S2b：中性取数能力的契约同步，D47/D48）：
#   (1) 基准文件新增 1 行「中性取数能力」宣告（read_facts），三份提示词同位置同步插入；
#   (2) 工具计数同步：基准 5→6、KG-T 4→5、KG-T-free 1→2、KG-T-dyn 派生 5→6；
#   (3) KG-T-free 新增第 7 条冻结差异 D-12（基准宣告行被 read_live_facts 别名行整行替换），
#       meta.frozen_diff_count_kgt_free 6→7；KG-T 侧冻结差异仍恰为 4 条（该行与基准逐字相同）；
#   (4) 既有冻结差异的 baseline_line / variant_line 因基准插入 1 行而整体后移，逐条同步；
#   (5) KG-T-dyn 派生差异 D-dyn-1 的 parent_line 50→51、variant_line [51,51]→[52,52]。
# ============================================================================
meta:
  version: "1.4.0"
  date: "2026-10-08"
  owner_doc: docs/09
  supersedes: "1.3.0"
  frozen_at: "2026-10-05"
  frozen_diff_count: 5
  frozen_at_kgt_free: "2026-10-05"
  frozen_diff_count_kgt_free: 8
  frozen_diff_count_kgt_dyn_derived: 1
  # ★ R-55（v1.4，2026-10-08）：新增 BASE 变体（基线组/无知识库）。它是**非方案3家族**的变体；
  #   登记进本表是因为本表已是**全项目提示词的单一事实源**（其 baseline 本就是主对比组的正文）。
  frozen_at_base: "2026-10-08"
  frozen_diff_count_base: 4
  line_count_convention: "行数一律以字节级 LF 计数（LF = bytes.count(0x0A)），UTF-8 无 BOM、LF-only；不得用 Get-Content .Count（对中文 UTF-8 给伪值）"
  change_note: >-
    R-38（提示词单一事实源）：基准与两份变体改为独立落盘文件，本表只登记文件引用、字节级指纹与
    机械可复算的行级差异清单；删除 v1.1 的内嵌 baseline.lines、variants.*.lines 与 identical_parts
    散文；引号规范为 ASCII；KG-T-dyn 改为派生式声明（不落文件）。
    S2b（v1.3）：基准新增 1 行中性取数能力宣告（read_facts，D47/D48），三份提示词同位置逐字同步；
    工具计数 6（基准）/5（KG-T）/6（KG-T-dyn 派生）/2（KG-T-free）；KG-T-free 新增冻结差异
    D-12（read_live_facts 声明式别名整行替换基准宣告行）⇒ frozen_diff_count_kgt_free 6→7。
    R-55（v1.4，2026-10-08）：新增 BASE 变体（基线组 = 无知识库、只读 CCF 原始事实），冻结差异恰 3 条
    （D-B1…D-B3，均为**等长 replace**：2↔2 / 3↔3 / 3↔3）；§1–§5 与基准**逐字相同**（公平性关键面）。
    ★ 约定泛化（向后兼容）：`variant_text` 允许为**行列表**以表达多行替换；方案3 家族既有条目仍为
    单行字符串，F5 对它们的断言（`text: [d["variant_text"]]`）**完全不变**。
    BASE 的差异由 `shared/deploy/dify/deploy_agents.py --selftest` 的机械复核承担（见该脚本 R-55 段）。
    ★ R-63（2026-10-16）：基准提示词追加 §6「最终答复的排版」（禁止前置散文、禁止 JSON 信封包裹）
    ⇒ baseline 指纹 6461 B/91 LF/60fab0b5… → **7710 B/105 LF/5941c0f9…**；§1–§5 与 required_block 未动。
    ★ R-63 二次修订：首版 §6 写成「立刻输出最终答复、不再调用任何工具」⇒ 真机 16 次调用全部退化为
    1 轮 0 次工具调用（模型直接编造结论）；已改写为「本节只约束排版、不豁免 §1–§3 取证要求」。
    ★ R-63 三次修订（定型）：§6 的取证句**去掉工具名**（改为「工具选择遵循 §2」），并把该节**逐字相同**
    地追加到 `base_agent_system.md`、`kgt_agent_system.md`、`kgt_free_agent_system.md`（派生 KG-T-dyn 随之改变）。
    理由：① KG-T 变体有一票否决断言「不含 cc_cause」，工具名版 §6 会命中 ⇒ 必须中性化；
    ② 只有**逐字相同**的追加才不会产生新 hunk ⇒ 冻结差异条数维持 KG-T 5 / KG-T-free 8 / BASE 4 不变，
    `f5_kgt_gate.py` B2/B3-a/B4 与 `contract_gates.py` X18 只需重登记指纹。受影响的登记值：
    KG-T 5571→**6820** B（82→**96** LF，b1ac7d85→**c2dcb7d4**）、KG-T-free 6268→**7517** B（84→**98** LF，
    bf6e3329→**a703556b**）、KG-T-dyn 派生 5678→**6927** B（83→**97** LF，27afad02→**2a49e9a2**）、
    BASE 5922→**7171** B（82→**96** LF，01afcd7f→**142007a3**）。

