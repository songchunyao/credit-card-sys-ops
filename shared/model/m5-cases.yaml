open_questions:
  - id: OQ-M5-01
    severity: high
    question: "docs/06 §1.3 的族→难度构成（easy=C1+C5、medium=C2 的 F1/F3/F4/F6+C3、hard=C2 的 F2/F5/F7+C4+C6）算出来是 20/14/16，与它自己声明的 16/20/14 不自洽。应以哪个为准？"
    impact: "录制方无法据此决定每条用例的 difficulty。当前处置：门禁只断言边际构成（族 14/14/6/6/4 与难度 16/20/14），不对族×难度联合构成做任何断言。"
    not_our_call: "本契约不私自凑数，也不改 docs/06 原文。"
  - id: OQ-M5-02
    severity: medium
    status: closed
    closed_at: "2026-09-29"
    closed_by: "队长裁定（终局）"
    question: "docs/06:177 说主判据分母固定 50，与 abstain 不计对错（要扣除）字面冲突。主口径的分子分母到底怎么取？"
    impact: "（原文保留，作历史留痕）W18 已实现为主口径分母 = 可用记录数 + 敏感性分母 = 记录总数；若裁决为「分母恒为 50 且 abstain 既不入分子也不入分母」，W18 需要改。"
    resolution: "已裁决：主口径 = 固定分母 50、abstain 计未命中（取本问题所述第二种取法的变体：abstain 既不进分子，也不缩小分母）。依据 = 端到端可用性（银行运维按「这条回答到底能不能用」看读数）+ 保守方向（abstain 只会让读数不更好）。旧「可用记录数」口径降为诊断列 denominator_excluding_abstain / rate_excluding_abstain，只作诊断与回归对照。落地 = shared/verify/m5_judge.py 各单元主 denominator/rate 走固定分母，shared/verify/m5/stats.py compare_binary(abstain_as_error=True) 为主口径（另一路 False 作敏感性）。"
    gate: "shared/verify/m5_judge.py check_denominator_policy：三处声明（suite.fixed_denominator / scoring.denominator / scoring.abstain.main_axis）任一仍把「可用记录数」写成主口径 ⇒ E-DENOM-POLICY（fail-closed）。"
