# gate-registry.yaml —— shared/verify 门禁的**声明面**（数据，不是代码）
#
# 补 HB7 缺口：shared/verify/ 此前没有聚合 runner；G24（工具面契约）只在队长临时脚本
# tmp/_m3_exit_regress.py 里覆盖过 36 例，而该临时脚本不是交付物。
# 消费者 = shared/verify/gate_runner.py（执行 + 聚合）。
#
# 约定（与既有门禁一致）：
#   退出码 0 = PASS / 1 = FAIL / 2 = BLOCKED（未测得）；优先级 BLOCKED > FAIL > PASS。
#   gate_runner 对**其它任何退出码**（含负数、>2、启动失败、脚本不存在）判 FAIL 并点名原码；
#   例外：该条已声明 declared_deviation_exit_codes（见下方第四态说明）时才记 DECLARED-DEVIATION。
#
# ★ v1 **不 pin 任何门禁文件的 sha256**：sha256 一律留空 = 只观测不判死。
#   理由：此刻有并行施工者（W27/W28/W30/W31）正在改动 shared/deploy/smoke/e2e_smoke.py、
#   shared/verify/purity_gate.py、shared/verify/m5_judge.py、shared/verify/m5/*.py、
#   shared/model/m5-cases.yaml —— 若 pin 死必然假红。运行后由 gate_runner 如实打印**观测到的**
#   sha256（含 file_sha256 与 stdout 的 sha256[:12]）。
#
# 覆盖契约（fail-closed）：shared/verify/ 下**每一个** .py 都必须在本文件里有且仅有一条登记
#   （kind ∈ {gate, library}）。新门禁加入而未登记 ⇒ `--audit-coverage` exit 1。
#
# 已核验的文档串编号记在 g_ids（来源 = 各脚本自身 docstring/描述串，逐个现场读过）；
# 主键 id 取**文件名主干**（稳定、唯一、不会被某个脚本改文档串而漂移），不用 G 号当主键。
#
# argv = 该门禁**默认模式**的完整参数，逐条现场核对来源：
#   (a) 队长权威实跑台账 tmp/_m3_exit_regress.py 的 CASES 表（36 例）；
#   (b) 该脚本自身 docstring 用法行 / argparse 定义（regress 未覆盖的 m5_cases_gate /
#       m5_judge / purity_gate 等）。
# 记账口径：argv 为相对仓库根的 POSIX 路径；gate_runner 以仓库根为 cwd 调用门禁。
#
# 分类判据（Q3 裁决，可审计）：某 .py 判 kind=gate ⟺ 下面三条同时成立 ——
#   (1) 有 `if __name__ == "__main__"` 入口（或有模块级收尾 sys.exit，如 contract_gates.py:706）；
#   (2) 有 argparse 参数面（或 docstring 里有明确用法行的手工 sys.argv 解析）；
#   (3) 自身 docstring/描述串给出可独立跑出的三态退出码语义。
#   三条缺任一条 ⇒ kind=library（被别的脚本 import、无独立 CLI）；library 只登记、不执行。
#
# ★ 第四态（Q2 裁决）：guard_conformance.py 另有 exit 3 = CARRIER_SPECIFIC —— 依据该门禁自己的
#   docstring/源码（:25、:31、:120、:758、:1023）「该偏离已被登记为『载体能力边界』」，绝非 FAIL。
#   只有在本条**显式**写 declared_deviation_exit_codes: [3] 时，gate_runner 才把 3 记为
#   DECLARED-DEVIATION（单列：不并入 PASS、也不并入 FAIL，并照抄该门禁自己的 RESULT 行）；
#   **未声明即按 FAIL** 并点名原始退出码。该字段可选；三态码 0/1/2 不得写入（写即契约错误 ⇒ exit 2）。

