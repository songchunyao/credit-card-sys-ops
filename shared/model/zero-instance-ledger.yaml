# ============================================================================
# zero-instance-ledger.yaml — 零实例关系 / 零观测指标的**审计台账**（M1.8a 新建）
# ----------------------------------------------------------------------------
# 为什么要有这个文件：CCF 是「采集到什么就写什么」的统一事实层，**沉默的缺口**（某条契约关系
# 一条实例都没有、某个契约指标一个观测都没有）在 CCF 里长得和「本来就不该有」一模一样。
# 本台账把这些零值逐条落到「为什么零 + 一手证据 + 谁在依赖它 + 怎么补 + 哪个里程碑」，
# 并由门禁 G16（shared/verify/zero_instance_gate.py）强制：**在册的零值必须在这里登记**，
# 否则 G16 直接 ERROR。它不改任何契约、不放宽任何门禁，只把缺口从"没人知道"变成"有人负责"。
#
# 与本文件的关系（契约只读，本文件是台账不是契约）：
#   · shared/mapping/rel-map.yaml   —— 14 条 asserted 业务关系 + 4 条逆关系 + 1 条派生关系（权威）
#   · shared/model/metrics.yaml     —— 70 个契约指标（权威；★ P0-A 2026-10-12 由 58 增至 70）
#   · shared/model/v3-ccf-map.yaml  —— 采集映射表（path → metricCode / 对象与关系派生规则）
# ============================================================================

