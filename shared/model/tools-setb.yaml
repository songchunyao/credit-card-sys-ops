    description_basis: "docs/05 §2.2 写法纪律；docs/03-方案1设计（知识图谱+LLM）.md §7.1（事实子图、结果上限）"
    description_authored: true
    params:
      - name: objectType
        type: string
        required: true
        constraints: "必须是本环境已声明的对象类型（未知类型 ⇒ INVALID_PARAM，不得回落）"
        c3_participation: compared
        basis: "docs/05-编排层设计（Dify）.md §2.1 逐字：properties = {\"objectType\":…, \"objectId\":…, \"metricCodes\":…}、required = [\"objectType\"]；类型为自拟（同族先例 shared/model/kgt-tools.yaml get_facts 的 request.properties）"
        authored: "type"
      - name: objectId
        type: string
        required: false
        constraints: "可选；限定到单个对象"
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1 逐字 {objectType, objectId?, metricCodes?}（`?` = 可选）；类型自拟"
        authored: "type"
      - name: metricCodes
        type: array
        required: false
        constraints: "可选；元素为字符串指标码"
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1；类型自拟"
        authored: "type"
    uses_common_error_codes: [INVALID_PARAM]
    error_codes: [INVALID_PARAM]
    returns:
      - name: objects
        type: array
        semantics: "匹配到的对象（含对象 id、类型与属性）"
        item_fields: [objectId, objectType, attributes]
