manifest_contract:
  why: "门禁的数据源必须是**从实现生成的清单**。手写清单可以被伪造成「两侧一致」，因此本契约要求两侧服务各自以 --emit-manifest 产出清单，并要求清单携带其来源实现文件的路径与 sha256 —— G24 校验「清单与实现同源」。"
  produced_by: "两侧服务的实现（M3.2 / M3.3）；★ G24 **不**产出 manifest（门禁自产清单等于自证）"
  interface: "服务 CLI 增加 --emit-manifest <path>；产出 JSON（UTF-8 无 BOM），只描述**该侧工具面**，不含任何密钥/端点凭据"
  format:
    schema: "dsh-toolface-manifest/1"
    required_keys: [schema, carrier, tools]
    keys:
      schema: "字面量 dsh-toolface-manifest/1"
      carrier: "kg | onto（与传入的 --kg-manifest/--onto-manifest 槽位必须一致，否则 ERROR）"
      arm: "实验组标识，取值应在本契约 c3.scope_pairs 内（KG-Q / KG-R / ONTO-Q / ONTO-R）；两侧都声明时必须构成一个已声明的对照对，否则 ERROR（跨线混比）"
      tool: "产出该清单的服务实现文件（仓库相对路径，正斜杠）——可选，信息性"
      source: "实现文件仓库相对路径（单文件形态）"
      sourceSha256: "该文件内容的 sha256（小写 hex）；G24 与该文件**当前**内容比对，不一致 ⇒ ERROR"
      sources: "多文件形态： [{path, sha256}, …]；与 source/sourceSha256 二者至少给一组（都不给 ⇒ BLOCKED，理由：清单未声明来源 = 无法验证同源）"
      tools: "列表，每项 {name, params:[{name,type,required}], returns:[{name,type?}], source?, sourceSha256?}"
      emittedAt: "可选 ISO-8601 时间戳"
  comparison_keys: "G24 只读 tools[].name / tools[].params[].{name,type,required} / tools[].returns[].name；其余键是溯源与可读性信息"
  fail_closed:
    - "manifest 缺失 / 不可解析 / 无 tools[] / tools 为空 ⇒ RESULT: BLOCKED，exit 2（绝不打印 PASS）"
    - "manifest 未声明任何 (source, sourceSha256) 或声明的实现文件在 repo-root 下不存在 ⇒ RESULT: BLOCKED，exit 2"
    - "任一 (source, sourceSha256) 与文件当前 sha256 不一致 ⇒ ERROR（『清单与实现不同源 = 可伪造』），exit 1"

g24:
  id: G24
  name: "Set B 8 工具面实现级一致性（C3/P7）"
  impl: "shared/verify/toolset_parity_gate.py"
  contract_snapshot: "shared/model/tools-setb.yaml"
  exit_codes:
    "0": "PASS"
    "1": "FAIL（两侧**声明的**工具面真实分歧，或契约自检失败）"
    "2": "BLOCKED（前置条件不满足，本门禁未执行）或 PARAM_ERROR（命令行参数非法）"
  criteria:
    - id: G24-00
      name: "前置条件（fail-closed）"
      rule: "契约缺失/空/不可解析、任一 manifest 缺失、任一 manifest 声明的实现文件缺失、repo-root 不存在 ⇒ `RESULT: BLOCKED`，exit 2；措辞照抄 shared/verify/parity.py 的 M2.18 先例（『★ 前置条件不满足：… ⇒ 本门禁未执行；既非 PASS 亦非 FAIL，exit=2』+『★ BLOCKED ≠ FAIL』对照段）。**绝不在缺输入时打印 PASS**。"
      basis: "任务书 M3.1；shared/verify/parity.py 的 BLOCKED 先例（M2.18）"
    - id: G24-01
      name: "输入溯源显式打印"
      rule: "运行时必须打印**用到的**契约路径 + 两份 manifest 路径 + repo-root + 每个 (source → 实际 sha256 vs 声明 sha256)，以消除『省略参数仍 BLOCKED 而计数被误读』的歧义。"
      basis: "shared/verify/t10_native_parity.py:1026 与 :356 的 argparse 默认值陷阱先例"
    - id: G24-02
      name: "同源校验"
      rule: "每个 manifest 声明的 (source, sourceSha256) 必须与 repo-root 下该文件当前 sha256 逐字一致；不一致 ⇒ ERROR（『清单与实现不同源 = 可伪造』）。"
      basis: "任务书 M3.1；诚实边界 HB2"
    - id: G24-03
      name: "工具名集合"
      rule: "两侧各自的工具名集合必须**逐字等于**契约 tools 的键集合（不是子集、不是超集）；同时契约自检要求该集合等于 shared/model/info-products.yaml#access 中四个 Set B 组的 tools 列表。"
      basis: "docs/06 §4 P7；docs/06 §6 G8；shared/model/info-products.yaml#access"
    - id: G24-04
      name: "参数三元组逐字比对"
      rule: "对每个参与比对的工具，两侧参数的 (name, type, required) 集合必须逐字相同；契约外参数、缺失参数、类型不同、必填性不同 ⇒ 各自一条 ERROR（给出 diff）。"
      basis: "docs/05 §2.1（入参名必须一致）；docs/06 §4 P7"
    - id: G24-05
      name: "返回字段名集合逐字比对"
      rule: "每个参与比对的工具的**顶层**返回字段名集合（工具特有字段 ∪ 公共信封）两侧必须逐字相同；契约外字段或缺失字段 ⇒ ERROR。"
      basis: "docs/06 §4 P7；本契约 return_envelope"
    - id: G24-06
      name: "排除必须由契约标志驱动"
      rule: "只有 c3_participation: excluded 的项（且带 excluded_reason）可以被排除；**不得**按侧写白名单排除；报告必须逐项给出 compared / excluded 计数。"
      basis: "任务书 M3.1；T10 排除清单的同一思想"
    - id: G24-07
      name: "反恒真下限"
      rule: "--min-tools 默认 = 契约声明的工具数（当前 8）；非法值（非整数 / < 1）⇒ PARAM_ERROR，exit 2；实际参与比对的工具数 < --min-tools ⇒ ERROR；工具集为空 ⇒ ERROR。"
      basis: "任务书 M3.1；同类先例 shared/verify/answer_shape_gate.py 的 G23-03"
    - id: G24-08
      name: "契约自检（不依赖 manifest 也能跑）"
      rule: "契约自身的自洽性：每个 returns 项必须有 c3_participation；excluded 项必须有 excluded_reason；info-products.yaml 的四组工具集必须等于契约工具集；每个工具的 description 必须不命中禁用词正则（docs/05 §5.2）；工具名必须等于键名。违约 ⇒ ERROR（G24-C0x）。"
      basis: "docs/05 §5.2（必须机器检查）；docs/03 §7.2 的词表纪律"
    - id: G24-09
      name: "只读与幂等"
      rule: "本门禁只读：不写任何文件、不改契约、不产出 manifest；重复运行结果相同。"
      basis: "全项目门禁纪律"
    - id: G24-10
      name: "三源交叉一致（契约 / info-products.yaml / kgt-tools.yaml）"
      rule: >
        ① 契约 tools 的键集合（含顺序）必须**逐字等于** shared/model/info-products.yaml#access.<arm>.tools，
        对四个 Set B 组（KG-Q / ONTO-Q / KG-R / ONTO-R）逐组比对；
        ② shared/model/kgt-tools.yaml 的 allowed_tools_kgt_free 与契约工具集必须**无交集**；
        ③ forbidden_tools_kgt_free 必须**包含**契约工具集（方案3 的插件组不得拿到 Set B 任何工具）；
        ④ forbidden_tools_main_arm / forbidden_tools_all_arms ∩ 契约工具集、以及
        attribution_axis_forbidden.tool(=cc_cause) 与 applies_to_arms(=方案3 三组) 作为**信息性记录**打印
        —— 它们描述的是方案3 的禁令（方案3 与 Set B 的差异正是被测变量），**不是**冲突，不得据此放宽①②③。
        任一条 ①②③ 不成立 ⇒ ERROR。★ 本判据**今天就有真机判别力**（三个文件都已存在），不依赖任何 manifest。
      basis: "shared/model/info-products.yaml（C3 的机械依据，其头部注释给出 C3 的重述）；shared/model/kgt-tools.yaml §三 禁令（forbidden_tools_main_arm / forbidden_tools_all_arms / forbidden_tools_kgt_free / allowed_tools_kgt_free / attribution_axis_forbidden）；队长 M3.1 追加约束 ①"
    - id: G24-11
      name: "契约静态计数自洽（boundary_counts ↔ 运行时重算）"
      rule: >
        契约 g24.boundary_counts 必须齐备下列键，且逐键等于本门禁**从契约现场重算**的值：
        tools / compared_tools / compared_params / excluded_params / tool_level_return_fields /
        envelope_fields / compared_return_fields / excluded_return_fields / carrier_specific_divergences。
        任一不符或缺键 ⇒ ERROR（G24-11）。★ 本判据只依赖契约自身，**不依赖 manifest**，
        因此 --contract-only 也具备完整判别力。计数口径见 boundary_counts 的注释（消除歧义）：
        compared_return_fields = tool_level_return_fields + envelope_fields × tools，
        因为公共信封 fields 对每个工具都适用。manifest 侧的实际参与计数（compared_tools 等）
        由 G24 在比对时另行打印，**不属于**本声明。
      basis: "本契约 g24.boundary_counts.note（自述『二者不一致即表示契约被改过』）；门禁体系的一般纪律：数量声明必须可由机器重算"
  boundary_counts:
    # ★ 计数口径（G24-11 现场重算并逐键比对；下列键必须齐备且相等）
    #   tools                        = len(tools)
    #   compared_tools               = 参与 C3 比对的工具数（= len(tools)）
    #   compared_params              = Σ 各工具 c3_participation != excluded 的参数
    #   excluded_params              = Σ 各工具 c3_participation == excluded 的参数
    #   tool_level_return_fields     = Σ 各工具 c3_participation != excluded 的 returns
    #   envelope_fields              = |return_envelope.fields 中 c3_participation != excluded 的项|
    #   compared_return_fields       = tool_level_return_fields + envelope_fields × tools
    #                                  （公共信封对每个工具都适用，故按工具数展开）
    #   excluded_return_fields       = Σ 各工具被排除的 returns + 被排除的 envelope_fields × tools
    #   carrier_specific_divergences = Σ 各工具 carrier_specific 条目数（载体特有、不参与比对）
    tools: 8
    compared_tools: 8
    compared_params: 11
    excluded_params: 0
    tool_level_return_fields: 20
    envelope_fields: 4
    compared_return_fields: 52
    excluded_return_fields: 0
    carrier_specific_divergences: 1
    note: "★ 由 G24 每次运行时**从契约现场重算**并与本声明逐键比对（判据 G24-11，不一致 ⇒ ERROR，说明契约被改过而计数未同步）。excluded_return_fields = 0 是**最好**的情形（C3 可比性最强）；唯一的载体特有项是 cc_query 的语法族（HB3 / CF-3）。manifest 侧的实际参与计数（compared_tools / compared_params / compared_return_fields）由 G24 在比对时另行打印，不属于本声明。"

conflicts_for_captain:
  note: "★ 逐条交队长裁决。本契约已按下方『本契约取』一列落笔，但每一项都是**可推翻**的裁决点。"
  items:
    - id: CF-1
      subject: "cc_query 超时值：4 s 还是 8 s"
      evidence: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 守卫表 G4 写 **8 s**（依据 tianshu_v3 实测 8.03 s 撞满 service/main.py 的 timeout=8）；同文件 §7.3 正文与表下修正块明文改定 **4 s**（『8s 会超，因此取 4s』『原写 8s 会被 Dify 的 5s 先掐断，报错信息会指向 Dify 而非查询本身』）；docs/04 §7.1 G5 写 **4 s**；★ docs/00 §风险 R17 仍写 **8 s**；任务书亦写 8 s。"
      decision_taken: "本契约取 **4 s**（两侧一致），并把 §7.2 表内 8 s 标为 superseded。"
      why_needs_captain: "docs/00 的内部不一致未修，且任务书写 8 s；若队长裁定 8 s，G4 会在 Dify 的 5 s 之前先被外层掐断，属已知缺陷。"
    - id: CF-2
      subject: "两侧守卫编号 G1–G10 语义不等价"
      evidence: "docs/03 §7.2：G3 = 单语句（分号 ≤ 1）、G4 = 超时、G9 = 禁 apoc.load.*/apoc.import.*；docs/04 §7.1：G3 = 禁 SERVICE、G4 = 禁属性路径 `*`/`+`、G9 = 禁 GRAPH。同一编号在两侧指不同护栏。"
      decision_taken: "本契约按**角色**（11 个 R-*）对齐，编号仅作注释保留。"
      why_needs_captain: "若有人按编号做机械校验（例如『两侧都要有 G4』），会得到错误结论；需要在 docs 侧声明本契约的编号→角色映射为准。"
    - id: CF-3
      subject: "cc_query 的语法族在语言上不可能一致"
      evidence: "docs/03 §7.1 的 query 是 Cypher；docs/04 §7 明言唯一差别是『cc_query 内部接收 SPARQL 而非 Cypher』；docs/05 §2.1 后注禁止把参数名写成 cypher/sparql。"
      decision_taken: "参数名/类型/必填性参与 C3 比对；语法族写入 carrier_specific（c3_participation: excluded），依据 shared/model/info-products.yaml#excluded_from_parity（载体原生查询语言正是被测变量）。"
      why_needs_captain: "排除项直接削弱 C3 可比性（HB3），必须由队长确认这个排除的口径。"
    - id: CF-4
      subject: "契约字段命名 vs 禁用词纪律（载体词汇泄漏）"
      evidence: "docs/03 §7.1 用 LPG 词汇描述 cc_schema 的返回物（『标签/关系/属性清单』）；docs/05 §1.3 F1 与 §5.2 禁止载体词汇进入模型可见文本（含『图』『本体』）。字段名会随返回进模型上下文。"
      decision_taken: "本契约取载体中性名（objectTypes / relationTypes / attributes），不使用 labels/relations/properties。"
      why_needs_captain: "这是契约第一次『命名权』落到中性词上；另一种可选口径是直接沿用文档措辞（LPG 词汇）并接受泄漏。"
    - id: CF-5
      subject: "C3 射程：跨组全同（旧口径） vs 同对内部逐字（v1.4 现行）"
      evidence: "docs/00 §3.1 C3（v1.4 重述）= 信息可及性对齐 + 『逐字相同』仅严格适用于同一对照对内部；docs/06 §4 P7 同；而任务书表述为『同一工具在两载体上工具名/参数/返回必须逐字节相同』（旧口径）。"
      decision_taken: "G24 射程 = 同一对照对内部（KG-Q↔ONTO-Q、KG-R↔ONTO-R）。"
      why_needs_captain: "报告与门禁的适用范围必须与 docs 对齐，避免把 KG-T/KG-T-free 误纳入 C3 比对。"
    - id: CF-6
      subject: "『C3』编号撞车：硬约束 C3（信息可及性对齐） vs 契约审计项 C3（未识别参数显式报错）"
      evidence: "docs/00 §3.1 的 C1–C6 是架构硬约束（C3 = 信息可及性对齐）；docs/05 §6.4 与 §7 的 C1/C3/C4/C6/C7–C9 是 contract_audit.py 的契约门禁项（C3 = 未识别参数不得静默回落）。"
      decision_taken: "本契约引用时一律写明出处节号，并在 error_codes 里标注属哪一族。"
      why_needs_captain: "两族编号同名不同义，后续 M4.6（契约门禁 C1–C9）时极易误引。"
    - id: CF-7
      subject: "7 工具的返回字段名与多数参数类型在文档中没有逐字规格"
      evidence: "docs/05 §2.1 的 properties 只给 cc_query 的类型（string），其余写省略号；docs/03 §7.1 的返回列是散文；docs/05:87 引用的 tools_registry_onto.json 不在本工作区（全仓 glob `**/tools_registry*.json` 无命中）；env/ 下只有 CreditCardApp.java 与 k8s manifest。"
      decision_taken: "按 docs/05 §2.2 纪律 + 同族先例（shared/model/kgt-tools.yaml 的 request/response 体例、docs/09 §3 的 {nodes, edges, truncated, hopsUsed}）自拟，逐项 authored: true 标注。"
      why_needs_captain: "这些字段名一旦冻结就是两侧必须实现的接口；须确认自拟命名（尤其 cc_facts 的 observations、cc_cause 的 rankBasis）。"
    - id: CF-8
      subject: "G24 与既有 G8 的分工，以及 docs/06 §6 提到的 toolface_diff.py 不存在"
      evidence: "shared/verify/g8_info_parity.py 已断言同一对照对内部 tools **列表**逐字相同；docs/06 §6 G8 行提到 `toolface_diff.py`，但全仓无此文件。"
      decision_taken: "G8 管契约级列表；G24 管实现级参数/返回面；G24 不重复列表比对以外的内容，也不声称取代 G8。"
      why_needs_captain: "需要在 docs/06 §6 / docs/07 §7 明确 toolface_diff.py 是『已被 G24 覆盖、不再新建』还是仍要单独落地。"
    - id: CF-9
      subject: "契约落点（★ 已定，见下 captain_ruling；初版曾落在 shared/verify 目录下）"
      evidence: "①四处门禁都没有『shared/model 下的 yaml 必须登记进某清单』的机制：shared/verify/contract_gates.py:36-43 只按固定 8 个文件名读契约，mapping_gate.py:99-104 与 kg_tbox_check.py:314-319 同；shared/model 下已存在不在这份名单里的 yaml（findings.yaml / zero-instance-ledger.yaml / v3-ccf-map.yaml / answer-shape.yaml）⇒ 它不是封闭登记表。②shared/model/*.yaml 会被**目录级自动摄入**：contract_gates.py:578-601 对 os.listdir(MODEL) 的每个 *.yaml 原文跑 FM- 正则（G18_MIN_REFS=10），ref_gate.py:16/218-222 无条件扫 shared/model/*.yaml 的路径引用且 :307 目标不存在即 ERROR ⇒ 把新文件放进 shared/model 会**改变另一名并发施工者**正在运行的门禁输入集。③shared/verify/ 无任何目录级扫描。"
      decision_taken: "初版落在 shared/verify 目录下（零爆炸半径假设）；后按队长裁定改为落 shared/model 目录（见 captain_ruling）。"
      counter_evidence: "同类『机器可读工具契约』的体例先例 shared/model/kgt-tools.yaml 就住在 shared/model；ref_gate.py:16 明文写『shared/model/*.yaml（必扫：契约与台账都住在这里）』。"
      why_needs_captain: "若队长裁定契约应住 shared/model，只需移动文件 + 改 G24 的默认 --contract 参数（一行），并接受 G18/G20 对本文件的扫描。"
      captain_ruling: "★ 队长已裁定（M3.1 追加约束 ③）：契约落 shared/model/tools-setb.yaml，理由是『shared/model 不被任何门禁按**文件名**枚举』（contract_gates.py:40 是按名显式取 y(\"info-products.yaml\")）。本契约已照此落位；★ 但本条的反证②（**目录级**摄入：contract_gates.py:578-601 对 os.listdir(MODEL) 的每个 *.yaml 跑 FM- 正则；ref_gate.py 无条件扫 shared/model/*.yaml）**并未因此消失** ⇒ 交付前已按队长要求复跑 G18 与 G20，逐字 RESULT 行见 tmp/_m31_report.md。若这两道门禁因本文件变红，则本条反证成立、需队长二次裁决（改文件名 / 加白名单例外 / 或移回 shared/verify/）。"
    - id: CF-10
      subject: "返回值的形态（rows 内层键名）不参与比对 —— 是不是把 C3 做浅了"
      evidence: "本契约只冻结顶层字段名（HB7）；cc_query 的 rows 每项键名由被查询环境决定，两侧必然不同（Cypher 记录 vs SPARQL 绑定）。"
      decision_taken: "顶层字段名参与比对；嵌套键名不参与（登记 OQ-4）。"
      why_needs_captain: "若要求嵌套键名也逐字相同，则 cc_query 的 rows 只能约定为『行对象的键 = 查询投影变量名』，这会把载体差异重新引入比对 ⇒ 可能反而破坏实验。"

open_questions:
  list:
    - id: OQ-1
      question: "cc_trace 的 direction 取值域（双向/出/入）是什么？"
      current_state: "本契约只冻结类型 string 与必填性 false；取值域未冻结。两侧必须取同一组枚举（否则模型侧行为不可比）。"
    - id: OQ-2
      question: "cc_propose 的 evidencePath 元素形态（记录 id？对象 id？路径数组？）"
      current_state: "本契约冻结为 array（元素 = 字符串 id）；元素语义待定。"
    - id: OQ-3
      question: "G10 审计三字段（queryText/elapsedMs/rowCount）写到哪里？"
      current_state: "docs/03 §7.2 G10 只说『记录到审计（满足 C5）』，未指定落点（服务日志？CCF 的 audit.ttl？）。本契约只冻结字段名。"
    - id: OQ-4
      question: "是否把比对延伸到数组项内部字段名（item_fields）？"
      current_state: "当前不比对（HB7）；本契约已逐工具声明 item_fields 作为参考。"
    - id: OQ-5
      question: "参数默认值是否冻结？"
      current_state: "文档未规定任何默认值（maxHops / direction 等）⇒ 本契约不冻结默认值，只冻结类型、必填性与上界。"
    - id: OQ-6
      question: "--min-tools 的默认值是否应上调（防『两侧都只实现 1 个工具』的合谋式通过）？"
      current_state: "默认 = 契约工具数（7）；契约工具集固定为 7，故两侧少实现任何一个工具都会被 G24-03 抓住。"

