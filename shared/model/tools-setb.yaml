# =============================================================================
# shared/model/tools-setb.yaml
#   「Set B」7 工具面契约 —— 硬约束 C3（信息可及性对齐）在**实现级**的机械依据
#   门禁 G24：shared/verify/toolset_parity_gate.py
# -----------------------------------------------------------------------------
# 为什么需要这份契约
#   硬约束 C3（docs/00-总体设计与裁决记录.md §3.1，★ v1.4 重述）要求：**同一对照对
#   内部**的工具面（工具名 / 入参 / 出参 schema）必须**逐字一致**，否则「同一用例 +
#   同一环境」的公平性不成立，L1/L2/L3 三条对比线的结论全部不可采信。
#   此前 C3/P7 只有契约级检查（门禁 G8 读 shared/model/info-products.yaml 比对工具
#   **名列表**），**没有实现级的执行点**：两侧服务各自实现这 7 个端点时，参数名差一个
#   字符、必填性不同、返回字段名不同，都不会有任何门禁变红。本契约 + G24 补上这一点。
#
# 射程（★ 不得外扩）
#   只覆盖**同一对照对内部**：KG-Q↔ONTO-Q、KG-R↔ONTO-R。
#   跨组（KG-T / KG-T-dyn / KG-T-free / BASE）**不适用** —— 这是 C3 v1.4 重述的结果
#   （KG-T 直读结构、没有查询工具，工具面必然不同），不是本契约的疏漏。
#
# 诚实边界（★ 逐条读；写报告时不许摘要掉）
#   HB1  G24 只证明两侧**声明的**工具面一致；**不证明**行为/语义一致（行为一致性属 M4/M5
#        的实测）。
#   HB2  manifest 的 sourceSha256 只证明「该清单出自该实现文件的当前版本」；**不证明**
#        该文件真的实现了清单内容（那需要 M3.2/M3.3 的自证，另议）。
#   HB3  契约里 carrier_specific / c3_participation: excluded 的项越多，C3 的可比性越弱。
#        本契约把每一项逐条列出并计数（见 g24.boundary_counts），由 G24 每次运行时打印。
#   HB4  source_documents 只写**文档路径 + §号，不写行号**（行号是移动靶，本项目已因此
#        连踩两次）。
#   HB5  7 个工具中**只有 cc_query 的参数类型**在文档里逐字给出（docs/05 §2.1）；其余参数
#        类型与**全部**返回字段名在文档中只有散文描述（docs/03 §7.1「返回」列）⇒ 本契约
#        按 docs/05 §2.2 的写法纪律 + 同族先例（shared/model/kgt-tools.yaml 的
#        request/response 体例；docs/09 §3 的 {nodes, edges, truncated, hopsUsed}）**自拟**，
#        并逐项标注 basis 与 authored: true。自拟项一律登记在 conflicts_for_captain /
#        open_questions，交队长裁决；不得当成「文档已规定」。
#   HB6  本文件是**数据**，不是生成器（纪律同 docs/00 裁决 3）：门禁只读它，不在代码里写死
#        任何载体专有词表（词表也住在本文件里）。
#   HB7  比对只覆盖**顶层**返回字段名 + 参数 (name, type, required)；数组项内部的字段名
#        （item_fields）是**参考性声明**，暂不参与 G24 比对（见 open_questions OQ-4）。
#   HB8  本文件按**队长裁定**住在 shared/model/（与 shared/model/kgt-tools.yaml 同族体例）。
#        ★ 代价：它因此会被 G18(contract_gates) 与 G20(ref_gate) 的**目录级**扫描摄入 ⇒
#        交付前必须复跑这两道门禁，逐字 RESULT 行写进 tmp/_m31_report.md（见 CF-9）。
# =============================================================================

