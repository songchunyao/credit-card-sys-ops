        semantics: "对象之间的关联记录（关系类型 + 两端 objectId）"
        item_fields: [relationType, from, to]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（事实子图）"
        authored: true
      - name: observations
        type: array
        semantics: "观测记录（含 CCF recordId 以便溯源，满足硬约束 C5）"
        item_fields: [recordId, metricCode, value, unit, ts]
        c3_participation: compared
        basis: "docs/00-总体设计与裁决记录.md §3.1 C5（事实有据）+ shared/model/info-products.yaml#info_products IP-METRIC / IP-FACT"
        authored: true
    carrier_specific: []
    provenance: "docs/05-编排层设计（Dify）.md §2.1（第 4 行）；docs/03 §7.1"

  cc_trace:
    name: cc_trace
