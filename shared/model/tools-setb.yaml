c3:
  statement_v14: "逐字（docs/00-总体设计与裁决记录.md §3.1 C3）：『**信息可及性对齐**（★ v1.4 重述，原为「工具名逐字相同」）：各组必须能拿到**同一集合的信息产品**（对象拓扑 / 故障因果 / 指标读数 / 原始事实 / 用例查询），**差异只在封装与调用方式**』；同格补充：『「逐字相同」仍严格适用于**同一对照对内部**（如 KG-Q vs ONTO-Q）。机械依据 = shared/model/info-products.yaml，门禁 G8』"
  what_g24_adds: "C3 在**实现级**的执行点：契约级 G8 只比对工具**名列表**（shared/verify/g8_info_parity.py 断言同对 tools 列表逐字相同），不覆盖「同一个工具名之下，两侧的参数名/类型/必填性与返回字段名是否真的逐字相同」。G24 补齐这一段，且数据源必须是**从实现生成的 manifest**（手写清单可伪造，一律不接受）。"
  disambiguation: "★ 本节键名 `c3` 指**硬约束 C3（工具面同一性 / 信息可及性对齐）**，是本契约所服务的约束编号；它与门禁编号（G8/G24）、与 docs/05 §6.4 里那个自称『契约 C3』的**未识别参数不得回落**条目**均无关**。三者同字不同物，禁止互相引用为同一件事（CF-6）。"
  scope_pairs:
    - ["KG-Q", "ONTO-Q"]
    - ["KG-R", "ONTO-R"]
  scope_excluded_arms: ["KG-T", "KG-T-dyn", "KG-T-free", "BASE"]
  scope_excluded_reason: "C3 v1.4 重述后跨组只要求「信息可及性对齐」（由 G8 管）；KG-T 直读结构、没有查询工具，工具面必然不同；BASE 只有 read_facts。"
  what_is_compared: "工具名集合、每个工具的参数 (name, type, required) 三元组、每个工具的**顶层**返回字段名集合；取值/行为/语义**不在**比对范围。"
  what_is_not_compared: "工具返回的**取值**与**语义**（正是被测变量：载体原生查询语言与表达力差异，shared/model/info-products.yaml#excluded_from_parity 已裁决不参与对齐）；服务端口与 URL（由共享注册表的 server_url 承担）。★ FIX-1 更正：旧稿此处还列有『Dify 侧注入的 _unused 占位符』——该占位符**系本项目自造**（并非 Dify 注入），已于 FIX-1 移除，故现无任何需要排除的占位符。"
  upstream_gate: "G8"
  upstream_gate_impl: "shared/verify/g8_info_parity.py"
  division_of_labour: "G8 = 契约级（info-products.yaml 的工具名列表 + 可达路径）；G24 = 实现级（两侧 manifest 的参数/返回面逐字比对）。两者不得互相替代，也不得重复计分：G24 不重复声明工具集来源之外的列表比对。"
  tool_name_set_authority: "★ R-52（2026-10-07）口径：本契约 tools 的键集合（8 个）必须逐字等于 shared/model/info-products.yaml#access 中 **KG-Q / ONTO-Q** 两组的 tools 列表；**KG-R / ONTO-R** 两组必须逐字等于「该集合 − access.<arm>.tools_removed_from_setb」（当前 = 去掉 cc_query，7 个）。三条断言缺一不可（fail-closed）：① Q 两组 == 本契约全集；② R 两组 == 全集 − 各自声明的移除集；③ `tools ∪ tools_removed_from_setb` 恰等于本契约全集。未声明 `tools_removed_from_setb` 时按空集处理 ⇒ ② 会以「R 组 != 全集」失败，不会静默放行。G24 在契约自检里按此三条核对（读的是同一份 info-products.yaml）。"
  # ★ R-52：允许「规则臂」从 Set B 全集中移除的工具**白名单**（声明驱动，门禁不得硬编码工具名 —— HB6）。
  #   语义：只有「查询语言专用」的工具可以被规则臂移除，因为 R 臂的定义就是「不写查询」。
  #   门禁行为：R 臂声明的 tools_removed_from_setb 必须 ⊆ 本键；本键缺失 ⇒ ERROR（fail-closed），
  #   不得回落成「任意移除都放行」。
  rule_arm_removable_tools: [cc_query]
  rule_arm_removable_reason: "★ R-52：R 臂（KG-R/ONTO-R）= 「LLM 不写查询、由确定性组件收敛」⇒ 唯一应当移除的能力是查询语言入口 cc_query。移除它是**结构性强制**（模型物理上拿不到该工具），而不是靠提示词自觉；防的是「R 臂模型自行写查询 ⇒ 静默退化成 KG-Q」。任何**其他**工具的移除都必须先回到本键显式登记 + 一条裁决，否则 G24-10 判 ERROR。"

return_envelope:
  rationale: "契约门禁 C4/C6（docs/05-编排层设计（Dify）.md §6.4）要求**所有**工具返回有界、空结果必须可判、截断必须回传丢弃量 ⇒ 这 4 个字段对 8 个工具**一律适用**，与载体无关，因此抽成公共信封，避免在每个工具里重复声明（也避免两侧各写一套而漂移）。"
  applies_to: "all_tools"
  manifest_rule: "★ G24 口径：manifest 的**每一条** tools[] 项的 returns 必须包含下面这 4 个信封字段名（信封对 8 个工具一律适用）；缺任一 ⇒ G24-05 ERROR。契约侧由 G24 自动把这 4 个字段并入**每个**工具的比对面，manifest 侧必须**显式**逐一声明（否则两侧声明面不可比）。"
  fields:
    - name: hint
      type: string
      semantics: "无结果或无法作答时的提示文本（说明可能原因），用于避免模型把空结果误判为正常"
      c3_participation: compared
      basis: "docs/05-编排层设计（Dify）.md §2.2「写失败时的提示：写『无结果时返回 hint 字段说明可能原因』（对应契约门禁 C4）」+ §6.4「空结果误判为正常」行"
      authored: false
    - name: truncated
      type: boolean
      semantics: "本次返回是否发生了截断（行数或字节数任一超限即为 true）"
      c3_participation: compared
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1 cc_query 返回列逐字 {rows, truncated, rowCount}；docs/05 §2.2「最多返回 200 行，超出会被截断」"
      authored: false
    - name: droppedRows
      type: integer
      semantics: "因行上限被丢弃的行数（未截断时 0）"
      c3_participation: compared
      basis: "docs/05-编排层设计（Dify）.md §6.4「载荷爆炸」行（契约 C6：超限截断并回传 droppedRows/droppedBytes）+ §2.2"
      authored: false
    - name: droppedBytes
      type: integer
      semantics: "因字节上限被丢弃的字节数（未截断时 0）"
      c3_participation: compared
      basis: "docs/05-编排层设计（Dify）.md §6.4「载荷爆炸」行（契约 C6）"
      authored: false

bounds:
  row_cap: 200
  byte_cap: 20000
  token_budget: 20000
  # ────────────────────────────────────────────────────────────────────────
  # ★ P1（2026-10-14）：**元数据端点独立字节上限**。
  #   背景（实测）：`cc_guide` 原始载荷 22,920 B > byte_cap 20,000 ⇒ 截断丢掉 11 个条目，
  #   **恰好是全部 `host.*` 指标**（字典序最后）。Agent 因此不知道 Host 承载哪些指标，
  #   无法聚焦主机层，只能退化为逐个对象类型穷举 `cc_facts`（17 类 ≈ 31,938 tokens/趟），
  #   最终撞满 max_iteration（实测 7–10/50 例因预算耗尽返回 500、无最终答案）。
  #   口径：**元数据是「能做聚焦」的前提，体积小、缺了代价极大** ⇒ 与数据面分离预算；
  #   数据面（cc_facts / cc_query / cc_cause / …）维持 byte_cap=20000 的载荷纪律**不变**。
  #   注意：上限只负责「给足空间」；**完整性由门禁断言**（服务返回的目录必须等于图里的实体数）。
  # ────────────────────────────────────────────────────────────────────────
  metadata_byte_cap: 65536
  #: ★ /schema 实测被 ROW_CAP=200 砍掉 57 行 attributes ⇒ 目录不完整；
  #:   与字节上限同理，元数据的完整性优先于行数纪律。
  metadata_row_cap: 600
  metadata_tools: [cc_guide, cc_schema]
  metadata_basis: >-
    ★ P1（2026-10-14）新增。依据：① docs/05 §6.4 的载荷纪律针对的是**数据面**（「载荷爆炸」），
    元数据目录与之不同源；② 参考实现的分层职责是「数据面收口为有界端点、元数据不设严苛上限」；
    ③ 实测证据见上（guide 22,920 B 被截断丢掉全部 host.* 指标 ⇒ Agent 失去聚焦能力 ⇒
    逐对象穷举 17 类）。两侧实现必须以同一常量落地（`byte_cap_for(tool)`），
    并在 `/health` 如实回传 metadataByteCap / metadataTools（可观测、不静默）。
  metadata_completeness_gate: >-
    上限不是完整性保障：另需门禁断言「/guide 返回的 metricCode 集合 == 图中 CC_Metric 全集」
    与「/schema 返回的 objectType 集合 == 图中实际对象类型全集」，任一缺项即 FAIL。
  # ────────────────────────────────────────────────────────────────────────
  # ★ P2c（2026-10-14）：**`cc_cause` 单列字节预算**。
  #   契约本文件 `rankBasis` ⑥ 明写「**并列全部返回**，不合并为单一分数」
  #   —— 候选集必须完整。但 `bounds.byte_cap=20000` 与它**直接冲突**：
  #   `Ledger.cap_bytes()` 是**从列表尾部 pop**，于是实测（`FM-APP-POOL-EXHAUSTED`，
  #   maxHops=4）原始 31,913 B 被砍到 20,000 B ⇒ **丢 9 个候选**；
  #   `FM-APP-ENDPOINT-SLOW` 丢 10 个。**完整候选集是 22 个，此前只返回 13/12 个。**
  #   ★ 更严重的是：`droppedRows` 仍为 0 ⇒ **残缺在账上看不出来**（违反契约 C6
  #   「不得静默截断」），且 KG/ONTO 丢弃量不同（载荷大小不同）⇒ A/B 的候选集差异
  #   被污染成「载荷大小差异」，而非图覆盖或推理差异。
  #   注意：上限只负责「给足空间」；**残缺可见性**由 `droppedCandidates` /
  #   `droppedCandidateCount` / `candidatesTruncated` 三个显式字段保证（两侧同形）。
  # ────────────────────────────────────────────────────────────────────────
  cause_byte_cap: 49152
  cause_basis: >-
    ★ P2c（2026-10-14）新增。取值依据：实测全部 23 个症状码在 maxHops=4 下的
    「截断前原始载荷」最大值为 31,913 B（仅 FM-APP-POOL-EXHAUSTED / FM-APP-ENDPOINT-SLOW
    两例触发截断）⇒ 49152 B = 实测最大值的 1.54 倍，并覆盖「23 个候选全为冗长候选」的
    理论上限。两侧实现必须以同一常量落地（`byte_cap_for(tool)`），并在 Ledger 与
    出口预算**两层**同时生效（只改出口层会让 Ledger 构建期就把候选截掉 —— P1 已踩过）。
  cause_completeness_gate: >-
    上限不是完整性保障：另需门禁断言「同症状码下两侧候选集**逐字相同**」
    与「`droppedCandidateCount` 存在时必为 0 或显式给出缺失名单」，任一不满足即 FAIL。
  # ────────────────────────────────────────────────────────────────────────
  # ★ A″（2026-10-15）：症状码**自身即根因**的情形必须作为候选返回
  #   实测动机（m6 A-05/A-06，四组同时发生）：agent 把「题面描述的故障」当作症状码
  #   传入 `/cause`，而该码在因果图上**没有上游成因**（无 CAUSES / CONDITIONAL_CAUSES
  #   入边 = 因果图源点）⇒ 原实现返回**空候选 + 一句 hint**（约 2.8 KB 空载荷）
  #   ⇒ agent 无判据可用 ⇒ 转为反向工程数据模型（`MATCH (n) RETURN DISTINCT labels(n)`）
  #   ⇒ 15–21 轮、撞顶、Dify 500。50 条用例中 **22 条（44%）** 的期望根因落在源点集内。
  #   工具级核验 23/23、两载体一致：`/cause` 返回 0 候选 ⟺ 无因果入边。
  #   （粗看「入度」会把 RELATES_TO 共现边算进来；按 rankBasis ④ 共现边不参与根因收敛。）
  #   ⇒ 规则：入参症状码中**每个源点**都必须作为 `hops=0` 的候选返回，走与其它候选
  #     **完全相同**的条款求值 / 实例选择 / 焦点回传管线（不得写成特例壳）。
  #   ⇒ 留痕字段（两侧同名同文案，载体中立措辞）：`selfRootCauseCodes` 与
  #     `selfRootCauseBasis`。
  #   ⇒ 两侧必须以**同一判据**计算源点（`code not in upstream`，且 upstream 只装
  #     CAUSES / CONDITIONAL_CAUSES 型边），否则会重新引入候选集分歧。
  cause_self_root_rule: >-
    ★ A″（2026-10-15）新增。入参症状码中，凡在因果图上**没有上游成因**者
    （即不存在以它为终点的 CAUSES / CONDITIONAL_CAUSES 边 = 因果图源点），
    必须作为 `hops=0` 的候选一并返回，并携带与其它候选逐字相同的字段集
    （条款求值、实例选择、焦点证据均同法求值，不得写成特例壳）。依据：源点被观测到
    ⇒ 它自身就是根因，而非「找不到根因」。留痕：`selfRootCauseCodes` /
    `selfRootCauseBasis`（两侧同名同文案、载体中立措辞）。实测依据（m6 A-05/A-06）：
    四组同时出现 `/cause` 0 候选 ⇒ agent 反向工程数据模型 ⇒ 15–21 轮、撞顶、Dify 500；
    50 条用例中 22 条（44%）的期望根因落在源点集内。图论核验：23/23、两载体一致。
  basis: "docs/05-编排层设计（Dify）.md §6.4「载荷爆炸」行：①所有工具返回有界（200 行 / 20000 B）②TOKEN_BUDGET = 20000（contract_audit.py:20 口径，tokens ≈ 字数/3.5）③超限截断并回传 droppedRows/droppedBytes；docs/03 §7.4 实测（run_rules 5,307,133 B ≈ 1,516,323 tokens）"
  violation_behavior: "截断 + 回传 droppedRows/droppedBytes + truncated=true；**不得**静默截断（契约 C6）"

error_codes:
  note: "★ 文档给出的是**行为**，不是码名；下列码名由本契约自拟（authored_name: true），行为逐条给出出处。两侧实现必须使用同名码（这正是 C3 要比的部分）。"
  list:
    - code: INVALID_PARAM
      authored_name: true
      when: "出现未识别/非法的参数名或取值"
      violation_behavior: "显式报错，**不得**静默回落到默认值"
      basis: "docs/05-编排层设计（Dify）.md §6.4「静默回落」行（该行称『契约 C3：未识别参数一律显式报错，不回落』）"
      applies_to: "all_tools"
    - code: FORBIDDEN_TOKEN
      authored_name: true
      when: "cc_query 的 query 命中禁用词表（写操作/外部 IO）"
      violation_behavior: "拒绝执行，返回该码与命中的 token"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G2；docs/04-方案2设计（本体+LLM）.md §7.1 G2"
      applies_to: ["cc_query"]
    - code: QUERY_FORM_REJECTED
      authored_name: true
      when: "cc_query 的 query 不满足起始形式白名单"
      violation_behavior: "拒绝执行，返回该码"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G1；docs/04-方案2设计（本体+LLM）.md §7.1 G1"
      applies_to: ["cc_query"]
    - code: MULTI_STATEMENT_REJECTED
      authored_name: true
      when: "cc_query 的 query 含多于一条语句（KG 侧：分号计数 > 1）"
      violation_behavior: "拒绝执行，返回该码"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G3"
      applies_to: ["cc_query"]
      note: "ONTO 侧无对应编号（SPARQL 侧由形式白名单 + 禁用词覆盖）——见 guards.roles.R-SINGLE-STATEMENT"
    - code: QUERY_TIMEOUT
      authored_name: true
      when: "cc_query 执行超时（4 s）"
      violation_behavior: "中止查询并返回该码；**不得**让 Dify 的 ssrf 超时（5 s）先掐断（否则报错会指向 Dify 而非查询本身）"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.3 修正（权威值 4 s）；docs/04-方案2设计（本体+LLM）.md §7.1 G5"
      applies_to: ["cc_query"]
    - code: EXTERNAL_IO_FORBIDDEN
      authored_name: true
      when: "cc_query 试图读外部资源或跨命名图（KG：apoc.load.* / apoc.import.*；ONTO：SERVICE / GRAPH）"
      violation_behavior: "拒绝执行，返回该码"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G9；docs/04-方案2设计（本体+LLM）.md §7.1 G3 与 G9"
      applies_to: ["cc_query"]
    - code: DEPTH_LIMIT_EXCEEDED
      authored_name: true
      when: "因果链枚举深度超过 4"
      violation_behavior: "拒绝或按上界截断（两侧必须同选一种；本契约要求**拒绝**，因为截断会让两侧结果不可比）"
      basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G8 与 §7.1 cc_cause maxHops ≤ 4；docs/04-方案2设计（本体+LLM）.md §7.1 G8"
      applies_to: ["cc_query", "cc_cause"]
    - code: DRY_RUN_ONLY
      authored_name: true
      when: "cc_propose 被要求执行真实变更"
      violation_behavior: "拒绝执行，返回 executed=false / dry_run=true"
      basis: "docs/00-总体设计与裁决记录.md §3.1 与 §7.1（所有动作 executed=false、dry_run=true）；docs/03-方案1设计（知识图谱+LLM）.md §7.1 cc_propose 强制 dry_run"
      applies_to: ["cc_propose"]

tools:
  cc_guide:
    name: cc_guide
    method: post
    path: /guide
    description: "列出本环境可用的指标目录、对象类型与规则清单，用于规划后续调用（不含实例数据）。最多返回 200 行，超出会被截断并回传 droppedRows。无结果时返回 hint 字段说明可能原因。取值一律使用响应条目中的 nativeRef（原样照抄），不要凭名称经验猜测或改写；返回 0 行或 hint 指出作用域/名称不符时，不得据此断言对象不存在。"
    description_basis: "docs/05-编排层设计（Dify）.md §2.2 写法纪律（说做什么不说怎么做 / 写边界 / 写失败提示）；边界句与失败提示句逐字取自该节。★ 文档**未**逐字给出本工具的 description 文本（它引用的 tools_registry_onto.json 不在本工作区）"
    description_authored: true
    params: []
    params_basis: "docs/05-编排层设计（Dify）.md §2.1 逐字：properties = {}、required = []"
    # ★ FIX-1（2026-10-07）：此处原有 `dify_placeholder` 块（name=_unused / type=string /
    #   description=本工具无需参数，请传空字符串 / c3_participation=excluded），由
    #   register_tools.py 在提交给 Dify 的 OpenAPI 里注入为一个 property。该占位符**是本项目自造**，
    #   并非 Dify 的硬约束；真零参合法（现网已有 6 例，parameters==[]）。保留它会让模型按声明传
    #   _unused，而两载体 body 模型 extra=forbid ⇒ 必然 HTTP 400。FIX-1 已移除该机制，
    #   注册面为 properties={} / required=[]。历史块原文见 shared/deploy/dify/README.md 的 ★ FIX-1 更新节。
    returns:
      - name: metrics
        type: array
        semantics: "可用指标目录（指标码 + 单位 + 所属对象类型）"
        item_fields: [metricCode, unit, objectType]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（可用指标目录、对象类型、规则清单）"
        authored: true
      - name: objectTypes
        type: array
        semantics: "可查询的对象类型清单"
        item_fields: [objectType, layer, keyAttrs]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列"
        authored: true
      - name: rules
        type: array
        semantics: "可用规则/判据清单（只给清单，不给数据）"
        item_fields: [ruleCode, description]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列"
        authored: true
    error_codes: [INVALID_PARAM]
    carrier_specific: []
    provenance: "docs/05-编排层设计（Dify）.md §2.1（第 1 行）"

  cc_schema:
    name: cc_schema
    method: post
    path: /schema
    description: "返回本环境的对象类型、关系类型与属性清单（只读，不含数据）。最多返回 200 行，超出会被截断并回传 droppedRows。无结果时返回 hint 字段说明可能原因。取值一律使用响应条目中的 nativeRef（原样照抄），不要凭名称经验猜测或改写；返回 0 行或 hint 指出作用域/名称不符时，不得据此断言对象不存在。"
    description_basis: "docs/05 §2.2 写法纪律；docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（标签/关系/属性清单，只读，不含数据）"
    description_authored: true
    params: []
    params_basis: "docs/05-编排层设计（Dify）.md §2.1 逐字：properties = {}、required = []"
    # ★ FIX-1（2026-10-07）：此处原有 `dify_placeholder` 块（name=_unused / type=string /
    #   description=本工具无需参数，请传空字符串 / c3_participation=excluded /
    #   excluded_reason=同 cc_guide：共享注册表注入的同一占位符），已移除。
    #   理由同 cc_guide：占位符系本项目自造，真零参合法（现网 6 例），保留它必然 400。
    #   注册面为 properties={} / required=[]。历史块原文见 README.md 的 ★ FIX-1 更新节。
    returns:
      - name: objectTypes
        type: array
        semantics: "对象类型（节点类型）名清单"
        item_fields: [objectType, keyAttrs]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（标签清单）"
        authored: true
      - name: relationTypes
        type: array
        semantics: "关系（边）类型名清单"
        item_fields: [relationType, from, to, cardinality]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（关系清单）"
        authored: true
      - name: attributes
        type: array
        semantics: "属性名清单（含所属类型与类型）"
        item_fields: [owner, attribute, valueType]
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1「返回」列（属性清单）"
        authored: true
      - name: naming_discipline
        type: string
        semantics: "★ 供队长裁决用：本契约**故意不使用**载体词汇作字段名（不叫 labels / relations / properties），因为字段名会随工具返回进模型上下文，而 docs/05 §1.3 F1 与 §5.2 禁止载体词汇泄漏（『图』『本体』等）。文档 §7.1 用「标签/关系/属性」描述返回物**内容**，本契约取载体中性名（objectTypes / relationTypes / attributes）"
        c3_participation: compared
        basis: "docs/05-编排层设计（Dify）.md §1.3 F1 与 §5.2 禁用词表；docs/03-方案1设计（知识图谱+LLM）.md §7.1"
        authored: true
        see_also: "conflicts_for_captain CF-4"
    error_codes: [INVALID_PARAM]
    carrier_specific: []
    provenance: "docs/05-编排层设计（Dify）.md §2.1（第 2 行）"

  cc_query:
    name: cc_query
    method: post
    path: /query
    description: "提交一个只读知识查询，返回匹配的对象与属性。最多返回 200 行，超出会被截断并回传 droppedRows。无结果时返回 hint 字段说明可能原因。返回 0 行或 hint 指出作用域/名称不符时，不得据此断言对象不存在。"
    description_basis: "docs/05-编排层设计（Dify）.md §2.2 逐字给出该描述的首句（『提交一个只读知识查询，返回匹配的对象与属性』）与另两句纪律句；★ 描述文本**不得**泄漏接收的语法族（不写 Cypher / SPARQL）"
    description_authored: false
    params:
      - name: query
        type: string
        required: true
        constraints: "只读查询语句；受 guards 约束（起始形式白名单 + 禁用词 + 单语句 + 深度 ≤ 4 + 不得外部 IO + 强制 LIMIT 注入）"
        description: "只读知识查询语句"
        c3_participation: compared
        basis: "docs/05-编排层设计（Dify）.md §2.1 逐字：{\"query\": {\"type\":\"string\", \"description\":\"只读知识查询语句\"}}、required = [\"query\"]；§2.1 后注：入参名必须是 query，**不能**叫 cypher（方案1）或 sparql（方案2）"
        authored: false
        carrier_specific_value_semantics:
          kg: "Cypher 只读查询串"
          onto: "SPARQL 只读查询串"
          invariant: "★ 参数**名**与**类型**两侧逐字相同（query: string）；差异只在被接受的**语法族**。依据 shared/model/info-products.yaml#excluded_from_parity（载体原生查询语言正是被测变量，要求它对齐等于取消实验）"
    guards:
      model: "KG 侧与 ONTO 侧共用 11 个**角色**（护栏要达到的性质），但两侧的**词表与编号不同**（docs/03 §7.2 的 G3/G4/G9 与 docs/04 §7.1 的 G3/G4/G9 语义互不相等）⇒ 本契约按**角色**对齐，不按 G 编号对齐。这是 CF-2。★ 队长裁定（CF-2 批准按角色对齐）：『两侧守卫按**角色**对齐；编号 G3/G4/G9 在不同载体上语义不等价，**禁止跨载体直接比编号**』—— 任何门禁、报告或评审都不得用「两侧 G 编号相同」当作 C3 成立的证据；跨载体可比的只有本节的 `invariant` 与 `violation_behavior` 两栏。"
      role_alignment: "same_roles_different_numbering"
      roles:
        R-READONLY-FORM:
          invariant: "语句的**起始形式**必须落在白名单内（白名单是唯一防线，黑名单只作补充）"
          kg:
            source_g: G1
            whitelist: ["MATCH", "OPTIONAL MATCH", "WITH", "UNWIND", "RETURN"]
          onto:
            source_g: G1
            whitelist: ["SELECT", "ASK", "CONSTRUCT", "DESCRIBE"]
          violation_behavior: "拒绝执行（QUERY_FORM_REJECTED）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G1；docs/04-方案2设计（本体+LLM）.md §7.1 G1"
        R-READONLY-TOKENS:
          invariant: "写操作 token 一律拒绝（含子查询/嵌套内的写操作）"
          kg:
            source_g: G2
            forbidden_regex: "\\b(CREATE|MERGE|DELETE|DETACH|SET|REMOVE|DROP|CALL\\s+apoc\\.(create|merge|delete|refactor|periodic)|LOAD\\s+CSV|FOREACH)\\b"
            regex_flags: ignorecase
            note: "★ 逐字取自 docs/03-方案1设计（知识图谱+LLM）.md §7.2 的源码级 FORBIDDEN 正则"
          onto:
            source_g: G2
            forbidden_tokens: ["INSERT", "DELETE", "LOAD", "CLEAR", "DROP", "CREATE", "WITH", "MOVE", "COPY", "ADD"]
          violation_behavior: "命中即拒（FORBIDDEN_TOKEN）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G2；docs/04-方案2设计（本体+LLM）.md §7.1 G2"
        R-SINGLE-STATEMENT:
          invariant: "一次调用只执行一条语句"
          kg:
            source_g: G3
            rule: "分号计数 ≤ 1"
          onto:
            source_g: null
            rule: "SPARQL 侧无对应条目（由 R-READONLY-FORM 与 R-READONLY-TOKENS 覆盖）；★ 两侧行为上等价：多语句请求必须被拒绝"
          violation_behavior: "拒绝执行（MULTI_STATEMENT_REJECTED）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G3"
        R-TIMEOUT:
          invariant: "服务端查询超时必须**小于** Dify ssrf 的 5 s，否则外层先掐断、报错指向 Dify 而非查询本身"
          kg:
            source_g: G4
            timeout_s: 4
            supersedes: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 表内写的 8 s 已被 §7.3 正文修正 ⇒ **权威值 4 s**"
            captain_ruling: 4
            captain_ruling_note: "★ CF-1 已由队长裁定 = **4 s**（本行即裁定值，kg/onto 两侧一致）。依据：docs/03-方案1设计（知识图谱+LLM）.md §7.3 修正块『修正：G4 定 4s』、docs/04-方案2设计（本体+LLM）.md §7.1 G5、docs/05-编排层设计（Dify）.md §3.3、docs/08-报告模板与结论骨架.md §4。**冲突记录保留**：docs/03-方案1设计（知识图谱+LLM）.md §7.2 表格单元格写的 8 s 是**未同步的陈旧单元格**（同节修正块已改为 4 s），docs/00-总体设计与裁决记录.md §风险 R17 的『G4（8s 超时）』同属陈旧，三处已列入队长的文档回写清单 ⇒ 属**文档缺陷**，非护栏分歧。上游历史锚点（他人实现的查询服务里 timeout=8 的读数 —— 该仓库外路径已在 CF-8 处引用过一处，此处**不再重复引用**以免给 G20 添第二条同类 ⑦ 告警）是既有实现的读数，**不是本契约的护栏值**，保留原样不构成反例。"
          onto:
            source_g: G5
            timeout_s: 4
          violation_behavior: "中止并返回 QUERY_TIMEOUT"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.3 修正；docs/04-方案2设计（本体+LLM）.md §7.1 G5；Dify 侧 SSRF_DEFAULT_READ_TIME_OUT=5"
        R-ROW-CAP:
          invariant: "返回行数上限 200"
          kg: {source_g: G5, rows: 200}
          onto: {source_g: G6, rows: 200}
          violation_behavior: "截断 + truncated=true + droppedRows"
          basis: "docs/05-编排层设计（Dify）.md §6.4；docs/03 §7.2 G5；docs/04 §7.1 G6"
        R-BYTE-CAP:
          invariant: "返回字节上限 20000"
          kg: {source_g: G6, bytes: 20000}
          onto: {source_g: G6, bytes: 20000}
          violation_behavior: "截断 + truncated=true + droppedBytes"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.4；docs/04-方案2设计（本体+LLM）.md §7.1 G6"
        R-FORCE-LIMIT:
          invariant: "无 LIMIT 且无聚合时，服务端必须自动包一层 LIMIT（等效动作；语种各自实现）"
          kg: {source_g: G7}
          onto: {source_g: G7}
          violation_behavior: "自动注入（**不是**拒绝）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G7；docs/04-方案2设计（本体+LLM）.md §7.1 G7"
        R-DEPTH-CAP:
          invariant: "因果链枚举深度 ≤ 4"
          kg:
            source_g: G8
            rule: "沿 CAUSES 的枚举深度 ≤ 4"
          onto:
            source_g: G8
            rule: "因果路径深度 ≤ 4"
          violation_behavior: "拒绝（DEPTH_LIMIT_EXCEEDED；★ 不用截断——截断会让两侧结果不可比）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G8；docs/04-方案2设计（本体+LLM）.md §7.1 G8"
        R-BOUNDED-PATH:
          invariant: "禁止**无上界**的路径枚举（成环图会爆炸）"
          kg:
            source_g: "G2 / G8 的合成效果"
            forbidden: ["变长路径 `*` / `*..` 等无上界形式", "MATCH p=(a)-[:CAUSES*1..n]->(b) 形态的任意枚举"]
            precedent: "shared/model/kgt-tools.yaml 的 get_fault_topology.algorithm.forbidden_implementations（同类护栏的体例先例）"
          onto:
            source_g: G4
            forbidden: ["属性路径的 `*` 与 `+`（无上界）"]
            allowed: ["`{n}`", "`{n,m}` 定界形式"]
            asymmetry_note: "★ 逐字（docs/04 §7.1 表下注）：『G4 是与方案1 最不对称的一条护栏』——SPARQL 的属性路径语法更隐蔽（可写在谓词位置），必须写进 R4 不对称风险的实测证据"
          violation_behavior: "拒绝执行"
          basis: "docs/04-方案2设计（本体+LLM）.md §7.1 G4 与其表下注；docs/03-方案1设计（知识图谱+LLM）.md §7.2 G2/G8"
        R-NO-EXTERNAL-IO:
          invariant: "禁止读外部资源、禁止跨命名图逃逸（同一角色的两种载体表现）"
          kg:
            source_g: G9
            forbidden: ["apoc.load.*", "apoc.import.*"]
          onto:
            source_g: "G3 / G9"
            forbidden: ["SERVICE", "GRAPH（跨命名图访问，除显式白名单）"]
          violation_behavior: "拒绝执行（EXTERNAL_IO_FORBIDDEN）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G9；docs/04-方案2设计（本体+LLM）.md §7.1 G3、G9"
        R-AUDIT:
          invariant: "每次调用记录 queryText / elapsedMs / rowCount（硬约束 C5 事实有据的前提）"
          kg: {source_g: G10}
          onto: {source_g: G10}
          violation_behavior: "缺失即视为实现缺陷（G24 不检查审计写入位置，只冻结字段名；写入位置见 OQ-3）"
          basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.2 G10；docs/04-方案2设计（本体+LLM）.md §7.1 G10；docs/00-总体设计与裁决记录.md §3.1 C5"
    carrier_specific:
      - aspect: "query 参数接受的语法族"
        kg: "Cypher 子集（起始形式白名单 MATCH/OPTIONAL MATCH/WITH/UNWIND/RETURN）"
        onto: "SPARQL 子集（起始形式白名单 SELECT/ASK/CONSTRUCT/DESCRIBE）"
        invariant: "参数名 `query`、类型 string、必填性 true 两侧逐字相同；被接受的语言族不同"
        c3_participation: excluded
        excluded_reason: "载体原生查询语言正是被测变量（线 1：KG-Q vs ONTO-Q）；要求它对齐等于取消实验。依据 shared/model/info-products.yaml#excluded_from_parity 的既有裁决"
    returns:
      - name: rows
        type: array
        semantics: "匹配到的记录集合（每项是键值对映射；键名与取值由被查询环境决定，**不在**本契约比对范围）"
        item_fields: []
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1 cc_query 返回列逐字 {rows, truncated, rowCount}"
        authored: false
      - name: rowCount
        type: integer
        semantics: "本次返回的行数（截断前/后以 truncated 与 droppedRows 说明）"
        c3_participation: compared
        basis: "docs/03-方案1设计（知识图谱+LLM）.md §7.1 逐字"
        authored: false
    error_codes: [INVALID_PARAM, FORBIDDEN_TOKEN, QUERY_FORM_REJECTED, MULTI_STATEMENT_REJECTED, QUERY_TIMEOUT, EXTERNAL_IO_FORBIDDEN, DEPTH_LIMIT_EXCEEDED]
    provenance: "docs/05-编排层设计（Dify）.md §2.1（第 3 行）；docs/03 §7.1/§7.2/§7.3；docs/04 §7.1"

  cc_facts:
    name: cc_facts
