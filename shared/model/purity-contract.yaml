# ============================================================================
# shared/model/purity-contract.yaml
#   两实现纯粹性契约（P1–P6）· 门禁 G25 的**唯一权威**
#
#   用户原则（逐字，m11121）：
#     「需要，另外我给一个处理原则，我这个项目就是要验证基于图库（neo4j）和本体
#      （graphDB）做运维智能体的效果差异，所以本身就是故意保留两种实现，而且你
#      需要保证两种实现的纯粹性。」
#   ⇒ 两实现**故意并存**（载体本身是被测自变量），但「纯粹性」必须被机检：
#     任一实现都不得靠借用对侧载体的机制/结果把差异做小或做假。
#
#   裁决登记：docs/00-总体设计与裁决记录.md §8 裁决 15
#   门禁登记：docs/07-实施计划与验收.md §7 G25
#
#   ★ 本文件不列自身滚动 sha256（标记用、不得 pin）。
#   ★ 本契约是**声明驱动**的：门禁不硬编码任何载体名/端口/文件清单；
#     契约缺字段或引用不上 ⇒ 门禁 BLOCKED（退出码 2），不得静默 PASS。
# ============================================================================

meta:
  id: purity-contract
  version: "1.0"
  title: 两实现纯粹性契约（P1 依赖面 / P2 运行期端点面 / P3 语义面 / P4 词表面 / P5 共享面中性 / P6 测量面）
  decision_ref: docs/00-总体设计与裁决记录.md §8 裁决 15
  gate_ref: docs/07-实施计划与验收.md §7 G25
  user_principle_msg: m11121
  self_sha256_policy: 本文档不列自身滚动 sha256，标记用、不得 pin
  # 两侧载体（被测自变量）与其臂
  carriers:
    kg:
      name: Neo4j
      paradigm: LPG（属性图）
      arms: [KG-Q, KG-R, KG-T, KG-T-free, KG-T-dyn]
      endpoints: ["127.0.0.1:7475", "127.0.0.1:7688"]
      reasoning_surface: LPG 约束/索引 + Cypher 断言
    onto:
      name: GraphDB
      paradigm: RDF / OWL 2
      arms: [ONTO-Q, ONTO-R]
      endpoints: ["127.0.0.1:7200"]
      reasoning_surface: OWL 2 RL 闭包（ruleset owl2-rl，仓库 cc-ops）
  # 方案3（KG-T / KG-T-free）同属 **KG 载体**，一并受 P1–P6 约束
  scheme3_note: KG-T（:8303 门面）与 KG-T-free（插件直连）同属 KG 载体，不得为提升准确率引入本体验证
  # 自指豁免：契约与门禁本身必须同时说出两侧载体名才能完成声明/检查
  self_excluded:
    - {path: shared/model/purity-contract.yaml, class: declaration, reason: 本契约必须同时声明两侧载体名与端点才能做互斥判定（自指）}
    - {path: shared/verify/purity_gate.py, class: declaration, reason: 本门禁必须同时打印两侧载体名与端点才能做互斥判定（自指）}

# ---------------------------------------------------------------------------
# 词汇表：被判为「对侧载体独有」的 token
# ---------------------------------------------------------------------------
vocab:
  onto_forbidden_in_kg:
    - '\bgraphdb\b'
    - '\bontotext\b'
    - '\bsparql\b'
    - '\brdf4j\b'
    - '\brdflib\b'
    - '\bjena\b'
    - '\brdf\b|\brdfs\b|\bowl\b'
    - '\bshacl\b'
    - '\bturtle\b'
    - '\bttl\b'
    - '\b(repository|repositories)\b'
    - '\binfer=true\b'
    - '\bntriples\b'
    - '\btrig\b'
    - '推理机|reasoner'
    - ':7200\b'
  kg_forbidden_in_onto:
    - '\bneo4j\b'
    - '\b7475\b'
    - '\b7688\b'
    - '\bbolt\b'
    - '\bcypher\b'
    - '\bcypher-shell\b'
    - '\blpg\b'
    - '\bneo4j_query\b'
    - '\bapoc\b'
    - '属性图|property\s+graph'
  carrier_tokens:
    - '\bneo4j\b'
    - '\bgraphdb\b'
    - '\bcypher\b'
    - '\bsparql\b'
    - '\brdf\b|\brdfs\b|\bowl\b'
    - '\bshacl\b'
    - '\bturtle\b'
    - '\blpg\b'
    - '\bbolt\b'
    - '\b7475\b'
    - '\b7688\b'
    - ':7200\b'
    - '知识图谱|本体|三元组|属性图|property\s+graph'
  materialization_markers:
    - '\binfer=true\b'
    - '\bhasInferred\b|\binferredTypes\b|\bmaterializedAt\b'
    - '\bclosur(e|ed)\s+expansion\b'

# ---------------------------------------------------------------------------
# 分类器：把「命中」分成 中性(comment/scanner/doc_ref/docstring/prose/fixture/declaration)
#         与 污染(code)。注释里提到对侧载体不算污染；**代码头里提到就是污染**。
# ---------------------------------------------------------------------------
classify:
  scan_exts: [".py", ".yaml", ".yml", ".sh", ".json", ".jsonl", ".ttl", ".cypher", ".txt", ".conf"]
  prose_exts: [".md"]
  code_only_exts: [".py"]
  triple_quote_exts: [".py"]
  comment_leaders:
    ".py": ["#"]
    ".sh": ["#"]
    ".conf": ["#"]
    ".yaml": ["#"]
    ".yml": ["#"]
    ".jsonl": ["#"]
    ".ttl": ["#"]
    ".txt": ["#"]
    ".cypher": ["//"]
    ".json": []
    ".md": []
  allowed_classes: [comment, scanner, doc_ref, docstring, prose, fixture, declaration]
  # 扫描器本体：两侧各自的「禁用词扫描器」必须提到对侧词汇，属合法中性
  scanner_patterns:
    - '\(cypher\|sparql'
    - 'banned\s*=\s*re\.compile'
    - 'neo4j\|graphdb'
    - 'graphdb\|turtle'
    - 'cypher\|sparql\|rdf\|owl'
    - 'docs05_banned_regex'
  doc_ref_patterns:
    - 'docs[/\\]'
    - '见 docs'
    - '蓝本'
  declaration_patterns:
    - '对账'
    - '同口径|口径'
    - '登记'
    - '禁用词|排除清单'

# ---------------------------------------------------------------------------
# 豁免（allowlist）：每条必须带 class + reason，且必须在盘上**仍然复现**
#   条目字段（P1 行级）：face/scan/path/line/token/class/max_hits/reason
#   条目字段（P5 路径级）：face/scan/path/class/max_hits/reason（line 省略或 0）
#   反漏洞纪律：① 未登记命中 ⇒ FAIL；② 某条豁免在盘上不复现（count==0）⇒ FAIL
