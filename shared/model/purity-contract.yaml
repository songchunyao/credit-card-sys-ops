# ---------------------------------------------------------------------------
# 六个面
# ---------------------------------------------------------------------------
faces:

  P1:
    id: dependency
    name: 依赖面（两实现不得运行期依赖对侧载体栈）
    tier: static
    scans:
      - id: kg_no_onto_stack
        root: scheme1-kg
        pattern_set: onto_forbidden_in_kg
      - id: onto_no_kg_stack
        root: scheme2-onto
        pattern_set: kg_forbidden_in_onto

  P2:
    id: runtime-endpoint
    name: 运行期端点面（配置/环境变量名集合互斥；进程只拨本载体端口）
    tier: static+runtime-evidence
    env_exclusivity:
      - file: scheme1-kg/service/cc_tools.py
        must_contain: [CC_NEO4J_HTTP_URL, CC_NEO4J_USER, CC_NEO4J_PASSWORD, CC_NEO4J_DATABASE]
        must_not_contain_in_code: [CC_GRAPHDB_]
      - file: scheme2-onto/service/cc_tools_onto.py
        must_contain: [DEFAULT_GRAPHDB_URL, DEFAULT_REPOSITORY]
        must_not_contain_in_code: [CC_NEO4J_]
    endpoint_constants:
      - file: scheme1-kg/service/cc_tools.py
        expect: ["127.0.0.1:7475"]
        forbid: ["7200", "7688", "/repositories/"]
      - file: scheme2-onto/service/cc_tools_onto.py
        expect: ["http://127.0.0.1:7200", "cc-ops"]
        forbid: ["7475", "7688"]
    evidence:
      collected_at: "2026-09-29T19:43:20Z"
      collector: 真机 192.0.2.10 只读采样：ss -tnp 每 0.25s × 80，期间打一次只读 POST /schema（BT.8：ONTO 载体只读守卫「语句层分号」修复后忠实重启，`:8302` pid 变更 ⇒ 按新 pid 重采；B 脚本的观测窗口在 POST **之前**）
      files:
        - tmp/w28_p2_bt8_a.out.txt
        - tmp/w28_p2_bt8_b.out.txt
      max_age_days: 30
      expectations:
        - {pid: 1926537, arm: KG-Q, own_port: 7475, min_own: 1, forbid_ports: [7200, 7688]}
        - {pid: 2244231, arm: ONTO-Q, own_port: 7200, min_own: 1, forbid_ports: [7475, 7688]}
        - {pid: 1926657, arm: KG-T, own_port: 7688, min_own: 1, forbid_ports: [7200, 7475]}
      note: >-
        ONTO-Q(2244231) 必须**冷缓存**观测：cc_tools_onto.py 的 TYPE_CACHE_TTL_S=60.0 会使
        60s 内的重复 /schema 完全不产生新拨号（这是仪表特性，不是缺陷，已在采集脚本里 sleep 70 越过）。
        本面是**重放校验**：门禁自身不拨号、不连真机；证据文件过期或缺失即 BLOCKED。窗口顺序为 B 档实测修正：A 档 ONTO 腿 to_7200=0（热缓存，预期），B 档 to_7200=1（冷缓存 POST 落在窗口内）。

  P3:
    id: semantics
    name: 语义面（声明↔实现对账：OWL 原生公理必须落在 .ttl；LPG 断言必须落在 .cypher）
    tier: static
    onto_construct_roots: [scheme2-onto/ontology, scheme2-onto/shapes]
    onto_construct_exts: [".ttl"]
    onto_construct_regex:
      hasKey: 'owl:hasKey'
      AllDifferent: 'owl:AllDifferent'
      inverseOf: 'owl:inverseOf'
      unionOf: 'owl:unionOf'
      Ontology: 'owl:Ontology'
      imports: 'owl:imports'
      TransitiveProperty: 'owl:TransitiveProperty'
      FunctionalProperty: 'owl:FunctionalProperty'
      disjointWith: 'owl:disjointWith'
      cardinality: 'owl:cardinality'
      propertyChainAxiom: 'owl:propertyChainAxiom'
      Restriction: 'owl:Restriction'
    onto_min_construct_counts:
      hasKey: 26
      AllDifferent: 12
      inverseOf: 20
      unionOf: 18
      Ontology: 7
      imports: 6
      TransitiveProperty: 2
      FunctionalProperty: 5
      disjointWith: 7
      cardinality: 8
      propertyChainAxiom: 2
      Restriction: 3
    onto_axioms:
      - id: A1
        statement: 动作动作码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-action.ttl, line: 221, pattern: "owl:hasKey ( cca:actionCode )"}
      - id: A2
        statement: 动作提案码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-action.ttl, line: 222, pattern: "owl:hasKey ( cca:proposalCode )"}
      - id: A3
        statement: 风险三档两两不同（OWL AllDifferent）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-action.ttl, line: 128, pattern: "owl:AllDifferent"}
      - id: A4
        statement: 规则码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-audit.ttl, line: 186, pattern: "owl:hasKey ( ccp:ruleCode )"}
      - id: A5
        statement: 22 条因果边两两不同（OWL 原生公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-causal.ttl, line: 377, pattern: "OWL 原生公理"}
      - id: A6
        statement: 18 个故障模式互斥（OWL 原生公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-fault.ttl, line: 457, pattern: "OWL 原生公理"}
      - id: A7
        statement: 故障模式码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-fault.ttl, line: 780, pattern: "owl:hasKey ( ccf:faultModeCode )"}
      - id: A8
        statement: 指标码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-metric.ttl, line: 710, pattern: "owl:hasKey ( ccm:metricCode )"}
      - id: A9
        statement: 应用码唯一（OWL 2 键公理）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-topology.ttl, line: 53, pattern: "owl:hasKey ( cc:appCode )"}
      - id: A10
        statement: Table 身份 = (schemaName, tableName)（OWL 2 键公理，与裁决 14 同源）
        ttl_refs:
          - {file: scheme2-onto/ontology/cc-topology.ttl, line: 184, pattern: "owl:hasKey ( cc:schemaName cc:tableName )"}
    kg_construct_roots: [scheme1-kg/ontology]
    kg_construct_exts: [".cypher"]
    kg_construct_regex:
      create_constraint: 'CREATE\s+CONSTRAINT'
      create_index: 'CREATE\s+INDEX'
      rule_body_note: '规则体'
    # 下限 = 交付时的**出现次数**实测值（含 01-schema.cypher:12/:13 两条命名纪律注释里
    # 出现的字样：CREATE CONSTRAINT 共 21 处 = 20 条真实约束 + 1 处注释；
    # CREATE INDEX 共 7 处 = 6 条真实索引 + 1 处注释）。只作「只许增不许减」的下限漂移探测，
    # 不冒充「约束条数」这一业务口径。
    kg_min_construct_counts:
      create_constraint: 21
      create_index: 7
      rule_body_note: 6
    kg_rules:
      - id: K1
        statement: 命名空间前缀 CC_ 下的唯一性约束（CREATE CONSTRAINT 20 条，LPG DDL 表达）
        cypher_refs:
          - {file: scheme1-kg/ontology/01-schema.cypher, line: 36, pattern: "CREATE CONSTRAINT"}
      - id: K2
        statement: 支撑查询的 LPG 索引（CREATE INDEX 6 条，Cypher DDL 表达）
        cypher_refs:
          - {file: scheme1-kg/ontology/01-schema.cypher, line: 83, pattern: "CREATE INDEX"}
      - id: K3
        statement: 6 条业务规则**无规则体**（docs/03 未给 ⇒ 未自创，诚实边界）
        cypher_refs:
          - {file: scheme1-kg/ontology/04-rules.cypher, line: 175, pattern: "规则体"}
    purity_of_shape_files:
      - {file: scheme2-onto/shapes/shacl-constraints.ttl, forbid: ["owl:"], max_owl_constructs: 0}
    note: >-
      判据 = 「声明↔实现」对账（不是「有没有 .ttl」）：每一条被声明为 OWL 原生公理的条目
      必须给出 .ttl 出处（存在、落在 ontology/shapes 下、行内 pattern 命中）；
      方案1 的每一条规则条目必须给出 .cypher 出处。两侧构造计数设**下限**：只许增不许减。

  P4:
    id: vocabulary
    name: 词表面（复用既有禁用词闸，断言其仍存在且仍有拦截力）
    tier: reuse-existing-gates
    power_source:
      file: shared/model/kgt-prompt-variants.yaml
      pointer: gate
      regex_key: docs05_banned_regex
    mechanisms:
      - file: shared/model/kgt-prompt-variants.yaml
        consumer: shared/verify/f5_kgt_gate.py
      - file: scheme1-kg/tests/test_cc_tools.py
        must_contain: ["banned = re.compile", "graphdb"]
      - file: scheme2-onto/service/cc_tools_onto.py
        must_contain: ["cypher|sparql|rdf|owl", "neo4j|graphdb"]
    blocking_power:
