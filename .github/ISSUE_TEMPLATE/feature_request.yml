name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please describe the problem first and the
        proposed mechanism second — that makes it much easier to judge whether
        the change fits the project's design.

        Two properties of this project are deliberate and are usually the reason
        a request is declined or reshaped:

        - **Offline-first.** A bare checkout must stay runnable with no database,
          no cluster, and no credentials. Anything that can only be exercised
          against a live system needs a separate, explicitly online path.
        - **Fail-closed, tri-state results.** `0` = `PASS`, `1` = `FAIL`,
          `2` = `BLOCKED`, with `BLOCKED` taking precedence. A missing asset is
          "not measured", never a pass.

        Do not include credentials, real hostnames or node names, internal IP
        addresses, or snapshots from a real environment in this request.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project should this affect?
      options:
        - Offline gates / gate runner
        - Gate registry or a machine-readable contract
        - Scheme 1 — knowledge graph / Neo4j
        - Scheme 2 — ontology / SHACL / GraphDB
        - Knowledge services and tool faces
        - Deployment, compose files or images
        - Data collection layer
        - Offline checks, self-test or test suite
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or limitation, not the implementation. What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen, and roughly how you would expect it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you rejected them. Include workarounds you already tried.

  - type: dropdown
    id: requirements
    attributes:
      label: What would this need to run?
      description: This decides whether the change can be part of the default offline path.
      options:
        - Offline only — no database, no cluster, no credentials
        - Needs a live Neo4j, GraphDB, or Dify instance
        - Needs a component that is not part of this repository
        - Not sure
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: How could this be verified?
      description: Which offline check, self-test, or gate should cover it? How would a reviewer see it pass — and see it fail when it should?
      placeholder: |
        e.g. a new offline gate registered in the gate registry, exercised by
        `python shared/verify/gate_runner.py --offline --allow-partial`, plus a
        negative case that must report FAIL or BLOCKED.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find this request already
          required: true
        - label: I removed credentials, internal hostnames or addresses, and machine-specific paths from this request
          required: true
