# Issue-template chooser configuration (GitHub form schema).
#
# Blank issues are disabled so that every report arrives with the fields the
# offline checks need to be reproducible: the area affected, the version or
# commit, the exact command, and the exit code.
#
# Published location: https://github.com/songchunyao/credit-card-sys-ops .
# The template chooser requires an absolute URL, so relative paths do not work here.
blank_issues_enabled: false
contact_links:
  - name: Security vulnerability — report privately, do not open a public issue
    url: https://github.com/songchunyao/credit-card-sys-ops/security/policy
    about: >-
      Suspected vulnerabilities must be reported privately, as described in
      SECURITY.md (GitHub private vulnerability reporting). Never include
      credentials, internal hostnames or addresses, or snapshots of a real
      environment in a public issue.
  - name: How to contribute
    url: https://github.com/songchunyao/credit-card-sys-ops/blob/HEAD/CONTRIBUTING.md
    about: >-
      Development setup, the offline checks a change is expected to pass, and
      the branch, commit and pull-request conventions.
