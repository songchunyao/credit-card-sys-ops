# =============================================================================
# 本仓库的 GitHub Actions 流水线 —— **只包含"离线可自足"的那一档检查**
#
# 上游：完整工作区的流水线（未随本仓分发）。其中的 `online` 档（真机图数据库 /
#       编排控制台 / 硬件 SSH）与 `release` 档（镜像构建推送、口令式远程部署）
#       **刻意不移植**：它们需要内网主机、私有镜像与凭据，在公开仓库里既跑不起来、
#       也不该出现。
#
# 作业对照（完整工作区 → 本文件）：
#   offline:gates                → offline-registry-gates    （按设计**不阻塞**，见该作业注释）
#   offline:evidence-files       → **未移植**（见下方"未移植"说明）
#   offline:selftests（9 条）     → service-selftests（7 条，阻塞）
#                                 + selftest-drift-advisory（2 条，仅告警）
#   （上游另有第 10 条 `--selftest`：`shared/deploy/dify/deploy_agents.py`
#    ——它属**在线**档：实测无 DIFY_BASE_URL 时 fail-closed 退 1
#    「DIFY ERROR: 缺少环境变量 DIFY_BASE_URL」，故与 online 档一起不移植。）
#   offline:unit-tests           → pytest-offline             （阻塞）
#   offline:release-consistency  → release-consistency        （阻塞）
#
# 全部作业：ubuntu-latest + Python 3.12 + 公共 PyPI + actions/checkout@v4 /
# actions/setup-python@v5；无 Docker、无 secrets、无口令式远程部署、无内网主机、无自托管 runner。
#
# ---- 未移植：offline:evidence-files -----------------------------------------
# 上游脚本 `ci/check_evidence_files.py` 断言两件事（用法：`python ci/check_evidence_files.py
# [--repo-root R]`，**不接受目录位置参数**）：
#   ① `shared/model/gate-registry.yaml` / `purity-contract.yaml` 里**声明为证据**的每个
#      `tmp/` 路径存在，② `shared/deploy/port/tmp-evidence-whitelist.txt` 的每条都存在。
# 本导出树**刻意不含 `tmp/`**（里面是真机采集快照与探针原始输出，含现网拓扑与地址）。
# 实测（导出树根目录，无参数）：
#   $ python ci/check_evidence_files.py
#   ... [白名单指向不存在的文件] tmp/w28_p2_bt8_a.out.txt  ← shared/deploy/port/tmp-evidence-whitelist.txt
#   exit 1，共 370 条"文件不存在"
# 即：该作业在公开树里**必然红**，且红的原因与本树代码无关。与其提交一个对每个使用者都
# 报错的作业，不如不移植 —— 需要它的完整仓把下面三行去掉注释即可：
#   evidence-files:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v7
#       - uses: actions/setup-python@v7
#         with: { python-version: "3.12" }
#       - run: python ci/check_evidence_files.py
# -----------------------------------------------------------------------------
name: CI (offline)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 仓库的诊断输出是中文（CJK），固定 UTF-8 免得 runner 上 locale 不同导致乱码。
  PYTHONIOENCODING: utf-8
  PYTHONDONTWRITEBYTECODE: "1"
  # 单门禁预算 15 分钟（与上游同值）。
  # 仅 m5_judge --selftest 一项实测就要 ~233 s，给足才不会被误判超时。
  GATE_TIMEOUT: "900"

jobs:
  # ===========================================================================
  # 1/5 聚合离线门禁（上游 offline:gates）
  # ===========================================================================
  offline-registry-gates:
    name: Offline registry gates (gate_runner + check_offline_gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ★ 本作业**按设计不阻塞**，看到红叉请先读这段再"修"。
    #   `gate_runner.py --offline` 会把每条 class=offline 门禁的结论写进
    #   tmp/gate_runner_evidence/summary.json，并在有 FAIL 时退 1、有 BLOCKED 时退 2；
    #   `ci/check_offline_gates.py` 再加一层"声明面 ↔ 实测面"断言，blocked>0 ⇒ 退 1。
    #   在**本导出树**里它拿不到全绿，且原因全部是"上游刻意不随源码分发的资产"：
    #     · `tmp/` 证据（真机快照、探针原始输出）未随包 ⇒ 依赖证据的门禁判 BLOCKED
    #       （缺资产一律 BLOCKED，绝不当 PASS —— 这是本项目的三态纪律）；
    #     · 内部设计文档未随包 ⇒ 文档表格/引用类门禁按"更少的输入"报 FAIL。
    #   要把这个作业变绿，只能把证据与内部文档塞回公开仓 —— 那正是导出时删掉的东西。
    #   故此处保留"跑 + 打印分级结论 + 上传证据包"，但不阻断流水线；
    #   真实的 PASS/FAIL/BLOCKED 分级逐次打印在日志里，并可按等级复查。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          # 与上游的依赖清单保持一致，并补上离线断言需要的 jsonschema：
          # 23 条离线门禁里有几条会 import 这些包，缺包会变成假 FAIL。
          python -m pip install "pyyaml>=6" "rdflib>=7" "fastapi>=0.110" "pydantic>=2" \
            "uvicorn>=0.27" "starlette>=0.36" "httpx>=0.27" "requests>=2" "paramiko>=3" \
            "jsonschema>=4" "pytest>=8"
      - name: Run the offline gate registry
        id: gate_runner
        # 退 1/2 是"门禁结论"，由下一步负责断言；本步先不中断。
        continue-on-error: true
        run: python shared/verify/gate_runner.py --offline --allow-partial --timeout "$GATE_TIMEOUT" --json
      - name: Assert the gate report (ci/check_offline_gates.py)
        if: always()
        run: |
          echo "gate_runner.py outcome: ${{ steps.gate_runner.outcome }} (failure = 有 FAIL 或 BLOCKED，见上一步日志)"
          python ci/check_offline_gates.py
      - name: Upload the gate evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-runner-evidence
          path: tmp/gate_runner_evidence/
          if-no-files-found: warn

  # ===========================================================================
  # 2/5 服务/工具自检 —— 离线且可自足的那 7 条（上游 offline:selftests 的 9 条里）
  # ===========================================================================
  service-selftests:
    name: Selftest — ${{ matrix.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 上游把 9 条塞进一个 shell 脚本、自己聚合 rc，理由是
    # `set -e` 会只让你看到第一个失败。matrix 达到同一目的且更好：每条一个作业、
    # 各自归因、并行跑、失败不互相遮挡。
    strategy:
      fail-fast: false
      matrix:
        selftest:
          - scheme1-kg/service/cc_tools.py
          - scheme1-kg/service/cc_tools_kgt.py
          - scheme2-onto/service/cc_tools_onto.py
          - shared/verify/m5_judge.py
          - shared/deploy/smoke/m5_run.py
          - shared/deploy/smoke/e2e_smoke.py
          - shared/deploy/check_fairness.py
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6" "rdflib>=7" "fastapi>=0.110" "starlette>=0.36" \
            "pydantic>=2" "uvicorn>=0.27" "httpx>=0.27" "requests>=2" "paramiko>=3" "jsonschema>=4"
      # ★ 刻意**不**生成任何 `.env`：这 7 条在"树里没有任何 .env"的环境下实测全 PASS。
      #   而 `deploy/.env.example` 里有 DIFY_BASE_URL / 口令等键 —— 生成的 `.env` 若被
      #   `shared/deploy/dify/common.py:48-61` 的候选列表命中（<repo>/.env 就在列表首条），
      #   会把本来自判"离线"的自检**推成在线**分支，反而更不稳。
      #   `deploy/selfcheck.py` 也不读 `deploy/.env`（只把 `deploy/.env.example` 当模板，
      #   见 deploy/selfcheck.py:201,215），所以整条流水线都不需要创建它。
      # ★ m5_judge --selftest 的合成夹具写在**固定路径** tmp/m5_judge_selftest/
      #   （shared/verify/m5_judge.py:1245）⇒ 同一个检出里**并发**跑两次这条自检会互相
      #   删夹具、报 FileNotFoundError: tmp/m5_judge_selftest/cases_syn.yaml。
      #   本流水线每条自检一个独立 runner，不存在并发写者，故它保持阻塞；
      #   本地想并发复跑请串行（或给该自检一个每次唯一的 tmp 目录）。
      - name: Run ${{ matrix.selftest }} --selftest
        run: python ${{ matrix.selftest }} --selftest

  # ===========================================================================
  # 3/5 上游 9 条自检里**在公开树无法通过**的 2 条 —— 仅告警，不阻塞
  # ===========================================================================
  selftest-drift-advisory:
    name: Advisory (non-blocking) — ${{ matrix.selftest }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 为什么单独放这里、而不是混进上面那 7 条：
    #   ① `shared/collect/live_facts_service.py --selftest`
    #      38 项控制里 37 OK / 1 BLOCKED ⇒ 退 3。唯一阻塞项：
    #        BLK c26_upstream_baseline_hashes :: shared/collect/freeze.py 基线 dea509b4e1d33702
    #            != 实算 329b7a0a2c6dbabc；shared/collect/live_facts.py 基线 e9c819c61be0d553
    #            != 实算 e5ee28b9b5c56225（上游封装层换代 + 导出期改写动了这两个文件 ⇒ 基线过期，
    #            脚本自己也写明"不是本服务缺陷"）。缺的是资产/基线，不是代码写错；
    #        BLOCKED 是本项目的正确结论（三态纪律：缺资产一律 BLOCKED，绝不当 PASS）。
    #   ② `shared/deploy/dify/register_tools.py --selftest`
    #      41 项里 39 PASS、2 FAIL：
    #        FAIL P02 模型契约指纹与登记一致  ->  shared/model/kgt-tools.yaml 实测 27200 字节 /
    #             sha256 b0d86a580e2b9f4aeb312bfc12f31ac166ae264ed8e27529208856b56d86774b，
    #             登记值 27207 字节 / aded136a6c20c7979c528a58cb8993c4e38b39b374697ab905dffaa3322f0eab
    #             （导出期的脱敏改写动了该文件，而 binding.yaml 里的指纹没跟着改）
    #        FAIL P08 离线端到端 check 通过（FakeTransport）  <- 与 P02 同源的下游断言
    #      这是**导出树自身的登记漂移**，修法在导出侧（改登记或改文件），不该由 CI 掩盖。
    #   保留它们是为了"看得见"：删掉等于把一个已知缺陷变成无人可见；放进阻塞档等于
    #   让每个使用者第一次跑 CI 就见到红。故：跑、打印、不阻塞。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        selftest:
          - shared/collect/live_facts_service.py
          - shared/deploy/dify/register_tools.py
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6" "rdflib>=7" "fastapi>=0.110" "starlette>=0.36" \
            "pydantic>=2" "uvicorn>=0.27" "httpx>=0.27" "requests>=2" "paramiko>=3" "jsonschema>=4"
      - name: Run ${{ matrix.selftest }} --selftest
        run: python ${{ matrix.selftest }} --selftest

  # ===========================================================================
  # 4/5 离线单测（上游 offline:unit-tests）
  # ===========================================================================
  pytest-offline:
    name: pytest (offline unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install offline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyyaml>=6" "rdflib>=7" "fastapi>=0.110" "starlette>=0.36" \
            "pydantic>=2" "uvicorn>=0.27" "httpx>=0.27" "requests>=2" "jsonschema>=4" "neo4j>=5" "pytest>=8"
      # 故意**不**像上游那样写死 5 个文件路径，而是裸跑：
      #   裸 `pytest` 才会走 pyproject.toml 的 [tool.pytest.ini_options]，从而证明
      #   "新人第一次 pytest 不会崩" 这条承诺（见 pyproject.toml 里 --ignore 的成因注释：
      #   scheme1-kg/tests/test_integrity.py 在 **import 期** fail-closed 退出，
      #   会把整轮收集打成 INTERNALERROR / exit 3）。
      - name: Run pytest (offline suite, config from pyproject.toml)
        run: python -m pytest
      - name: Assert the live-only integrity tests stayed out of the default run
        run: |
          set -euo pipefail
          out="$(python -m pytest --collect-only -q)"
          echo "$out"
          if grep -q "test_integrity" <<<"$out"; then
            echo "::error::scheme1-kg/tests/test_integrity.py 或 scheme2-onto/tests/test_integrity.py 被收集了；默认收集必须只含离线用例（见 pyproject.toml 的 [tool.pytest.ini_options]）"
            exit 1
          fi
          echo "OK: 两个在线 test_integrity.py 均未被默认收集"

  # ===========================================================================
  # 5/5 发布一致性静态自检（上游 offline:release-consistency）
  # ===========================================================================
  release-consistency:
    name: Release consistency (deploy/selfcheck.py)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # 零第三方依赖：脚本只 import argparse/ast/json/os/re/sys/pathlib（标准库）。
      # 它挡的是容器化里最容易静默失效的一类问题：compose 的 ${VAR} 没有来源、
      # 代码读的键名与模板不一致、Dockerfile 的 COPY 源因目录改名失效。
      # `dist/collect-layer/`（本仓采集层源码树，随本仓分发）的 COPY 源必须真在；
      # `tmp/ccf_live5.json`（真机基底快照）**刻意不发**，脚本只放行这一类 COPY 源
      # （deploy/selfcheck.py:164-197，理由见仓库根的 NOTICE），因此本作业在公开树里
      # 是真断言而不是空跑：实测 22 条断言全 OK、退 0 ⇒ 保持阻塞。
      - name: Run the release consistency self-check
        run: python deploy/selfcheck.py
      - name: Upload the self-check workspace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-consistency-work
          path: deploy/.work/
          if-no-files-found: warn
