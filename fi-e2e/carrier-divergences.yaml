schema: fi-carrier-divergences/1
meta:
  version: 1.1.0
  date: '2026-10-13'
  measured_on: ccf-20261013T125036Z-9f23f5
  measured_with:
    ccf: fi-e2e/out/c1fix/cpu_throttle/ccf.json
    symptom_set:
    - FM-APP-ENDPOINT-SLOW
    - FM-HOST-MEM-PRESSURE
    cause_max_hops: 4
    note: 两侧同一 snapshotId、同一症状集、同一 maxHops；C1 由 fi.py 前置闸门断言成立后方才测量
  totals_at_measurement:
    compared_fault_codes: 12
    diverging_field_pairs: 9
    undeclared: 0
    note: diverging_field_pairs = (码,字段) 对的去重计数；7 条独立 + 2 条派生（CD-08/CD-09）
  disposition_enum:
    carrier_native: 载体原生表达力差异（LPG 边属性 vs OWL 关系属性 / 条款挂法不同）——按设计保留，不抹平
    to_investigate: 尚未定位到根因，已登记待查（不得当已知无害）
    harness_artifact: 两侧一致性由测试器自身口径造成，非载体属性
  divergence_set_is_symptom_set_dependent: ★ 分歧集**依赖症状集**：同一对载体，换一组症状码就会暴露新的 (码,字段) 分歧。例：症状集 {FM-APP-ENDPOINT-SLOW, FM-HOST-MEM-PRESSURE} 下 FM-HOST-MEM-PRESSURE 无分歧；而在 cpu_throttle 自产的 6 个症状码下出现 CD-10..CD-13。⇒ 登记须连同**症状集**一起记；「未声明 = 0」只对**该症状集**成立。批次报告必须同时给出「本次症状集」与未声明数。
  totals_at_measurement_updated:
    entries: 24
    note: CD-20..CD-24 由**新启用的 componentInstance 维度**首次扫描即发现（45 行）⇒ CD-19 不是孤例而是**系统性**问题：实例选择差异覆盖 ≥6 个码。
  entry_semantics: '★ 登记的是「**该 (码,字段) 存在分歧**」这一**事实**，kg/onto 取值是**证据**而非**断言**：实测分歧取值随**症状集**变化。故分类器默认 value_check=kind_only（(码,字段) 已登记即算 declared，并回显当轮实测值）；若某条也想钉住取值，在该条显式写 value_check: exact。真正的回归信号 = 出现**未登记的 (码,字段)**。'
  resolution_2026_10_13_instfix:
    what: 实例选择键对齐 + ONTO `determined` 定义修正（已部署并验证）
    before_after:
      instance_agreement: 21/35 → 34/35
      determined_agreement: 31/35 → 32/35
      onto_top1: 不再是 FM-APP-POOL-EXHAUSTED（该常量是 determined 定义错的产物）
      ranking_effect: container_pause 例：KG top1 由 sat=0 的常量变为 FM-DB-LOCK-WAIT（sat=1）⇒ 排序修正与实例修正**叠加生效**
    not_yet_fixed: ★ 诚实边界：`satisfiedClauses>0` **没有改善**（KG 1→1、ONTO 0→0）。两侧现在选同一个实例了，但**该实例上期望码的判据条款确实不成立** ⇒ 问题已从「排序/选择失真」转为**实质问题**：故障是否真的产生了契约判据所要求的条件，或指标证据是否被归到该码的组件实例上。
entries:
- id: CD-01
  code: FM-APP-POOL-EXHAUSTED
  field: determined
  kg: false
  onto: true
  disposition: to_investigate
  claim: 同一快照同一症状集下，该码在 ONTO 侧被判「全部条款可判定」，KG 侧判「有 UNK 条款」。
  evidence:
    snapshot: ccf-20261013T125036Z-9f23f5
    kg:
      determined: false
      satisfiedClauses: 0
      totalClauses: 4
      undeterminedClauses: 3
    onto:
      determined: true
      satisfiedClauses: 0
      totalClauses: 4
      undeterminedClauses: 3
  hypothesis: 该码 4 条判据含 `app.datasource.pending_threads`（该指标在本环境**无采集通道**） 与两条阈值条款；两侧对「无观测条款是否计入 undetermined」的处理不同。 ★ 注意 KG 侧 undeterminedClauses=3 而 determined=false、ONTO 侧同为 3 但 determined=true ⇒ **两侧的 determined 与 undeterminedClauses 之间存在口径不一致**（这才是真问题）。
  next: 查两侧 determined 的赋值处，统一为「undeterminedClauses == 0 ⇒ determined」
- id: CD-02
  code: FM-APP-DS-CONNECT-FAIL
  field: totalClauses
  kg: 3
  onto: 1
  disposition: carrier_native
  claim: 两侧该码的判据条款条数不同（3 vs 1）。
  evidence:
    snapshot: ccf-20261013T125036Z-9f23f5
    note: 契约 fault-modes.yaml 该码的 detect.all_of 只有 1 条（connect_fail_total increased）⇒ **ONTO 侧的 1 条与契约一致**，KG 侧多出 2 条
  hypothesis: KG 侧把识别/排除条款（如排除项 db.instance.up / connect_latency_ms）也并入了 totalClauses， 而 ONTO 侧只计 necessary 条款。契约的 `detect` 只声明 all_of/any_of 主体， 「排除条款是否计入」在契约里**未规定** ⇒ 这属于契约真空，两侧各按自己的读法实现。
  next: 契约补一句「totalClauses 的计数口径（是否含 exclusion/区分/排除条款）」
- id: CD-03
  code: FM-DB-LOCK-WAIT
  field: totalClauses
  kg: 2
  onto: 5
  disposition: carrier_native
  claim: 两侧该码的判据条款条数不同（2 vs 5）。
  evidence:
    snapshot: ccf-20261013T125036Z-9f23f5
    note: 契约该码 detect.all_of 为 2 条（wait_event in_enum + xact_age_s > 阈值）⇒ **KG 侧的 2 条与契约一致**
  hypothesis: ONTO 侧把该码的 5 条判据个体都算进 totalClauses（可能含 tier 展开或区分条款）， KG 侧只算契约 all_of 的 2 条。与 CD-02 同源（计数口径未规定）。
  next: 与 CD-02 合并处理：契约明确 totalClauses 口径
- id: CD-04
  code: FM-APP-HEAP-PRESSURE
  field: relationPriority
  kg: causes
  onto: conditional_causes
  disposition: carrier_native
  claim: 同一因果路径上，入边关系类型两侧读法不同（causes vs conditional_causes）。
  evidence:
    snapshot: ccf-20261013T125036Z-9f23f5
  hypothesis: LPG 侧边只有 `CC_CAUSES` / `CC_CONDITIONAL_CAUSES` 两种标签， 而 OWL 侧同一对节点间可能同时存在 `causes` 与 `conditional_causes` 两条关系 ⇒ 「取哪一条」的优先级两侧不同。契约 causal-edges.yaml 的 `relation_enum` 没有规定「多关系并存时取哪条」。
  next: 契约补「同一对节点多关系并存时的取值优先级」
