  cardsim_layer: 应用/Java
  target: 应用内
  mechanism: "每 10 事务开 1 条直连且永不关闭，上限 200 ⇒ fd + 库侧会话双增长"
  match_kind: exact
  expect_codes: [FM-DB-SESSION-POOL-FULL]
  expect_symptoms: [FM-APP-POOL-EXHAUSTED]
  signature_metrics: [db.instance.session_count, db.pool.session_used_ratio, app.fd_count]
  note: "session_used_ratio 有观测，但 all_of 还要求 conn_rejected_total increased（无通道）⇒ 不可判；裸 fd 数需 root（缺口 D2）"

- type: java_thread_pile
  label: "线程堆积"
  group: Java反模式
  cardsim_layer: 应用/Java
  target: 应用内
  mechanism: "每 50 事务新建 50 个长睡线程，上限 400（每 50 tick 触发）"
  match_kind: no_counterpart
  expect_codes: []
  expect_symptoms: [FM-APP-ENDPOINT-SLOW]
  signature_metrics: [app.thread_count, app.endpoint.tps]
  note: "app.thread_count 有观测（实测 20，故障可达 400+），但契约无『线程堆积』根因码"

# ─────────────────────────────── 类6 会话与认证 ───────────────────────────────
- type: sql_idle_in_tx
  label: "idle in transaction 堆积"
  group: 会话与认证
  cardsim_layer: 应用/SQL
  target: 应用内
  mechanism: "4 条直连各自 BEGIN + FOR UPDATE 挂起不提交"
  match_kind: exact
  expect_codes: [FM-DB-IDLE-IN-TX]
  expect_symptoms: [FM-DB-LOCK-WAIT]
  signature_metrics: [db.instance.idle_in_xact, db.instance.lock_waits, db.session.state]

- type: sql_lock_chain
  label: "锁等待链"
  group: 会话与认证
  cardsim_layer: 应用/SQL
  target: 应用内
  mechanism: "链头持锁 row8 → 中间等待 → 业务线程三级排队"
  match_kind: exact
  expect_codes: [FM-DB-LOCK-WAIT]
  expect_symptoms: [FM-DB-SLOW-QUERY]
  signature_metrics: [db.instance.lock_waits, db.session.wait_event, db.session.xact_age_s]

- type: sql_conn_storm
  label: "登录连接风暴"
  group: 会话与认证
  cardsim_layer: 应用/SQL
  target: 应用内
  mechanism: "每 25 事务突发 30 条直连即关"
  match_kind: exact
  expect_codes: [FM-DB-SESSION-POOL-FULL]
  expect_symptoms: []
  signature_metrics: [db.instance.session_count, db.instance.active_sessions, db.pool.session_used_ratio]
  note: "瞬时快照易错过尖峰；判据 conn_rejected_total 无通道 ⇒ 不可判"

- type: sql_auth_fail
  label: "认证失败风暴"
  group: 会话与认证
  cardsim_layer: 应用/SQL
  target: 应用内
  mechanism: "每 20 事务 10 次错误密码连接"
  match_kind: exact
  expect_codes: [FM-APP-DS-CONNECT-FAIL]
  expect_symptoms: []
  discrimination_leaf: FM-APP-AUTH-INCOMPATIBLE
  signature_metrics: [app.datasource.connect_fail_total, app.datasource.connect_latency_ms]
  note: "★ 契约把『认证不兼容』建成 exclusion 叶（causal-edges.yaml:292-303）：排除法判定 = DB在线 ∧ 网络可达 ∧ 立即失败。connect_* 无通道 ⇒ 不可判"
